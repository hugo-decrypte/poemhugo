	"[/*IDTOUR*/]    [/*T1TOUR*/] - [/*T2TOUR*/]    " TAG_ORDER_NB " [/*NBORDER*/]    " TAG_PALLET_NB " [/*QUANTITY*/]    " TAG_WEIGHT " [/*WEIGHT*/]    " TAG_MILEAGE " [/*MILEAGE*/]    " TAG_WORKTIME " [/*WORKTIME*/]"
),

