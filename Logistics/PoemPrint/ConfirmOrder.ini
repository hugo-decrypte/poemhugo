DATA1=INFO_ADRESS
NAME1=InfoAdress

SQL1=SELECT 
SQL1_1=   IIF (CL.Country='France' , 'Date : ' + mid(str(Now()),1,2) +' '+ MTD.NameFR +' '+ mid(str(Now()),7,4) ,
SQL1_2=    'Date : ' + MTD.NameEN +' '+ mid(str(Now()),1,2) +', '+  mid(str(Now()),7,4) ) as DateFactC1,
SQL1_3=   IIF (CL.Country='France' , 'Commande : '+ O.Id , 'Order no : '+ O.Id) as IdCommandC2,
SQL1_4=   IIF (CL.Country='France' , 'Date commande : ' + mid(str(O.DateOrder),8,2) +' '+ MCM.NameFR +' '+ mid(str(O.DateOrder),2,4) ,
SQL1_5=    'Order date : '  + MCM.NameEN +' '+ mid(str(O.DateOrder),8,2) + ', '+ mid(str(O.DateOrder),2,4)) as DateCommandC3,
SQL1_6=   IIF (CL.Country='France' , 'Notre Référence : ' , 'Our reference: ') + iif (O.Reference is not NULL, O.Reference, ' ') as ReferenceC4,
SQL1_7=   IIF (CL.Country='France' , 'Destinataire' ,  'Recipient') as TitleAdressC5, 
SQL1_8=   CL.Name as NameCliC6, 
SQL1_9=   CL.Address as AddresCliC7, 
SQL1_10=  CL.AddressSup as AddresSupCliC8, 
SQL1_11=  TRIM(CL.PostCode) + '   ' + CL.City as PostCodeCityC9, 
SQL1_12=  IIF (CL.Country='France' , ' ' , CL.Country) as CountryC10
SQL1_13= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}MONTHLABEL MTD, {/*OWNER*/}MONTHLABEL MCM
SQL1_14= WHERE CL.Id=O.IdClient 
SQL1_15=   AND MTD.NoMonth=int(mid(str(Now()),4,2))
SQL1_16=   AND MCM.NoMonth=int(O.DateOrder/100)-int(O.DateOrder/10000)*100
SQL1_17=   AND O.Id in ({/*PARAM4*/})




DATA2=INFO_ORDERS
NAME2=INFOORDERS

SQL2=SELECT 
SQL2_1=   LC.IdProduct as C1,
SQL2_2=   A.Designation as "DesigC2",
SQL2_3=   IIF (LC.DateDelivery is not NULL and LC.DateDelivery>0, mid(str(LC.DateDelivery),8,2) +'/'+ mid(str(LC.DateDelivery),6,2) +'/'+ mid(str(LC.DateDelivery),2,4), ' ') as "DateLivC3",
SQL2_4=   LC.Quantity as "QTYC4",
SQL2_5=   str(int(LC.PriceUnit))+','+right(str(int((LC.PriceUnit)*10000)),4) as C5,
SQL2_6=   IIF (LC.Discount is not NULL and LC.Discount>0 , str(int(LC.Discount))+','+right(str(int((LC.Discount)*10)),1) +'%' , ' ') as C6,
SQL2_7=   IIF (LC.Discount is not NULL and LC.Discount>0 , str(int(LC.Quantity*LC.PriceUnit*(LC.Discount)/100))+','+right(str(int((LC.Quantity*LC.PriceUnit*(LC.Discount)/100)*100)),2), ' ') as C7,
SQL2_8=   str(int(LC.Quantity*LC.PriceUnit*(100-LC.Discount)/100))+','+right(str(int((LC.Quantity*LC.PriceUnit*(100-LC.Discount)/100)*100)),2) as C8
SQL2_9=  FROM {/*OWNER*/}Order_Product LC, {/*OWNER*/}PRODUCT A
SQL2_10= WHERE LC.IdOrder={/*PARAM4*/}
SQL2_11=   AND LC.IdProduct=A.ID 
SQL2_12= ORDER BY LC.DateDelivery, LC.IdProduct


DATA3=LINE_TOTAL
NAME3=LINETOTAL

SQL3=SELECT 
SQL3_1=   'TOTAL' as C1,
SQL3_2=   ' ' as "DesigC2",
SQL3_3=   ' ' as "DateLivC3",
SQL3_4=   ' ' as "QTYC4",
SQL3_5=   ' ' as C5,
SQL3_6=   ' ' as C6,
SQL3_7=   str(int(sum(LC.Quantity*LC.PriceUnit*(LC.Discount)/100)))+','+right(str(int((sum(LC.Quantity*LC.PriceUnit*(LC.Discount)/100))*100)),2)  as C7,
SQL3_8=   str(int(sum(LC.Quantity*LC.PriceUnit*(100-LC.Discount)/100)))+','+right(str(int((sum(LC.Quantity*LC.PriceUnit*(100-LC.Discount)/100))*100)),2) as C8,
SQL3_9=   LC.IdOrder as C9 
SQL3_10= FROM {/*OWNER*/}Order_Product LC
SQL3_11= WHERE LC.IdOrder={/*PARAM4*/}
SQL3_12= GROUP BY LC.IdOrder

/////////////////////////
DATA4=INFO_TITLE
NAME4=InfoTitre


SQL4=SELECT DISTINCT
SQL4_1=   'Référence' as C1, 'Désignation' as C2, 'Date de' as C3, 'livraison' as C4, 'prévue' as C5, 
SQL4_2=   'Quantité' as C6, 'Prix d''achat' as C7, 'unitaire en' as C8, 'EUR' as C9,
SQL4_3=   '%' as C10, 'Remise' as C11, 'Montant net' as C12, 'H.T. en' as C13, 'EUR' as C14, Comments as C15
SQL4_4= FROM {/*OWNER*/}CLIENTORDER O
SQL4_5= WHERE O.Id={/*PARAM4*/}



/////////////////////////
DATA5=INFO_DESTIN
NAME5=InfoDestination

SQL5=SELECT DISTINCT
SQL5_1=   'Date : ' + mid(str(Now()), 1,10)  as C1, 
SQL5_2=   'Désignation' as C2, 
SQL5_3=   'Date de' as C3, 
SQL5_4=   'livraison' as C4,  
SQL5_5=   'prévue' as C5, 
SQL5_6=   'Quantit ' as C6, 
SQL5_7=   'Prix d''achat' as C7, 
SQL5_8=   'unitaire en' as C8, 
SQL5_9=   'EUR' as C9,
SQL5_10=   '%' as C10
SQL5_11= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL5_12= WHERE CL.Id=O.IdClient and O.Id={/*PARAM4*/}



//////////////
DATA6=MY_ADRESS
NAME6=MYADRESS

SQL6=SELECT 
SQL6_1=   iif(AG.NAME is not NULL, AG.NAME, ' ') as Nom,
SQL6_2=   iif(AG.LABEL is not NULL, AG.LABEL, ' ') as Label,
SQL6_3=   iif(AG.ADDRESS is not NULL, AG.ADDRESS, ' ') as Adr,
SQL6_4=   iif(AG.ADDRESSSUP is not NULL, AG.ADDRESSSUP, ' ') as Adr2,
SQL6_5=   iif(AG.PostCode is not NULL, AG.PostCode, ' ') as CodePost,
SQL6_6=   iif(AG.City is not NULL, AG.City, ' ') as City,
SQL6_7=   iif(AG.Country is not NULL, AG.Country, 'France') as Country,
SQL6_8=   iif(AG.Phone is not NULL, AG.Phone, ' ') as Phone,
SQL6_9=   iif(AG.Fax is not NULL, AG.Fax, ' ') as Fax,
SQL6_10=  iif(AG.EMAIL is not NULL, AG.EMAIL, 'Email ') as Mail,
SQL6_11=  iif(AG.NumTVA is not NULL, 'N° TVA : '+AG.NumTVA, 'N° TVA : ') as NoTVA,
SQL6_12=  iif(AG.Siret is not NULL, 'SIRET : '+ trim(AG.Siret), 'SIRET : ') +
SQL6_13=  iif(AG.RCS is not NULL, ' - RCS : ' + trim(AG.RCS), ' - RCS : ')  +
SQL6_14=  iif(AG.APE is not NULL, ' - APE : ' + AG.APE, ' - APE : ') as InfoRegistre,
SQL6_15=  iif(AG.Siret is not NULL, AG.Siret, ' ') as Siret,
SQL6_16=  iif(AG.RCS is not NULL, AG.RCS, ' ') as RCS,
SQL6_17=  iif(AG.APE is not NULL, AG.APE, ' ') as APE
SQL6_18= FROM {/*OWNER*/}CLIENTORDER O left join {/*OWNER*/}AGENCY AG on AG.ID=O.IdAgency
SQL6_19= WHERE O.Id={/*PARAM4*/}



