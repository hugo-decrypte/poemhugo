// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   IIF(AG.NAME is not NULL,AG.NAME,' ') as Nom,
SQL1_2=   IIF(AG.LABEL is not NULL,AG.LABEL,' ') as Label,
SQL1_3=   IIF(AG.ADDRESS is not NULL,AG.ADDRESS,' ') as Adr,
SQL1_4=   IIF(AG.ADDRESSSUP is not NULL,AG.ADDRESSSUP,' ') as Adr2,
SQL1_5=   IIF(AG.PostCode is not NULL,AG.PostCode,' ') as CodePost,
SQL1_6=   IIF(AG.City is not NULL,AG.City,' ') as City,
SQL1_7=   IIF(AG.Country is not NULL,AG.Country,'France') as Country,
SQL1_8=   IIF(AG.Phone is not NULL,AG.Phone,' ') as Phone,
SQL1_9=   IIF(AG.Fax is not NULL,AG.Fax,' ') as Fax,
SQL1_10=  IIF(AG.EMAIL is not NULL,AG.EMAIL,' ') as Mail,

SQL1_11=  IIF(AG.Capital is not NULL,AG.Capital,'Type Société : ________ au capital de ______ _') as TypeCompagny,
SQL1_12=  ('TVA Intracom : '+ IIF(AG.codeTax is not NULL,AG.codeTax,' ') ) as NoTVA,
SQL1_13=  IIF(AG.establishment is not NULL,AG.establishment,'SIRET :') as Siret,
SQL1_14=  IIF(AG.RCS is not NULL,AG.RCS,'RCS :') as RCS,
SQL1_15=  IIF(AG.APE is not NULL,AG.APE,'APE :') as APE,

SQL1_16=  ('SIRET : '+ IIF(AG.establishment is not NULL,trim(AG.establishment),' ') +' - RCS : '+ IIF(AG.RCS is not NULL,trim(AG.RCS),' ') +' - APE : '+ IIF(AG.APE is not NULL,AG.APE,' ') ) as InfoRegistre,
SQL1_17=  (select ('IBAN : '+ IIF(B.IBAN is NULL,' ',trim(B.IBAN)) +' - BIC : '+ IIF(B.BIC is NULL,' ',trim(B.BIC)) +'  '+ IIF(B.Name is NULL,' ',trim(B.Name)) ) from {/*OWNER*/}BANKACCOUNT B where B.ID='{/*BANKACCOUNT*/}') as BankInfo,
SQL1_18=  IIF('{/*COUNTRY*/}' in ('France','FRANCE'),('Imprimée le '+ format(Now(), 'DD/MM/YYYY, hh:nn:ss')) ,('Printed '+ format(Now(), 'YYYY-MM-DD, hh:nn:ss')) ) as PrintDate,

SQL1_19=  '{/*TITLEDOC*/}' as TitleDoc,
SQL1_20=  '{/*TITLECODEOBJ*/}' as TitleObj,
SQL1_21=  '{/*CODEOBJ*/}' as CodeObj,
SQL1_22=  '{/*TITLEDATEOBJ*/}' as TitleDateObj,
SQL1_23=  '{/*DATEOBJ*/}' as DateObj,
SQL1_24=  '{/*TITLEREFERENCEOBJ*/}' as TitleRefObj,
SQL1_25=  '{/*REFERENCEOBJ*/}' as RefObj
SQL1_26= FROM {/*OWNER*/}AGENCY AG
SQL1_27= WHERE  AG.Id='{/*CODEAGENCY*/}'

// compagny Registre info, BankInfo in FOOTER




//////////////
DATA2=SEL_OBJ
NAME2=Objet

SQL2=SELECT 
SQL2_1=   D.Id as CODEDELIVERY, 
SQL2_2=   D.IdAgency as CODEAGENCY, 
SQL2_3=   CL.Id as CODECLIENT, 
SQL2_4=   CL.BankAccount as BANKACCOUNT, 
SQL2_5=   CL.Country as COUNTRY, 
SQL2_6=  ( IIF(CL.Country in ('France','FRANCE'),'Facture  ','Invoice   ') + IIF(D.IdInvoice is NULL,' ',D.IdInvoice) ) as TITLEDOC,
SQL2_7=  IIF(CL.Country in ('France','FRANCE'),'Livraison No : ','Delivery no : ') as TITLECODEOBJ,
SQL2_8=  D.Id as CODEOBJ,
SQL2_9=  IIF(CL.Country in ('France','FRANCE'),'Date de Livraison : ','Delivery date : ') as TITLEDATEOBJ,
SQL2_10=  IIF(CL.Country in ('France','FRANCE'), ( mid(D.DateDelivery,9,2)+'/'+mid(D.DateDelivery,6,2)+'/'+mid(D.DateDelivery,1,4)) , ( mid(D.DateDelivery,1,4)+'-'+mid(D.DateDelivery,6,2)+'-'+mid(D.DateDelivery,9,2)) ) as DATEOBJ,
SQL2_11=  IIF(CL.Country in ('France','FRANCE'),'Client No : ','Client No : ') as TITLEREFERENCEOBJ,
SQL2_12=  D.RefInvoice as REFERENCEOBJ,
SQL2_13=   D.IdClub as CODECLUB
SQL2_14= FROM {/*OWNER*/}DELIVERY D left join {/*OWNER*/}CLIENT CL on CL.Id=D.IdClient
SQL2_15= WHERE D.IdTour in ({/*PARAM4*/})



// client info used in INSTR3
DATA3=INFO_FACTURE
NAME3=InfoFacture

SQL3=SELECT DISTINCT
SQL3_1=   (IIF( CL.Country='France','No facture : ','Invoice no : ' ) + IIF(D.IdInvoice is NULL , ' ',D.IdInvoice )) as IdFacture,
SQL3_2=   IIF(CL.Country='France',('Date facture : ' + format(D.DateInvoice,'DD ')+ MI.NameFR + ' ' + format(D.DateInvoice, 'YYYY') )
SQL3_3=     ,('Date invoice : ' + MI.NameEN +' '+format(D.DateInvoice,'DD, YYYY')) ) as DateFact,
SQL3_4=   IIF(CL.Country='France',('Date échéance : ' + format(D.DatePayment, 'DD ') + MP.NameFR +' '+ format(D.DatePayment, 'YYYY'))
SQL3_5=    ,('Payment Due : '  + MP.NameEN +' '+ format(D.DatePayment, 'DD, YYYY'))) as DateMaxPayment,
SQL3_6=   IIF(CL.Country='France','Adresse de livraison','Shipping adress') as TitleAdressDeliv, 
SQL3_7=   PT.NameClient as PtDeliv, 

SQL3_8=   PT.Address as AddresDeliv, 
SQL3_9=   PT.AddressSup as AddresSupDeliv, 
SQL3_10=  (TRIM(PT.PostCode) + '   ' + PT.City) as PostCodeCityDeliv, 
SQL3_11=  IIF(CL.Country='France',' ',CL.Country) as CountryDeliv,

SQL3_12=   IIF(CL.Country='France','Adresse de facturation','Billing adress') as TitleAdressFact, 
SQL3_13=   CL.Name as NameFact, 

SQL3_14=   IIF(CL.Country='France','Service comptabilité ','Accountant department') as Compta,
SQL3_15=   CL.Address as AddresFact, 
SQL3_16=   CL.AddressSup as AddresSupFact, 
SQL3_17=   (TRIM(CL.PostCode) + '   ' + CL.City) as PostCodeCityFact, 
SQL3_18=   IIF(CL.Country='France',' ',CL.Country) as Country,

SQL3_19=   ('N° Client : ' + D.IdClient) as ClientNo_C17,
SQL3_20=   ('SIRET : ' + IIF(CL.establishment is NULL,' ',CL.establishment)) as SIRET,
SQL3_21=   (IIF(CL.Country='France', 'N° TVA : '  ,'Customer VAT no.: ') + IIF(CL.codeTax is NULL,' ',CL.codeTax)) as TVANo,
SQL3_22=   (IIF(CL.Country='France', 'Livraison : ','Delivery No : ') + D.Id) as DeliveryNo,
SQL3_23=   (IIF(CL.Country='France', 'Suivi par : ','Followed by: ') + IIF(D.FollowedBy is NULL,' ',D.FollowedBy)) as FollowedBy,
SQL3_24=   (IIF(CL.Country='France', 'Réf : ','Our reference: ') + IIF(D.RefInvoice is NULL,' ',D.RefInvoice)) as Reference,
SQL3_25=   ('Incoterm : ' + IIF(D.Incoterm is NULL,' ',D.Incoterm)) as Incoterm

SQL3_26= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT, {/*OWNER*/}MONTHLABEL MI, {/*OWNER*/}MONTHLABEL MP
SQL3_27= WHERE CL.Id=D.IdClient 
SQL3_28=  AND PT.IdClient=D.IdClient AND PT.IdPoint=D.IdPointDelivery
SQL3_29=   AND MI.NoMonth=format(D.DateDelivery,'MM')+0
SQL3_30=   AND MP.NoMonth=format(D.DatePayment, 'MM')+0
SQL3_31=  AND D.Id='{/*CODEDELIVERY*/}'



//////////////
// detail invoice table header used in INSTR4

DATA4=LINE_FACT_COLHEAD
NAME4=LINEFACTCOLHEAD

SQL4=SELECT DISTINCT
SQL4_1=   IIF(CL.Country='France', 'N°', 'no') as Num,
SQL4_2=   IIF(CL.Country='France', 'Commande', 'Order no') as Package,
SQL4_3=   IIF(CL.Country='France', 'Réference', 'Reference') as QtyP,
SQL4_4=   IIF(CL.Country='France', 'Désignation','DESCRIPTION') as Cmd,
SQL4_5=   IIF(CL.Country='France', 'Quantité', 'Quantity') as Qty,
SQL4_6=   IIF(CL.Country='France', 'Unité', 'Unit') as Unit,
SQL4_7=   (IIF(CL.Country='France', 'PU HT', 'Price')+'('+IIF(D.Currency is NULL,'€',D.Currency)+')') as Price,
SQL4_8=   (IIF(CL.Country='France', 'Montant HT','Amount')+'('+IIF(D.Currency is NULL,'€',D.Currency)+')') as Amount
SQL4_9=  FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL4_10= WHERE CL.Id=D.IdClient
SQL4_11=   AND D.Id='{/*CODEDELIVERY*/}'



// Order table

DATA5=LINE_ORDER
NAME5=LINE_ORDER

SQL5=SELECT 
SQL5_1=   ('Client : '+ trim(CL.Name)+ IIF(CL.Country='France',' Commande ',' Purchase Order : ') + O.Id) as Cmd,
SQL5_2=   format(tabLD.TotalQty,'0') as Quantity,
SQL5_3=   (format(tabLD.TotalHT,'0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceTotal,
SQL5_4=   tabLD.IdD as DELIVID, tabLD.IdO as CMDID, CL.IdClub as CLUBID
SQL5_5=  FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}DELIVERY D,
SQL5_6=   (SELECT DISTINCT 
SQL5_7=      DP.IdDelivery as IdD, DP.IdOrder as IdO, 
SQL5_8=      sum(DP.Quantity) as TotalQty, sum(DP.Quantity/Prd.QuantityPackaging) as TotalPackage, 
SQL5_9=      sum(round(DP.PriceUnit*DP.Quantity*(100.0-IIF(DP.Discount is not NULL and DP.Discount<>0,DP.Discount,0))/100.0, 2)) as TotalHT
SQL5_10=   FROM {/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}PRODUCT Prd
SQL5_11=   WHERE Prd.ID=DP.IdProduct AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL5_12=   Group by DP.IdDelivery,DP.IdOrder ) tabLD
SQL5_13=  WHERE O.Id=tabLD.IdO
SQL5_14=   AND CL.Id=O.IdClient
SQL5_15=   AND D.Id='{/*CODEDELIVERY*/}'




// detail order info table used in INSTR5

DATA6=ORDER_DETAIL
NAME6=OrderDetailInfo

SQL6=SELECT 
SQL6_1=   (select count(1) from {/*OWNER*/}DELIVERY_PRODUCT DP0 inner join {/*OWNER*/}PRODUCT Prd0 on Prd0.ID=DP0.IdProduct where DP0.IdDelivery='{/*DELIVID*/}' and DP0.IdOrder='{/*CMDID*/}' and (Prd0.FAmily<Prd.FAmily or (Prd0.FAmily=Prd.FAmily and Prd0.Designation<=Prd.Designation))) as Num,
SQL6_2=   DP.IdOrder as Cmd,
SQL6_3=   Prd.Id as IdProd,
SQL6_4=   Prd.Designation as Prd,
SQL6_5=   sum(DP.Quantity) as Qty, 
SQL6_6=   max(Prd.Unity) as UNIT,
SQL6_7=   (format(DP.PriceUnit, '0.00')+' '+IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceUnit,
SQL6_8=   (IIF(DP.Discount is not NULL and DP.Discount<>0,format(DP.PriceUnit*sum(DP.Quantity*(100.0-DP.Discount)/100.0),'0.00'),format(DP.PriceUnit*sum(DP.Quantity),'0.00')) +' '+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceTotal,
SQL6_9=   IIF(DP.Discount<>0,( format(DP.Discount,'0.0')+'% '),' ') as Discount,
SQL6_10=  IIF(LP.NoLot is not NULL and LP.NoLot>' ',LP.NoLot,format(LP.DateCreate,'YYYY-MM-DD')) as NoLot,
SQL6_11=  IIF(LP.DateExpiration is not NULL and LP.DateExpiration>'0',format(LP.DateExpiration,'YYYY-MM-DD'),' ') as DateExpiration,
SQL6_12=  DP.IdVAT, DP.IdProduct, Prd.Family
SQL6_13=FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT DP on D.ID=DP.IdDelivery)
SQL6_14=  inner join {/*OWNER*/}PRODUCT Prd on Prd.ID=DP.IdProduct)
SQL6_15=  left join {/*OWNER*/}PALLET_PRODUCT LP on LP.IdPacking=DP.IdPacking and LP.NoPallet=DP.NoPallet and LP.IdProduct=DP.IdProduct
SQL6_16=WHERE DP.IdDelivery='{/*DELIVID*/}' AND DP.IdOrder='{/*CMDID*/}'
SQL6_17=GROUP BY D.Currency, DP.IdProduct, DP.IdOrder, Prd.ID, Prd.Family, Prd.Designation, Prd.PriceUnit, Prd.QuantityPackaging, DP.IdVAT, DP.PriceUnit, DP.Discount, LP.NoLot, LP.DateCreate, LP.DateExpiration
SQL6_18=ORDER BY Prd.FAmily, Prd.Designation





DATA7=INVOICETOTAL
NAME7=INVOICETOTAL
// used in INSTR7
// 2021.02.22 iif discount<0 , Frais service DAP

SQL7=SELECT DISTINCT
SQL7_1=   '1' as ORD, 'TOTAL' as TITLE,
SQL7_2=   (select format(sum(DP.Quantity/P.QuantityPackaging),'0.0') from {/*OWNER*/}DELIVERY_PRODUCT DP inner join {/*OWNER*/}PRODUCT P on P.ID=DP.IdProduct where DP.IdDelivery=D.Id) as Package,
SQL7_3=   D.Quantity as QTY, ' ' as Price, ' ' as Discount,
SQL7_4=   (format(D.AmountHT, '0.00') + IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceHT
SQL7_5=  FROM {/*OWNER*/}DELIVERY D
SQL7_6=  WHERE D.Id='{/*CODEDELIVERY*/}'
SQL7_7=UNION SELECT DISTINCT
SQL7_8=   '2' as ORD,
SQL7_9=   IIF(D.LabelDiscount is not NULL and D.LabelDiscount>' ',D.LabelDiscount,IIF(D.Discount>0,'Frais Service DAP',IIF(CL.Country='France','REMISE','DISCOUNT') ) ) as TITLE, ' '  as Package,
SQL7_10=  format(D.AmountHT, '0.00') as QTY, ' ' as Price, (format(D.Discount,'0.0')+ ' % ') as Discount,
SQL7_11=  (format(D.AmountHT*(-D.Discount)/100.0,'0.00') + IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as DiscountHT
SQL7_12= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL7_13= WHERE CL.Id=D.IdClient AND D.Discount is not NULL AND D.Discount<>0 
SQL7_14=    AND D.Id='{/*CODEDELIVERY*/}'
SQL7_15=UNION SELECT DISTINCT
SQL7_16=  '3' as ORD,
SQL7_17=  'TOTAL H.T.' as TITLE, ' '  as Package,
SQL7_18=  ' ' as QTY, ' ' as Price, ' ' as Discount,
SQL7_19=  (format(D.AmountHT*(100-D.Discount)/100.0, '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as TotalHT
SQL7_20= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL7_21= WHERE CL.Id=D.IdClient AND D.Discount is not NULL AND D.Discount<>0
SQL7_22=    AND D.Id='{/*CODEDELIVERY*/}'

SQL7_23=UNION SELECT DISTINCT
SQL7_24=  '4' as ORD,
SQL7_25=  'Remise Globalisée' as TITLE, ' '  as Package,
SQL7_26=  ' ' as QTY, ' ' as Price, (format((select sum(DP.PriceUnit*DP.Quantity*DP.Discount) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id and DP.Discount is not NULL)/(select sum(DP.PriceUnit*DP.Quantity) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id), '0.00')+ '% ') as Discount,
SQL7_27=  (format((select sum(DP.PriceUnit*DP.Quantity*DP.Discount) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id and DP.Discount is not NULL)/100.0, '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as TotalHT
SQL7_28= FROM {/*OWNER*/}DELIVERY D
SQL7_29= Where exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id and DP.Discount is not NULL and DP.Discount>0)
SQL7_30=    AND D.Id ='{/*CODEDELIVERY*/}'

SQL7_31=UNION SELECT DISTINCT
SQL7_32=  '5' as ORD,
SQL7_33=  'Paiement Anticipé' as TITLE, ' '  as Package,
SQL7_34=  ' ' as QTY, ' ' as Price, ' ' as Discount,
SQL7_35=  (format(-D.AdvancePayment,'0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as TotalHT
SQL7_36= FROM {/*OWNER*/}DELIVERY D
SQL7_37= Where D.AdvancePayment is not NULL and D.AdvancePayment>0
SQL7_38=    AND D.Id ='{/*CODEDELIVERY*/}'
SQL7_39= ORDER BY ORD



// table tatol price in INSTR9
DATA8=TOTAL
NAME8=TOTAL

SQL8=SELECT DISTINCT
SQL8_1=   IIF(CL.Country='France', 'TOTAL H.T.','TOTAL H.T.') as C1,
SQL8_2=   IIF(CL.Country='France', 'TOTAL T.V.A.','TOTAL V.A.T.') as C2,
SQL8_3=   IIF(CL.Country='France', 'TOTAL TTC','TOTAL PRICE') as C3, 
SQL8_4=   IIF(CL.Country='France', 'NET A PAYER','NET TO PAY') as C4, 

SQL8_5=   (format(D.AmountHT*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceHT,
SQL8_6=   (format(tabTVA.TotalTVA*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceTVA,
SQL8_7=   (format(round(tabTVA.TotalTVA*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, 2)+round(D.AmountHT*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, 2), '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as PriceTotal,
SQL8_8=   (format(round(tabTVA.TotalTVA*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, 2)+round(D.AmountHT*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, 2)+round(IIF(D.AdvancePayment is not NULL and D.AdvancePayment>0,-D.AdvancePayment,0),2), '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as NetToPay,

SQL8_9=   IIF(CL.Country='France', 'TAUX T.V.A.','TAUX V.A.T.') as C9,
SQL8_10=  (IIF(tabTVA.MinTVA=tabTVA.MaxTVA,format(tabTVA.MaxTVA,'0.00'),'xx')+ ' %') as TVA,

SQL8_11=  (IIF(CL.Country='France', 'Paiement Anticipé : ','Advance Payment : ')+ IIF(D.AdvancePayment is not NULL and D.AdvancePayment>0,format(D.AdvancePayment,'0.00'),IIF(CL.Country='France','pas d''escompte','without discount') ) ) as Prepay_C11,
SQL8_12=  (select B.PenaltyLatePayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as Pelnal_C12,
SQL8_13=  (select B.CommentsPayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as REGL,
SQL8_14=  IIF(CL.Country='France', ' ','Exonération de T.V.A. Article 262 TER-l du CGI') as ExoTVA,
SQL8_15=  IIF(CL.Country='France',('Date facture : le ' + format(D.DateDelivery, 'DD/MM/YYYY')),('Date Invoice : ' + format(D.DateDelivery,'YYYY-MM-DD') )) as DateFact,
SQL8_16=  IIF(CL.Country='France',('Echéance : le '+ format(D.DatePayment, 'DD/MM/YYYY')),('Payment Due : ' + format(D.DatePayment, 'YYYY-MM-DD') )) as DateMaxPayment,
SQL8_17=   (format(round((tabTVA.TotalTVA+D.AmountHT)*IIF(D.Discount is NULL,100.0,(100.0-D.Discount))/100.0, 2) +IIF(D.AdvancePayment is not NULL and D.AdvancePayment>0,-D.AdvancePayment,0), '0.00')+ IIF(D.Currency is not NULL and D.Currency>' ',D.Currency,' €')) as NetToPay0

SQL8_18= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL,
SQL8_19=   (SELECT DISTINCT 
SQL8_20=      DP.IdDelivery as IdLD, min(T.VAT) as MinTVA, max(T.VAT) as MaxTVA,
SQL8_21=      round(sum(round(DP.PriceUnit*DP.Quantity*(100.0-IIF(DP.Discount is not NULL and DP.Discount<>0,DP.Discount,0))/100.0,2)*T.VAT)/100.0, 2) as TotalTVA 
SQL8_22=    FROM {/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}VAT T 
SQL8_23=    WHERE T.Id=DP.IdVAT AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL8_24=    Group by DP.IdDelivery ) tabTVA
SQL8_25= WHERE CL.Id=D.IdClient and tabTVA.IdLD=D.Id AND D.Id='{/*CODEDELIVERY*/}'



DATA9=REGLE
NAME9=REGLE

SQL9=SELECT DISTINCT
SQL9_1=   IIF(CL.Country='France', ' Règlement de facture à 30 jours date de facture, fin du mois','Terms of sale: 30 days, date of invoice') as C1,
SQL9_2=   IIF(CL.Country='France', ' ','Exonération de T.V.A. Article 262 TER-l du CGI') as C2,
SQL9_3=   IIF(CL.Country='France', 'Règlement de facture : ','Terms of sale: ') as C3,
SQL9_4=   D.Comments as C4, D.CustomsInfo as C5
SQL9_5= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL9_6= WHERE CL.Id=D.IdClient
SQL9_7=    AND D.Id='{/*CODEDELIVERY*/}'




