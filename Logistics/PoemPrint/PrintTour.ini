DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   iif(AG.NAME is not NULL, AG.NAME, ' ') as Nom,
SQL1_2=   iif(AG.LABEL is not NULL, AG.LABEL, 'PRODUITS ORIENTAUX, FRUITS ET LEGUMES SEC, AROMATES, THES, SEMOULES') as Label,
SQL1_3=   iif(AG.ADDRESS is not NULL, AG.ADDRESS, ' ') as Adr,
SQL1_4=   iif(AG.ADDRESSsup is not NULL, AG.ADDRESSsup, ' ') as Adr2,
SQL1_5=   iif(AG.PostCode is not NULL, AG.PostCode, '30660') as CodePost,
SQL1_6=   iif(AG.City is not NULL, AG.City, 'Gallargues-le-Montueux') as City,
SQL1_7=   iif(AG.Country is not NULL, AG.Country, 'France') as Country,
SQL1_8=   iif(AG.Phone is not NULL, AG.Phone, ' ') as Phone,
SQL1_9=   iif(AG.Fax is not NULL, AG.Fax, ' ') as Fax,
SQL1_10=  iif(AG.EMAIL is not NULL, AG.EMAIL, ' ') as Mail,
SQL1_11=  iif(AG.codeTax is not NULL, 'N° TVA : '+AG.codeTax, 'N° TVA : FR95 ') as NoTVA_C11,
SQL1_12=  iif(AG.establishment is not NULL, 'SIRET : '+ trim(AG.establishment), 'SIRET :  ') +
SQL1_13=  iif(AG.RCS is not NULL, ' - RCS : ' + trim(AG.RCS), ' - RCS :  ')  +
SQL1_14=  iif(AG.APE is not NULL, ' - APE : ' + AG.APE, ' - APE : ') as InfoRegistre_C12,
SQL1_15=  iif(AG.establishment is not NULL, AG.establishment, ' ') as Siret,
SQL1_16=  iif(AG.RCS is not NULL, AG.RCS, ' ') as RCS,
SQL1_17=  iif(AG.APE is not NULL, AG.APE, ' ') as APE,
SQL1_18=  'Imprimée le ' + format(Now(), 'DD/MM/YYYY, à HH:MM:SS') as PrintDate_C16 
SQL1_19= FROM {/*OWNER*/}Tour T left join {/*OWNER*/}Agency AG on AG.ID=T.IdAgency
SQL1_20= WHERE T.Id={/*PARAM4*/}

DATA2=INFO_TOUR
NAME2=InfoTour

SQL2=SELECT DISTINCT
SQL2_1=   'Tournée N°  '+ T.Id as TitleTour, 
SQL2_2=   'Date' as T_Date, format(T.DateTour, 'DD/MM/YYYY') as DateTour,
SQL2_3=   'Véhicule  ' as T_V, (select V.Immatric from {/*OWNER*/}Vehicle V where V.Id=T.IdVehicle) as Vehicle, 
SQL2_4=   'Chauffeur ' as T_D, (select trim(D.LastName) + ', ' + D.FirstName from {/*OWNER*/}Driver D where D.Id=T.IdDriver) as Driver, 
SQL2_5=   'Nombre de Clients' as T_NbClient, (select format(count(1),'0') from {/*OWNER*/}Delivery DL where DL.IdTour=T.Id) as NbDeliv,
SQL2_6=   'Poids Net ' as T_Poids, format(T.Weight/1000, '0.0 T') as Poids, 
SQL2_7=   'Volume '    as T_Vol, format(T.Volume/1000, '0.0 M3')  as Volume, 
SQL2_8=   'Nombre Palettes' as T_Pal, (select format(sum(DL.NbPallet),'0') from {/*OWNER*/}Delivery DL where DL.IdTour=T.Id) as NbPallet,
SQL2_9=   'Kilomètres' as T_KM, format(T.KM/1000, '0.0 KM') as KM,
SQL2_10=  'Temps conduite' as T_Conduit, format(T.RouteTime/60, '00H') + format(T.RouteTime-int(T.RouteTime/60)*60, '00') as RouteTime,
SQL2_11=  'Départ prévu à' as T_TStart, mid(T.T1, 12,5) as TimeStart,
SQL2_12=  'Retour Prévu à' as T_TEnd,   mid(T.T2, 12,5) as TimeEnd
SQL2_13= FROM {/*OWNER*/}Tour T 
SQL2_14= WHERE T.Id={/*PARAM4*/}

// and T.IdClub='{/*CLUBID*/}' 


DATA3=DELIV_TOUR
NAME3=DelivTour

SQL3=SELECT DISTINCT
SQL3_1=   D.Id as IdDelivCol1, 
SQL3_2=   Cl.Name as CliCol2, 
SQL3_3=   trim(P.PostCode) + ' - ' + P.City as CityCol3,
SQL3_4=   int(D.NbPallet) as PalCol4,
SQL3_5=   format(D.Weight,'0 ') as TonCol5,
SQL3_6=   (select format(sum(LD.Quantity*A.Volume), '0 ') from {/*OWNER*/}Delivery_Product LD inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct where LD.IdDelivery=D.Id) as VolCol6,
SQL3_7=   (select format(sum(LD.Quantity/A.QuantityPackaging), '0.0 ') from {/*OWNER*/}Delivery_Product LD inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct where LD.IdDelivery=D.Id) as Col7,
SQL3_8=   format(D.Quantity,'0') as QtyCol8,
SQL3_9=   ' ' as Col9, D.OrderInTour as ORD
SQL3_10=FROM (({/*OWNER*/}Delivery D
SQL3_11=  inner join {/*OWNER*/}Client CL on D.IdClient=CL.Id)
SQL3_12=  inner join {/*OWNER*/}PointDelivery P on P.IdClient=D.IdClient and P.IdPoint=D.IdPointDelivery) 
SQL3_13=WHERE D.IdTour={/*PARAM4*/}
SQL3_14=ORDER BY D.OrderInTour

DATA4=TOTAL_DELIV_TOUR
NAME4=TotalDelivTour

SQL4=SELECT DISTINCT
SQL4_1=   'TOTAL' as DelivCol1, 
SQL4_2=   'Nb Clinets : ' + format(Count(1), '0') as CliCol2, 
SQL4_3=   ' ' as CityCol3,
SQL4_4=   format(sum(D.NbPallet),'0  ') as PalCol4,
SQL4_5=   format(sum(D.Weight),'0 ') as TonCol5,
SQL4_6=   format(sum(TabLD.Vol), '0 ') as VolCol6,
SQL4_7=   format(sum(TabLD.NbPaquet), '0  ') as Col7,
SQL4_8=   format(sum(D.Quantity),'0') as QtyCol8,
SQL4_9=   ' ' as Col9 
SQL4_10=FROM (({/*OWNER*/}Delivery D inner join {/*OWNER*/}Client CL on D.IdClient=CL.Id)
SQL4_11=  inner join {/*OWNER*/}PointDelivery P on P.IdClient=D.IdClient and P.IdPoint=D.IdPointDelivery) 
SQL4_12=  left join (select LD.IdDelivery as IdDeliv, sum(LD.Quantity*A.Volume) as Vol, sum(LD.Quantity/A.QuantityPackaging) as NbPaquet from {/*OWNER*/}Delivery_Product LD inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct group by LD.IdDelivery) TabLD
SQL4_13=    on TabLD.IdDeliv=D.Id
SQL4_14=WHERE D.IdTour={/*PARAM4*/}

DATA5=INFO_DELIVERY
NAME5=InfoDelivery

SQL5=SELECT DISTINCT
SQL5_1=   D.Id as IdDelivCol1, 
SQL5_2=   Cl.Name as CliCol2, 
SQL5_3=   trim(P.Address) + iif(P.AddressSup is not NULL and P.AddressSup>' ', ' - ' + trim(P.AddressSup) +', ', ', ') + trim(P.PostCode) + ' ' + P.City as CityCol3,
SQL5_4=   'Nb Palettes : ' + format(D.NbPallet,'0 ') as PalCol4,
SQL5_5=   'Poids : ' + format(D.Weight,'0 ') as TonCol5,
SQL5_6=   'Volume : ' + (select format(sum(LD.Quantity*A.Volume), '0 ') from {/*OWNER*/}Delivery_Product LD inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct where LD.IdDelivery=D.Id) as VolCol6,
SQL5_7=   'Nb Colis : ' + (select format(round(sum(LD.Quantity/A.QuantityPackaging)), '0 ') from {/*OWNER*/}Delivery_Product LD inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct where LD.IdDelivery=D.Id) as Col7,
SQL5_8=   format(D.Quantity,'0') as QtyCol8, 
SQL5_9=   format(D.OrderInTour,'0)')  as Col9, 
SQL5_10=   trim(P.Address) + iif(P.AddressSup is not NULL and P.AddressSup>' ', ' - ' + P.AddressSup, ' ') as AddressCol10,
SQL5_11=  iif(P.Mobile is not NULL and P.Mobile>' ', P.Mobile, iif(P.Phone is not NULL and P.Phone>' ',P.Phone,' ')) as PhoneCol11,
SQL5_12=  ' GPS : ' + iif(P.Longitude is not NULL and P.Latitude is not NULL , format(P.Longitude,'000.00000') + ' ; ' + format(P.Latitude,'000.00000'), ' ') as GPSCol12,

SQL5_13=  'Info accès : ' + iif(CL.Comments is NULL, ' ', CL.Comments) as InfoAccesCol13,
SQL5_14=  'Instruction : ' + iif(D.Comments is NULL, ' ', D.Comments) as InstructionCol14,
SQL5_15=  'Message : ' + iif(D.CustomsInfo is NULL, ' ', D.CustomsInfo) as CustomInfoCol15,
SQL5_16=   D.Id as CODEDELIVERY , D.OrderInTour as ORD
SQL5_17=FROM (({/*OWNER*/}Delivery D inner join {/*OWNER*/}Client CL on D.IdClient=CL.Id)
SQL5_18=  inner join {/*OWNER*/}PointDelivery P on P.IdClient=D.IdClient and P.IdPoint=D.IdPointDelivery) 
SQL5_19=WHERE D.IdTour={/*PARAM4*/} 
SQL5_20=ORDER BY D.OrderInTour


DATA6=INFO_DELIVERY_QTY
NAME6=InfoDeliveryQty

SQL6=SELECT 
SQL6_1=   ' '+Cmd as C1, 
SQL6_2=   IIF (CmdSup=0 , PRODUCT, ' ') as C2, 
SQL6_3=   IIF (CmdSup=0 , DescriProduct, ' ') as C3, 
SQL6_4=   IIF (SamePal+CmdSup=0 , PALETTE, ' ') as C4,
SQL6_5=   NW as C5,
SQL6_6=   QTY,
SQL6_7=   NbPackage as C7, 
SQL6_8=  IIF (SamePal+CmdSup=0 , GW, ' ') as C8,
SQL6_9=  IIF (SamePal+CmdSup=0 , L, ' ') as C9, 
SQL6_10=  IIF (SamePal+CmdSup=0 , W, ' ') as C10, 
SQL6_11=  IIF (SamePal+CmdSup=0 , H, ' ') as C11, V as C12, QtyPackage as C13, IIF (SamePal+CmdSup=0 , PACKING, ' ') as C14
SQL6_12= FROM (SELECT
SQL6_13=   LD.IdPacking as PACKING, 
SQL6_14=   LD.IdDelivery as IdDelivery, 
SQL6_15=   LD.NoPalletDelivery as PALETTE, 
SQL6_16=   A.ID as PRODUCT, 
SQL6_17=   A.Designation as DescriProduct,
SQL6_18=   LD.IdCommand as Cmd,
SQL6_19=   format(LD.Quantity,'0 ') as QTY,
SQL6_20=   format(A.QuantityPackaging,'0 ') as QtyPackage,
SQL6_21=   format(iif(A.QuantityPackaging is not NULL and A.QuantityPackaging>0, LD.Quantity/A.QuantityPackaging, 1),'0 ') as NbPackage,
SQL6_22=   format(A.Weight*LD.Quantity,'0.00') as NW, 
SQL6_23=   IIF( P.WeightGlobal is NULL , 'PN +' + IIF (D.WeightPallet is NULL , '30' , str(int(D.WeightPallet)) ) , str(int(int(P.WeightGlobal*10+0.5)/10))+','+right(str(int((P.WeightGlobal)*10+0.5)),1) ) as GW,
SQL6_24=   str(int(P.Longth)) as L, 
SQL6_25=   str(int(P.Width)) as W, 
SQL6_26=   str(int(P.Hight)) as H,
SQL6_27=   format(A.Volume*LD.Quantity,'0.00') as V, 
SQL6_28=  IIF (exists (select 1 from Delivery_Product LD1 
SQL6_29=        where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPalletDelivery=LD.NoPalletDelivery AND LD1.IdProduct=LD.IdProduct AND LD1.IdCommand<LD.IdCommand) ,
SQL6_30=    1, 0 )  as CmdSup,
SQL6_31=  IIF (exists (select 1 from Delivery_Product LD1 
SQL6_32=        where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPalletDelivery=LD.NoPalletDelivery AND LD1.IdProduct<LD.IdProduct) ,
SQL6_33=    1, 0 )  as SamePal
SQL6_34= FROM (({/*OWNER*/}Delivery D inner join {/*OWNER*/}Delivery_Product LD on D.Id=LD.IdDelivery)
SQL6_35=   inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct)
SQL6_36=   left join {/*OWNER*/}Pallet P on P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL6_37= WHERE A.TypeProduct='P'
SQL6_38=   AND LD.IdDelivery='{/*CODEDELIVERY*/}' 
SQL6_39= ORDER BY LD.IdPacking, LD.NoPalletDelivery, LD.IdProduct, LD.IdCommand)

//////////////
DATA7=INFO_ORDERS
NAME7=INFOORDERS

SQL7=SELECT DISTINCT
SQL7_1=   LD.IdPacking as C1,
SQL7_2=   ' ' as C2,
SQL7_3=   ' ' as C3,
SQL7_4=   ' ' as C4,
SQL7_5=   LD.IdCommand as "CMD5",
SQL7_6=   LD.Quantity as "QTY6",
SQL7_7=   ' ' as C7,
SQL7_8=   ' ' as C8,
SQL7_9=   ' ' as C9,
SQL7_10=   ' ' as C10,
SQL7_11=   ' ' as C11
SQL7_12= FROM {/*OWNER*/}Delivery_Product LD
SQL7_13= WHERE LD.IdDelivery='{/*CODEDELIVERY*/}' 
SQL7_14=   AND LD.IdPacking='{/*PACKING*/}' AND LD.NoPallet={/*PALETTE*/} AND LD.IdProduct='{/*PRODUCT*/}' 
SQL7_15=   AND LD.IdCommand>= (select min(LD1.IdCommand) from {/*OWNER*/}Delivery_Product LD1
SQL7_16=      WHERE LD1.IdDelivery=LD.IdDelivery
SQL7_17=       AND LD1.IdPacking='{/*PACKING*/}' AND LD1.NoPallet={/*PALETTE*/} AND LD1.IdProduct='{/*PRODUCT*/}'
SQL7_18=    )
SQL7_19= ORDER BY LD.IdCommand


DATA8=LINE_TOTAL
NAME8=LINETOTAL

SQL8=SELECT DISTINCT
SQL8_1=   'TOTAL' as Col1, 
SQL8_2=   sum(QTY_C9) as Col2,
SQL8_3=   format(sum(C10),'0.0') as Col3,
SQL8_4=   format(sum(C11),'0.0') as Col4,
SQL8_5=   format(sum(C12),'0.0') as Col5,
SQL8_6=   format(sum(C13),'0') as Col6,
SQL8_7=   format(sum(C14),'0') as Col7
SQL8_8=  FROM (SELECT LD.IdPacking, LD.NoPallet,
SQL8_9=   sum(LD.Quantity) as "QTY_C9",
SQL8_10=  sum(A.Weight*LD.Quantity) as C10, 
SQL8_11=  sum(A.Volume*LD.Quantity) as C11,
SQL8_12=  sum(A.Weight*LD.Quantity)+ IIF (P.WeightGlobal is NULL , IIF (D.WeightPallet is NULL , 30, min(D.WeightPallet)) , min(P.WeightGlobal)-min(P.WeightNet)) as C12,
SQL8_13=  sum(A.QuantityPackaging) as C13,
SQL8_14=  sum(iif(A.QuantityPackaging is not NULL and A.QuantityPackaging>0, LD.Quantity/A.QuantityPackaging,1)) as C14
SQL8_15= FROM (({/*OWNER*/}Delivery D inner join {/*OWNER*/}Delivery_Product LD on D.Id=LD.IdDelivery)
SQL8_16=  inner join {/*OWNER*/}Product A on A.ID=LD.IdProduct) 
SQL8_17=  LEFT JOIN {/*OWNER*/}Pallet P on P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL8_18=WHERE A.TypeProduct='P'
SQL8_19=   AND D.IdDelivery='{/*CODEDELIVERY*/}' 
SQL8_20=GROUP BY LD.IdPacking, LD.NoPallet, P.WeightGlobal, D.WeightPallet)


DATA9=ADDRESS_DELIV
NAME9=AddressDeliv

SQL9=SELECT DISTINCT
SQL9_1=   IIF (CL.Country='France' , 'Adresse de livraison' ,  'Shipping adress') as TitleAdressDeliv, 
SQL9_2=   PT.NameClient as PtDeliv, 
SQL9_3=   PT.Address as AddresDeliv, 
SQL9_4=   PT.AddressSup as AddresSupDeliv, 
SQL9_5=   TRIM(PT.PostCode) + '   ' + PT.City as PostCodeCityDeliv, 
SQL9_6=   IIF (CL.Country='France' , ' ', CL.Country) as CountryDeliv,
SQL9_7=   D.Id as IdDelivery,
SQL9_8=   mid(str(D.DateDelivery),8,2) +'/'+ mid(str(D.DateDelivery),6,2) +'/'+ mid(str(D.DateDelivery),2,4) as DateDelivery ,
SQL9_9=   D.IdPacking as Packing,
SQL9_10=  (select IdSender from Packing P where P.IdPacking=D.IdPacking) as Sender,
SQL9_11=  (select ShipNo from Packing P where P.IdPacking=D.IdPacking) as ShipNo
SQL9_12= FROM {/*OWNER*/}Delivery D , {/*OWNER*/}Client CL, {/*OWNER*/}PointDelivery PT
SQL9_13= WHERE CL.Id=D.IdClient 
SQL9_14=  AND PT.IdClient=D.IdClient AND PT.IdPoint=D.IdPointDelivery
SQL9_15= AND LD.IdDelivery='{/*CODEDELIVERY*/}' 


