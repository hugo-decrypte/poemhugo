DATA2=INFO_ORDERS
NAME2=INFOORDERS

SQL2=SELECT DISTINCT
SQL2_1=   LD.IdPacking as C1,
SQL2_2=   ' ' as C2,
SQL2_3=   ' ' as C3,
SQL2_4=   ' ' as C4,
SQL2_5=   LD.IdOrder as "CMD5",
SQL2_6=   LD.Quantity as "QTY6",
SQL2_7=   ' ' as C7,
SQL2_8=   ' ' as C8,
SQL2_9=   ' ' as C9,
SQL2_10=   ' ' as C10,
SQL2_11=   ' ' as C11
SQL2_12= FROM {/*OWNER*/}LINEDELIVERY LD
SQL2_13= WHERE LD.IdDelivery='{/*CODEDELIVERY*/}' AND LD.IdClub='{/*CODECLUB*/}'
SQL2_14=   AND LD.IdPacking='{/*PACKING*/}' AND LD.NoPallet={/*PALETTE*/} AND LD.IdArticle='{/*ARTICLE*/}' 
SQL2_15=   AND LD.IdOrder>= (select min(LD1.IdOrder) from {/*OWNER*/}LINEDELIVERY LD1
SQL2_16=      WHERE LD1.IdDelivery='{/*CODEDELIVERY*/}' AND LD1.IdClub='{/*CODECLUB*/}'
SQL2_17=       AND LD1.IdPacking='{/*PACKING*/}' AND LD1.NoPallet={/*PALETTE*/} AND LD1.IdArticle='{/*ARTICLE*/}'
SQL2_18=    )
SQL2_19= ORDER BY LD.IdOrder


DATA3=LINE_TOTAL
NAME3=LINETOTAL

SQL3=SELECT DISTINCT 'TOTAL' as Col6, sum(QTY_C9) as Col9, str(int(sum(C10)+0.5)) as Col10, str(int(sum(C11)+0.5)) as Col11, count(1) as Col12_NbPallet
SQL3_1= FROM (SELECT LD.IdPacking, LD.NoPallet,
SQL3_2=   sum(LD.Quantity) as "QTY_C9",
SQL3_3=   sum(A.Weight*LD.Quantity) as C10, 
SQL3_4=   sum(A.Weight*LD.Quantity)+ IIF (P.WeightGlobal is NULL , IIF (D.WeightPallet is NULL , 30, min(D.WeightPallet)) , min(P.WeightGlobal)-min(P.WeightNet)) as C11
SQL3_5=  FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}LINEDELIVERY LD on D.IdClub=LD.IdClub and D.ID=LD.IdDelivery)
SQL3_6=   inner join {/*OWNER*/}ARTICLE A on A.IdClub=LD.IdClub and A.ID=LD.IdArticle) 
SQL3_7=   LEFT JOIN {/*OWNER*/}PALLET P on P.IdClub=LD.IdClub and P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL3_8=  WHERE A.TypeArticle='P' and LD.NoPalletDelivery is NULL
SQL3_9=   AND D.ID='{/*CODEDELIVERY*/}' AND D.IdClub='{/*CODECLUB*/}'
SQL3_10= GROUP BY LD.IdPacking, LD.NoPallet, P.WeightGlobal, D.WeightPallet
SQL3_11= UNION ALL SELECT LD.IdDelivery, LD.NoPalletDelivery,
SQL3_12=   sum(LD.Quantity) as "QTY_C9",
SQL3_13=   sum(A.Weight*LD.Quantity) as C10, 
SQL3_14=   sum(A.Weight*LD.Quantity)+ IIF (P.WeightGlobal is NULL , IIF (D.WeightPallet is NULL , 30, min(D.WeightPallet)) , min(P.WeightGlobal)-min(P.WeightNet)) as C11
SQL3_15= FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}LINEDELIVERY LD on D.IdClub=LD.IdClub and D.ID=LD.IdDelivery)
SQL3_16=   inner join {/*OWNER*/}ARTICLE A on A.IdClub=LD.IdClub and A.ID=LD.IdArticle) 
SQL3_17=   LEFT JOIN {/*OWNER*/}PALLET P on P.IdClub=LD.IdClub and P.IdPacking=LD.IdDelivery AND P.NoPallet=LD.NoPalletDelivery
SQL3_18= WHERE A.TypeArticle='P' and LD.NoPalletDelivery is not NULL
SQL3_19=   AND D.ID='{/*CODEDELIVERY*/}' AND D.IdClub='{/*CODECLUB*/}'
SQL3_20= GROUP BY LD.IdDelivery, LD.NoPalletDelivery, P.WeightGlobal, D.WeightPallet)


DATA4=ADDRESS_DELIV
NAME4=AddressDeliv

SQL4=SELECT DISTINCT
SQL4_1=   IIF (CL.Country='France' , 'Adresse de livraison' ,  'Shipping adress') as TitleAdressDeliv, 
SQL4_2=   PT.NameClient as PtDeliv, 
SQL4_3=   PT.Address as AddresDeliv, 
SQL4_4=   PT.AddressSup as AddresSupDeliv, 
SQL4_5=   TRIM(PT.PostCode) + '   ' + PT.City as PostCodeCityDeliv, 
SQL4_6=   IIF (CL.Country='France' , ' ', CL.Country) as CountryDeliv,
SQL4_7=   D.ID as IdDelivery,
SQL4_8=   mid(str(D.DateDelivery),8,2) +'/'+ mid(str(D.DateDelivery),6,2) +'/'+ mid(str(D.DateDelivery),2,4) as DateDeliv ,
SQL4_9=   D.IdPacking as Packing,
SQL4_10=  (select IdSender from PACKING P where P.IdClub=D.IdClub and P.Id=D.IdPacking) as Sender,
SQL4_11=  IIF (CL.Country='France' , 'Suivi par : ', 'Followed by: ') + iif(D.FollowedBy is NULL, ' ', D.FollowedBy)  as FollowedBy
SQL4_12= FROM {/*OWNER*/}DELIVERY D , {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT
SQL4_13= WHERE CL.Id=D.IdClient and CL.IdClub=D.IdClub
SQL4_14=  AND PT.IdClient=D.IdClient AND PT.IdPoint=D.IdPointDelivery
SQL4_15= AND D.ID='{/*CODEDELIVERY*/}' AND D.IdClub='{/*CODECLUB*/}'


