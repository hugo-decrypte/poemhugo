SQL5_11=  iif(AG.NumTVA is not NULL, 'N° TVA : '+AG.NumTVA, 'N  TVA : FR95438963860') as NoTVA,
SQL5_12=  iif(AG.Siret is not NULL, 'SIRET : '+ trim(AG.Siret), 'SIRET : 438 963 860 00038') +
SQL5_13=  iif(AG.RCS is not NULL, ' - RCS : ' + trim(AG.RCS), ' - RCS : 438963860')  +
SQL5_14=  iif(AG.APE is not NULL, ' - APE : ' + AG.APE, ' - APE :513T') as InfoRegistre,
