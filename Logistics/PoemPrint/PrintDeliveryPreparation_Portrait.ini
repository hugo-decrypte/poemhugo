DATA1=INFO_DELIVERY
NAME1=InfoDelivery

SQL1=SELECT 
SQL1_1=   PACKING as C1, 
SQL1_2=   PALETTE as C2, 
SQL1_3=   ARTICLE as C3, 
SQL1_4=   DescriArticle as C4,
SQL1_5=   Cmd,
SQL1_6=   QTY,
SQL1_7=   NW as C7, 
SQL1_8=   GW as C8,
SQL1_9=   L as C9, 
SQL1_10=  W as C10, 
SQL1_11=  H as C11, PalletDelivery as C12
SQL1_12= FROM (SELECT
SQL1_13=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdArticle<LD.IdArticle or (LD1.IdArticle=LD.IdArticle and LD1.IdOrder<LD.IdOrder))), ' ', LD.IdPacking) as PACKING, 
SQL1_14=   LD.IdDelivery as IdDelivery, 
SQL1_15=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdArticle<LD.IdArticle or (LD1.IdArticle=LD.IdArticle and LD1.IdOrder<LD.IdOrder))), ' ', LD.NoPallet) as PALETTE, 
SQL1_16=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND LD1.IdArticle=LD.IdArticle AND LD1.IdOrder<LD.IdOrder),  ' ', A.ID) as ARTICLE, 
SQL1_17=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND LD1.IdArticle=LD.IdArticle AND LD1.IdOrder<LD.IdOrder),  ' ', A.Designation) as DescriArticle,
SQL1_18=   LD.IdOrder as Cmd,
SQL1_19=   format(LD.Quantity,'0') as QTY,
SQL1_20=   format(A.Weight*LD.Quantity, '0.0') as NW, 
SQL1_21=   IIF( P.WeightGlobal is NULL , 'PN +' + IIF (D.WeightPallet is NULL , '30' , str(int(D.WeightPallet)) ) , format(P.WeightGlobal,'0.0') ) as GW,
SQL1_22=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdArticle<LD.IdArticle or (LD1.IdArticle=LD.IdArticle and LD1.IdOrder<LD.IdOrder))), ' ', str(int(P.Length)) ) as L, 
SQL1_23=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdArticle<LD.IdArticle or (LD1.IdArticle=LD.IdArticle and LD1.IdOrder<LD.IdOrder))), ' ', str(int(P.Width)) ) as W, 
SQL1_24=   IIF (exists (select 1 from {/*OWNER*/}LINEDELIVERY LD1 where LD1.IdClub=LD.IdClub and LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdArticle<LD.IdArticle or (LD1.IdArticle=LD.IdArticle and LD1.IdOrder<LD.IdOrder))), ' ', str(int(P.Height)) ) as H,
SQL1_25=   LD.IdPacking as IDPACKING, 
SQL1_26=   LD.NoPallet as NoPALETTE, 
SQL1_27=   A.ID as IdARTICLE, 
SQL1_28=  LD.NoPalletDelivery as PalletDelivery
SQL1_29= FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}LINEDELIVERY LD on D.IdClub=LD.IdClub and D.ID=LD.IdDelivery)
SQL1_30=   inner join {/*OWNER*/}ARTICLE A on A.IdClub=LD.IdClub and A.ID=LD.IdArticle)
SQL1_31=   left join {/*OWNER*/}PALLET P on P.IdClub=LD.IdClub and P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL1_32= WHERE A.TypeArticle='P'
SQL1_33=   AND LD.IdDelivery='{/*CODEDELIVERY*/}' AND LD.IdClub='{/*CODECLUB*/}'
SQL1_34= )
SQL1_35= ORDER BY IdPACKING, NoPALETTE, IdArticle, Cmd


