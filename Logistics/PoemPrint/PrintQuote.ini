// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   IIF(AG.NAME is not NULL,AG.NAME,' ') as Nom,
SQL1_2=   IIF(AG.LABEL is not NULL,AG.LABEL,' ') as Label,
SQL1_3=   IIF(AG.ADDRESS is not NULL,AG.ADDRESS,' ') as Adr,
SQL1_4=   IIF(AG.ADDRESSSUP is not NULL,AG.ADDRESSSUP,' ') as Adr2,
SQL1_5=   IIF(AG.PostCode is not NULL,AG.PostCode,' ') as CodePost,
SQL1_6=   IIF(AG.City is not NULL,AG.City,' ') as City,
SQL1_7=   IIF(AG.Country is not NULL,AG.Country,'France') as Country,
SQL1_8=   IIF(AG.Phone is not NULL,AG.Phone,' ') as Phone,
SQL1_9=   IIF(AG.Fax is not NULL,AG.Fax,' ') as Fax,
SQL1_10=  IIF(AG.EMAIL is not NULL,AG.EMAIL,' ') as Mail,

SQL1_11=  IIF(AG.Capital is not NULL,AG.Capital,'Type Société : ________ au capital de ______ _') as TypeCompagny,
SQL1_12=  ('TVA Intracom : '+ IIF(AG.codeTax is not NULL,AG.codeTax,' ') ) as NoTVA,
SQL1_13=  IIF(AG.establishment is not NULL,AG.establishment,'SIRET :') as Siret,
SQL1_14=  IIF(AG.RCS is not NULL,AG.RCS,'RCS :') as RCS,
SQL1_15=  IIF(AG.APE is not NULL,AG.APE,'APE :') as APE,

SQL1_16=  ('SIRET : '+ IIF(AG.establishment is not NULL,trim(AG.establishment),' ') +' - RCS : '+ IIF(AG.RCS is not NULL,trim(AG.RCS),' ') +' - APE : '+ IIF(AG.APE is not NULL,AG.APE,' ') ) as InfoRegistre,
SQL1_17=  (select ('IBAN : '+ IIF(B.IBAN is NULL,' ',trim(B.IBAN)) +' - BIC : '+ IIF(B.BIC is NULL,' ',trim(B.BIC)) +'  '+ IIF(B.Name is NULL,' ',trim(B.Name)) ) from {/*OWNER*/}BANKACCOUNT B where B.ID='{/*BANKACCOUNT*/}') as BankInfo,
SQL1_18=  IIF('{/*COUNTRY*/}' in ('France','FRANCE'),('Imprimée le '+ format(Now(), 'DD/MM/YYYY, hh:nn:ss')) ,('Printed '+ format(Now(), 'YYYY-MM-DD, hh:nn:ss')) ) as PrintDate,

SQL1_19=  '{/*TITLEDOC*/}' as TitleDoc,
SQL1_20=  '{/*TITLECODEOBJ*/}' as TitleObj,
SQL1_21=  '{/*CODEOBJ*/}' as CodeObj,
SQL1_22=  '{/*TITLEDATEOBJ*/}' as TitleDateObj,
SQL1_23=  '{/*DATEOBJ*/}' as DateObj,
SQL1_24=  '{/*TITLEREFERENCEOBJ*/}' as TitleRefObj,
SQL1_25=  '{/*REFERENCEOBJ*/}' as RefObj
SQL1_26= FROM {/*OWNER*/}AGENCY AG
SQL1_27= WHERE  AG.Id='{/*CODEAGENCY*/}'

// compagny Registre info, BankInfo in FOOTER





//////////////
DATA2=SEL_OBJ
NAME2=Objet

SQL2=SELECT 
SQL2_1=   Q.Id as CODEQUOTE, 
SQL2_2=   Q.IdAgency as CODEAGENCY, 
SQL2_3=   CL.Id as CODECLIENT, 
SQL2_4=   CL.BankAccount as BANKACCOUNT, 
SQL2_5=   CL.Country as COUNTRY, 
SQL2_6=  IIF(CL.Country='France','Devis  ','Quote   ') as TITLEDOC,
SQL2_7=  IIF(CL.Country='France','No : ','no : ') as TITLECODEOBJ,
SQL2_8=  Q.Id as CODEOBJ,
SQL2_9=   'Date : ' as TITLEDATEOBJ,
SQL2_10=  IIF(CL.Country in ('France','FRANCE'), ( mid(Q.DateQuote,9,2)+'/'+mid(Q.DateQuote,6,2)+'/'+mid(Q.DateQuote,1,4)) , ( mid(Q.DateQuote,1,4)+'-'+mid(Q.DateQuote,6,2)+'-'+mid(Q.DateQuote,9,2)) ) as DATEOBJ,
SQL2_11=  IIF(CL.Country in ('France','FRANCE'),'Client No : ','Client No : ') as TITLEREFERENCEOBJ,
SQL2_12=  Q.IdClient as REFERENCEOBJ,
SQL2_13=  ' ' as CODECLUB
SQL2_14= FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL2_15= WHERE Q.ID in ({/*PARAM4*/})





DATA3=INFO_QUOTE
NAME3=InfoDevis

SQL3=SELECT DISTINCT
SQL3_1=   (IIF(CL.Country='France','N° Devis : ','Quote no : ') + Q.Id)as IdFacture,
SQL3_2=   IIF(CL.Country='France',('Date Devis : ' + format(Q.DateQuote,'DD ')+ MI.NameFR + ' ' + format(Q.DateQuote, 'YYYY') )
SQL3_3=    ,('Date quote : ' + MI.NameEN +' '+ format(Q.DateQuote,'DD, YYYY'))) as DateFact,
SQL3_4=   IIF(CL.Country='France',('Devis valable jusqu''au : ' + format(Q.DateValid, 'DD ') + MP.NameFR +' '+ format(Q.DateValid, 'YYYY'))
SQL3_5=    ,('Quote valid until : '+ MP.NameEN +' '+ format(Q.DateValid, 'DD, YYYY'))) as DateMaxPayment,
SQL3_6=   IIF(CL.Country='France','Adresse de livraison','Shipping adress') as TitleAdressDeliv, 
SQL3_7=   PT.NameClient as PtDeliv, 

SQL3_8=   PT.Address as AddresDeliv, 
SQL3_9=   PT.AddressSup as AddresSupDeliv, 
SQL3_10=  (TRIM(PT.PostCode) + '   ' + PT.City)as PostCodeCityDeliv, 
SQL3_11=  IIF(CL.Country='France',' ',CL.Country) as CountryDeliv,

SQL3_12=   IIF(CL.Country='France','Adresse de facturation','Billing adress') as TitleAdressFact, 
SQL3_13=   CL.Name as NameFact, 

SQL3_14=   IIF(CL.Country='France','Service comptabilité ','Accountant department') as Compta,
SQL3_15=   CL.Address as AddresFact, 
SQL3_16=   CL.AddressSup as AddresSupFact, 
SQL3_17=   (TRIM(CL.PostCode) + '   ' + CL.City)as PostCodeCityFact, 
SQL3_18=   IIF(CL.Country='France',' ',CL.Country) as Country,

SQL3_19=  (IIF(CL.Country='France','Référence : ','Our reference: ') +Q.Reference)as ReferenceDeliv,
SQL3_20=  (IIF(CL.Country='France','N° TVA : '  ,'Customer VAT no.: ') + IIF(CL.codeTax is NULL,' ',CL.codeTax))as TVANo,

SQL3_21=  IIF(CL.Country='France',' Règlement de facture à 30 jours date de facture, fin du mois','Terms of sale: 30 days, date of invoice') as REGL_C19,
SQL3_22=  IIF(CL.Country='France',' ','Exonération de T.V.A. Article 262 TER-l du CGI') as REGL_C20,
SQL3_23=  IIF(CL.Country='France','Règlement de facture : ','Terms of sale: ') as REGL_C21,
SQL3_24=  Q.Comments as REGL_C22,
SQL3_25=  (IIF(CL.Country='France', 'Suivi par : ','Followed by: ') + IIF(Q.FollowedBy is NULL,' ',Q.FollowedBy))as FollowedBy,

SQL3_26=  IIF(CL.Country='France','Devis','Quote') as TITLE

SQL3_27=FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT, {/*OWNER*/}MONTHLABEL MI, {/*OWNER*/}MONTHLABEL MP
SQL3_28=WHERE CL.Id=Q.IdClient 
SQL3_29=  AND PT.IdClient=Q.IdClient AND PT.IdPoint=Q.IdPointDelivery
SQL3_30=  AND MI.NoMonth=mid(Q.DateQuote,6,2)+0
SQL3_31=  AND MP.NoMonth=mid(Q.DateValid,6,2)+0
SQL3_32=  AND Q.Id='{/*CODEQUOTE*/}'




//////////////
DATA4=LINE_FACT_COLHEAD
NAME4=LINEFACTCOLHEAD

SQL4=SELECT DISTINCT
SQL4_1=   IIF(CL.Country='France','Désignation','Description') as Design,
SQL4_2=   IIF(CL.Country='France','Quantité','Quantity') as Qty,
SQL4_3=   IIF(CL.Country='France','Prix','Price') as Price,
SQL4_4=   IIF(CL.Country='France','Remise','Discount') as Remise,
SQL4_5=   IIF(CL.Country='France','Montant HT','Amount') as Amount,
SQL4_6=   IIF(CL.Country='France','TVA','VAT') as TVA
SQL4_7= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL4_8= WHERE CL.Id=Q.IdClient
SQL4_9=  AND Q.Id='{/*CODEQUOTE*/}' 



DATA5=LINEQUOTE
NAME5=LineQuote

SQL5=SELECT 
SQL5_1=   P.Designation as Design,
SQL5_2=   format(LQ.Quantity, '0') as QTY,
SQL5_3=   (format(LQ.PriceUnit,'0.00') + ' ' + IIF(Q.Currency is NULL or Q.Currency<=' ','€',trim(Q.Currency)))as PriceUnit,
SQL5_4=   IIF(LQ.Discount<>0,(format(LQ.Discount,'0.0')+'% '),' ') as Dis,
SQL5_5=   (IIF(LQ.Discount is not NULL and LQ.Discount<>0,format(LQ.PriceUnit*(LQ.Quantity*(100.0-LQ.Discount)/100.0),'0.00'),format(LQ.PriceUnit*(LQ.Quantity),'0.00')) + ' € ')as PriceTotal,
SQL5_6=   LQ.IdVAT,
SQL5_7=   P.ID as Product, P.TypeProduct, P.Family
SQL5_8=FROM {/*OWNER*/}QUOTE_PRODUCT LQ, {/*OWNER*/}QUOTE Q, {/*OWNER*/}PRODUCT P
SQL5_9=WHERE P.ID=LQ.IdProduct AND LQ.IdQuote=Q.Id and LQ.IdQuote='{/*CODEQUOTE*/}' 
SQL5_10=ORDER BY P.TypeProduct desc, P.Family, P.Designation, P.Id



// line total 
DATA6=TOTALQUOTE
NAME6=TotalQuote

SQL6=SELECT 
SQL6_1=   'TOTAL' as Design,
SQL6_2=   format(sum(LQ.Quantity), '0') as QTY,
SQL6_3=   ' ' as PriceUnit,
SQL6_4=   ' ' as Discount,
SQL6_5=   (format(sum( (LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00)))/100.0), '0.00') + ' € ')as PriceTotal,
SQL6_6=   ' ' as IdVAT
SQL6_7=FROM {/*OWNER*/}QUOTE_PRODUCT LQ, {/*OWNER*/}QUOTE Q, {/*OWNER*/}PRODUCT P
SQL6_8=WHERE P.ID=LQ.IdProduct AND LQ.IdQuote=Q.Id and LQ.IdQuote='{/*CODEQUOTE*/}' 



// table total title
DATA7=TOTAL_TITLE
NAME7=TOTALTITLE

SQL7=SELECT DISTINCT
SQL7_1=  IIF(CL.Country='France','TOTAL HT'   ,'TOTAL H.T.') as C1, 
SQL7_2=  IIF(CL.Country='France','TOTAL TVA'  ,'TOTAL V.A.T.') as C2,
SQL7_3=  IIF(CL.Country='France','TOTAL TTC'  ,'TOTAL PRICE') as C3, 
SQL7_4=  IIF(CL.Country='France','NET A PAYER','NET TO PAY') as C4,

SQL7_5=  IIF(CL.Country='France','Code' ,'Code') as C5,
SQL7_6=  IIF(CL.Country='France','Base' ,'Base') as C6,
SQL7_7=  IIF(CL.Country='France','Taux' ,'Rate') as C7,
SQL7_8=  IIF(CL.Country='France','Taxe' ,'Tax') as C8

SQL7_9= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL7_10= WHERE CL.Id=Q.IdClient AND Q.Id='{/*CODEQUOTE*/}' 



// table total
DATA8=TOTAL
NAME8=TOTAL

SQL8=SELECT DISTINCT
SQL8_1=  (format(Q.AmountHT*IIF(Q.Discount is NULL,100,(100-Q.Discount))/100.0, '0.00') + ' € ')as PriceHT,
SQL8_2=  (format(tabTVA.TotalTVA*(100.0-IIF(Q.Discount is not NULL and Q.Discount<>0,Q.Discount,0.00))/100.0, '0.00') + ' € ')as PriceTVA,
SQL8_3=  (format((tabTVA.TotalTVA+Q.AmountHT)*(100.0-IIF(Q.Discount is not NULL and Q.Discount<>0,Q.Discount,0.00))/100.0, '0.00')+ ' € ')as PriceTotal,
SQL8_4=  (format((tabTVA.TotalTVA+Q.AmountHT)*(100.0-IIF(Q.Discount is not NULL and Q.Discount<>0,Q.Discount,0.00))/100.0, '0.00')+ ' € ')as NetPay

SQL8_5= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL,
SQL8_6=   (SELECT DISTINCT 
SQL8_7=      LQ.IdQuote as IdLD, min(T.VAT) as MinTVA, max(T.VAT) as MaxTVA,
SQL8_8=      sum(LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00))/100.0*T.VAT/100.0) as TotalTVA 
SQL8_9=    FROM {/*OWNER*/}QUOTE_PRODUCT LQ, {/*OWNER*/}VAT T 
SQL8_10=    WHERE T.Id=LQ.IdVAT AND LQ.IdQuote='{/*CODEQUOTE*/}' 
SQL8_11=    Group by LQ.IdQuote ) tabTVA
SQL8_12= WHERE CL.Id=Q.IdClient and tabTVA.IdLD=Q.Id AND Q.Id='{/*CODEQUOTE*/}' 




//////
//  calcul des TVA par code et la totale
DATA9=TVA
NAME9=TVA

SQL9=SELECT TITLE, QTY, Price, AmountTVA, LAB from
SQL9_1=(SELECT DISTINCT T.Id as "TITLE",
SQL9_2=  format(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00)),0))/100.0, '0.00') as QTY, 
SQL9_3=  format(T.VAT, '0.00')+ '% ' as Price,
SQL9_4=  format(round(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00)),0)/100.0)*T.VAT, 0)/100.0, '0.00') as AmountTVA, 1 as LAB
SQL9_5= FROM {/*OWNER*/}QUOTE Q,{/*OWNER*/}QUOTE_PRODUCT LQ, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL9_6= WHERE Q.Id=LQ.IdQuote and T.Id=LQ.IdVAT and CL.Id=Q.IdClient and CL.Country in ('France','FRANCE')
SQL9_7=    AND LQ.IdQuote='{/*CODEQUOTE*/}'
SQL9_8= Group BY T.Id,T.VAT) t

SQL9_9=UNION ALL (SELECT DISTINCT IIF(CL.Country in ('France','FRANCE'), 'Total',CL.Country) as TITLE,
SQL9_10=  format(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00)), 0))/100.0, '0.00') as QTY, 
SQL9_11=  IIF(CL.Country in ('France','FRANCE'),' ',CL.Country) as Price,
SQL9_12=  format(round(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-IIF(LQ.Discount is not NULL and LQ.Discount<>0,LQ.Discount,0.00)), 0)/100.0*T.VAT),0)/100.0, '0.00') as AmountTVA, count(1) as LAB
SQL9_13= FROM {/*OWNER*/}QUOTE Q,{/*OWNER*/}QUOTE_PRODUCT LQ, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL9_14= WHERE Q.Id=LQ.IdQuote and T.Id=LQ.IdVAT and CL.Id=Q.IdClient and CL.Country in ('France','FRANCE') and LQ.IdQuote='{/*CODEQUOTE*/}'
SQL9_15=    AND (select count(1) from (select distinct LQ0.IdVAT from {/*OWNER*/}QUOTE_PRODUCT LQ0 where LQ0.IdQuote='{/*CODEQUOTE*/}') num)>1
SQL9_16= GROUP BY CL.Country)




//////////////
DATA10=LINE_CUSTOMINFO
NAME10=LINECUSTOMINFO

SQL10=SELECT 
SQL10_1=   Q.CustomsInfo as C_Comment,
SQL10_2=   '0' as NoL
SQL10_3= FROM {/*OWNER*/}QUOTE Q
SQL10_4= WHERE Q.Id='{/*CODEQUOTE*/}' and Q.CustomsInfo is not NULL and Q.CustomsInfo>' '

SQL10_5= UNION ALL SELECT 
SQL10_6=   (IIF(CL.Country='France','Réalisation par ','Realized by ') + Q.ProductCondition)as C_Comment,
SQL10_7=   '1' as NoL
SQL10_8= FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL10_9= WHERE Q.Id='{/*CODEQUOTE*/}' and Q.ProductCondition is not NULL and Q.ProductCondition>' '

SQL10_10=UNION ALL SELECT 
SQL10_11=   (IIF(CL.Country='France','Conditionnement : ','Packaging : ') + Q.Packaging)as C_Comment,
SQL10_12=   '2' as NoL
SQL10_13=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL10_14=WHERE Q.Id='{/*CODEQUOTE*/}' and Q.PayCondition is not NULL and Q.PayCondition>' '

SQL10_15=UNION ALL SELECT 
SQL10_16=   (IIF(CL.Country='France','Règles de transport : ','Transport rules : ') + Q.Incoterm)as C_Comment,
SQL10_17=   '3' as NoL
SQL10_18=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL10_19=WHERE Q.Id='{/*CODEQUOTE*/}' and Q.Incoterm is not NULL and Q.Incoterm>' '

SQL10_20=UNION ALL SELECT 
SQL10_21=   (IIF(CL.Country='France','Mode de règlement : ','Method of payment : ') + Q.PayCondition)as C_Comment,
SQL10_22=   '4' as NoL
SQL10_23=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL10_24=WHERE Q.Id='{/*CODEQUOTE*/}' and Q.PayCondition is not NULL and Q.PayCondition>' '

SQL10_25=UNION ALL SELECT 
SQL10_26=   Q.Comments as C_Comment,
SQL10_27=   '5' as NoL
SQL10_28=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL10_29=WHERE Q.Id='{/*CODEQUOTE*/}' and Q.Comments is not NULL and Q.Comments>' '

SQL10_30=UNION (SELECT DISTINCT
SQL10_31=  'Exonération de T.V.A. Article 262 TER-l du CGI' as C_Comment,
SQL10_32=  ' ' as NoL 
SQL10_33= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL10_34= WHERE CL.Id=Q.IdClient and CL.Country not in ('France','FRANCE')
SQL10_35=    AND Q.Id='{/*CODEQUOTE*/}' )

SQL10_36=ORDER BY NoL




