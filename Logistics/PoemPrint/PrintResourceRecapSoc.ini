SQL1=SELECT distinct
SQL1_1=   trim(p.LABEL) as pLabel,
SQL1_2=   trim(d.NAME) as NameDriver,
SQL1_3=   trim(d.FirstName) as FirstNameDriver,
SQL1_4=   NOW as CurTime
SQL1_5= FROM {/*OWNER*/}PERIOD p,  {/*OWNER*/}DRIVER d
SQL1_6= WHERE p.ID={/*CODEPERIOD*/} and d.ID='{/*CODEDRIVER*/}'

//SQL2_5=   IIF (pl.WorkTime <= d.MonthWorkTime/OpenDay, 'xxx', str(int((pl.WorkTime - d.MonthWorkTime/OpenDay)/60)) + ' : ' + mid(format(int(pl.WorkTime - d.MonthWorkTime/OpenDay) mod 60,'0###'),3,2)) as C4,
//SQL2_6=   str(int((d.MonthWorkTime/OpenDay)/60) ) + ' : ' + mid(format(int(d.MonthWorkTime/OpenDay) mod 60,'0###'),3,2) as C5,

// repas si 
//SQL2_6=   IIF (min(pl.TimeBegin)<=11000000 and max(pl.TimeEnd)>=14000000 , '1', ' ') as C5,
//SQL2_6=   IIF (max(pl.NbDayUsed)>0 , '1', ' ') as C5,

DATA2=INFO_ACT
NAME2=InfoAction

SQL2=Select D, C1, C2, C3,C4, C5, C6 from (SELECT distinct
SQL2_1=   pl.DATEACTION as D,
SQL2_2=   dl.NAME + ' ' + right(pl.DATEACTION,2) + ' ' + ml.NAMEFR + ' ' + left(pl.DATEACTION,4) as C1,
SQL2_3=   str(int(sum(pl.WORKTIME)/60) ) + ' : ' + mid(format(sum(pl.WORKTIME) mod 60,'0###'),3,2) as C2,
SQL2_4=   IIF (max(pl.NbDayUsed)>0 , str(int((cad.MonthWorkTime/cad.OpenDay)/60)) + ' : ' + mid(format(int(cad.MonthWorkTime/cad.OpenDay) mod 60,'0###'),3,2), ' ') as C3,
SQL2_5=   IIF (sum(pl.WorkTime) <= cad.MonthWorkTime/cad.OpenDay, 'xxx', str(int((sum(pl.WorkTime) - cad.MonthWorkTime/cad.OpenDay)/60)) + ' : ' + mid(format(int(sum(pl.WorkTime) - cad.MonthWorkTime/cad.OpenDay) mod 60,'0###'),3,2)) as C4,
SQL2_6=   IIF (min(pl.TimeBegin)<=11000000 and max(pl.TimeEnd)>=14000000 , '1', ' ') as C5,
SQL2_7=   max(IIF(pl.Comments is NULL, ' ', pl.Comments)) as C6
SQL2_8=  FROM {/*OWNER*/}Planning pl, {/*OWNER*/}DAYLABEL dl, {/*OWNER*/}MONTHLABEL ml, {/*OWNER*/}PERIOD p, {/*OWNER*/}DRIVER d, {/*OWNER*/}CADRIVER cad
SQL2_9= WHERE pl.DATEACTION>=p.DATEBEGIN  AND pl.DATEACTION<=p.DATEEND AND p.ID={/*CODEPERIOD*/} 
SQL2_10= and d.ID=pl.IdDriver and cad.IdDriver=d.Id and cad.IdPeriod=p.Id
SQL2_11= AND pl.IDDRIVER='{/*CODEDRIVER*/}' and pl.NbDayUsed>0
SQL2_12= AND dl.ID=WeekDay(cdate(left(pl.DATEACTION,4) + '/' + mid(pl.DATEACTION,5,2) + '/' + right(pl.DATEACTION,2)), 2) 
SQL2_13= AND ml.NOMONTH=int(mid(pl.DATEACTION,5,2)) 
SQL2_14= group by pl.DATEACTION, dl.NAME, ml.NAMEFR, cad.MonthWorkTime, cad.OpenDay ORDER BY pl.DATEACTION 

SQL2_15=UNION ALL SELECT distinct 
SQL2_16=  p.DateBegin+ml0.NoMonth as D,
SQL2_17=  dl.NAME + ' ' + format(ml0.NoMonth+1,'0#') + ' ' + ml.NAMEFR + ' ' + left(p.DATEBEGIN,4) as C1,
SQL2_18=  '7 : 00' as C2, '7 : 00' as C3, ' ' as C4, ' ' as C5,  
SQL2_19=  c.Comments as C6
SQL2_20=  FROM {/*OWNER*/}DAYLABEL dl, {/*OWNER*/}MONTHLABEL ml, {/*OWNER*/}MONTHLABEL ml0, {/*OWNER*/}PERIOD p, {/*OWNER*/}CALENDAR c 
SQL2_21= WHERE p.DATEBEGIN+ml0.NoMonth<=p.DATEEND AND p.ID={/*CODEPERIOD*/} and c.DATECAL=p.DATEBEGIN+ml0.NoMonth and c.WorkDay=0
SQL2_22= AND not exists (select 1 from {/*OWNER*/}Planning pl where pl.IDDRIVER='{/*CODEDRIVER*/}' and pl.DateAction=p.DateBegin+ml0.NoMonth) 
SQL2_23= AND dl.ID=WeekDay(cdate(left(p.DATEBEGIN,4) + '/' + mid(p.DATEBEGIN,5,2) + '/' + right(p.DATEBEGIN,2))+ml0.NoMonth, 2) 
SQL2_24= AND ml.NOMONTH=int(mid(p.DATEBEGIN,5,2)) and dl.ID>=1 and dl.ID<6 

SQL2_25=UNION ALL SELECT distinct 
SQL2_26=  p.DateBegin+ml0.NoMonth as D,
SQL2_27=  dl.NAME + ' ' + format(ml0.NoMonth+1,'0#') + ' ' + ml.NAMEFR + ' ' + left(p.DATEBEGIN,4) as C1,
SQL2_28=  ' ' as C2, ' ' as C3, ' ' as C4, ' ' as C5, 
SQL2_29=  pd.Label as C6
SQL2_30=  FROM {/*OWNER*/}DAYLABEL dl, {/*OWNER*/}MONTHLABEL ml, {/*OWNER*/}MONTHLABEL ml0, {/*OWNER*/}PERIOD p, {/*OWNER*/}PlanDriver pd 
SQL2_31= WHERE p.DATEBEGIN+ml0.NoMonth<=p.DATEEND AND p.ID={/*CODEPERIOD*/} and pd.IDDRIVER='{/*CODEDRIVER*/}' and pd.DateBegin<=p.DATEBEGIN+ml0.NoMonth and pd.DateEnd>=p.DATEBEGIN+ml0.NoMonth
SQL2_32= AND not exists (select 1 from {/*OWNER*/}Planning pl where pl.IDDRIVER='{/*CODEDRIVER*/}' and pl.DateAction=p.DateBegin+ml0.NoMonth) 
SQL2_33= AND dl.ID=WeekDay(cdate(left(p.DATEBEGIN,4) + '/' + mid(p.DATEBEGIN,5,2) + '/' + right(p.DATEBEGIN,2))+ml0.NoMonth, 2) 
SQL2_34= AND ml.NOMONTH=int(mid(p.DATEBEGIN,5,2)) and dl.ID>=1 and dl.ID<6 

SQL2_35=UNION ALL SELECT distinct 
SQL2_36=  p.DateBegin+ml0.NoMonth as D,
SQL2_37=  dl.NAME + ' ' + format(ml0.NoMonth+1,'0#') + ' ' + ml.NAMEFR + ' ' + left(p.DATEBEGIN,4) as C1,
SQL2_38=  ' ' as C2, ' ' as C3, ' ' as C4, ' ' as C5, 
SQL2_39=  'Absent' as C6
SQL2_40=  FROM {/*OWNER*/}DAYLABEL dl, {/*OWNER*/}MONTHLABEL ml, {/*OWNER*/}MONTHLABEL ml0, {/*OWNER*/}PERIOD p
SQL2_41= WHERE p.DATEBEGIN+ml0.NoMonth<=p.DATEEND AND p.ID={/*CODEPERIOD*/} 
SQL2_42= AND not exists (select 1 from {/*OWNER*/}Planning pl where pl.IDDRIVER='{/*CODEDRIVER*/}' and pl.DateAction=p.DateBegin+ml0.NoMonth and pl.NbDayUsed>0) 
SQL2_43= AND not exists (select 1 from {/*OWNER*/}PlanDriver pd where pd.IDDRIVER='{/*CODEDRIVER*/}' and pd.DateBegin<=p.DATEBEGIN+ml0.NoMonth and pd.DateEnd>=p.DATEBEGIN+ml0.NoMonth) 
SQL2_44= AND not exists (select 1 from {/*OWNER*/}CALENDAR c where c.DATECAL=p.DATEBEGIN+ml0.NoMonth and c.WorkDay=0) 
SQL2_45= AND dl.ID=WeekDay(cdate(left(p.DATEBEGIN,4) + '/' + mid(p.DATEBEGIN,5,2) + '/' + right(p.DATEBEGIN,2))+ml0.NoMonth, 2) 
SQL2_46= AND ml.NOMONTH=int(mid(p.DATEBEGIN,5,2)) and dl.ID>=1 and dl.ID<6 

SQL2_47= ) ORDER BY D


