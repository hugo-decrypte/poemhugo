NAME4=TotalActive

//SQL4_1=  str(int(sum(C2)/60) ) + ' : ' + mid(format(sum(C2) mod 60,'0###'),3,2) ,
//SQL4_3=  IIF(sum(C4)-max(C3)>0, str(int((sum(C4)-max(C3))/60) ) + ' : ' + mid(format((sum(C4)-max(C3)) mod 60,'0###'),3,2), '0'), 

// 2023.12.01 repas 
//SQL4_10=  max(IIF (pl.NbDayUsed is NULL or (pl.NbDayUsed is not NULL and pl.NbDayUsed>0) , 1, 0)) as C5_Repas, 0 as C6
//SQL2_6=   IIF (min(pl.TimeBegin)<=11000000 and max(pl.TimeEnd)>=14000000 , '1', ' ') as C5,

SQL4=SELECT C1, 
SQL4_1=  format(sum(C2)/60, '0.00') ,
SQL4_2=  format((max(C3)+sum(C6))/60, '0.00'), 
SQL4_3=  IIF(sum(C4)-max(C3)>0, format((sum(C4)-max(C3))/60, '0.00'), '0'), 
SQL4_4=  format(sum(C5_Repas),'0#') 
SQL4_5=  from (select 
SQL4_6=   'Total' as C1,
SQL4_7=   sum(pl.WORKTIME) as C2,
SQL4_8=   max(cad.MonthWorkTime) as C3,
SQL4_9=   sum(pl.WorkTime) as C4,
SQL4_10=  IIF (min(pl.TimeBegin)<=11000000 and max(pl.TimeEnd)>=14000000 , 1, 0) as C5_Repas, 0 as C6
SQL4_11= FROM {/*OWNER*/}Planning pl, {/*OWNER*/}PERIOD p, {/*OWNER*/}CADRIVER cad
SQL4_12= WHERE pl.DATEACTION>=p.DATEBEGIN and pl.DATEACTION<=p.DATEEND and p.ID={/*CODEPERIOD*/} 
SQL4_13=  AND cad.IdDriver=pl.IDDRIVER and cad.IdPeriod=p.Id AND pl.IDDRIVER='{/*CODEDRIVER*/}'
SQL4_14= GROUP BY pl.DATEACTION

SQL4_15=UNION ALL 
SQL4_16= SELECT distinct 
SQL4_17=  'Total' as C1,
SQL4_18=  7*60 as C2,
SQL4_19=  0 as C3,
SQL4_20=  0 as C4,
SQL4_21=  0 as C5_Repas, 7*60 as C6
SQL4_22= FROM {/*OWNER*/}MONTHLABEL ml0, {/*OWNER*/}PERIOD p, {/*OWNER*/}CALENDAR c 
SQL4_23= WHERE p.DATEBEGIN+ml0.NoMonth<=p.DATEEND AND p.ID={/*CODEPERIOD*/} 
SQL4_24=  AND not exists (select 1 from {/*OWNER*/}Planning pl where pl.IdDriver='{/*CODEDRIVER*/}' and pl.DateAction=p.DateBegin+ml0.NoMonth and pl.NbDayUsed>0) 
SQL4_25=  AND WeekDay(cdate(left(p.DATEBEGIN,4) + '/' + mid(p.DATEBEGIN,5,2) + '/' + right(p.DATEBEGIN,2))+ml0.NoMonth, 2) >=1
SQL4_26=  and WeekDay(cdate(left(p.DATEBEGIN,4) + '/' + mid(p.DATEBEGIN,5,2) + '/' + right(p.DATEBEGIN,2))+ml0.NoMonth, 2) <6 
SQL4_27=  and c.DATECAL=p.DATEBEGIN+ml0.NoMonth and c.WorkDay=0
SQL4_28=) Group BY C1


