SQL1=SELECT distinct
SQL1_1=   '{/*STRDATE1*/}' as dateFirst,
SQL1_2=   '{/*STRDATE2*/}' as dateLast,
SQL1_3=   Now() as PrintTime, 
SQL1_4=   trim(max(ct.LastName)) + '  ' + max(ct.FirstName) as ResourceName, ct.idResource
SQL1_5= FROM {/*OWNER*/}Contract ct
SQL1_6= WHERE ct.IdResource='{/*RESOURCEID*/}'
SQL1_7=  GROUP BY ct.IdResource


DATA2=INFO_DATECMD
NAME2=InfoDateCmd


SQL2=SELECT Title, 
SQL2_1=   sum(IIF(NoMonth='01',V,0)), sum(IIF(NoMonth='02',V,0)), sum(IIF(NoMonth='03',V,0)), 
SQL2_2=   sum(IIF(NoMonth='04',V,0)), sum(IIF(NoMonth='05',V,0)), sum(IIF(NoMonth='06',V,0)), 
SQL2_3=   sum(IIF(NoMonth='07',V,0)), sum(IIF(NoMonth='08',V,0)), sum(IIF(NoMonth='09',V,0)), 
SQL2_4=   sum(IIF(NoMonth='10',V,0)), sum(IIF(NoMonth='11',V,0)), sum(IIF(NoMonth='12',V,0)),
SQL2_5=   IIF(Title='Taux absence',trim(format(sum(V)/12,'0.0')),trim(format(sum(V),'0.0'))), Comments, ORD
SQL2_6= from (

SQL2_7= SELECT
SQL2_8=   ra.idTypeAbsence as Title,
SQL2_9=   sum(IIF(ra.timeStart>'12:00' or ra.timeEnd<'14:00',0.5,1)) as V,
SQL2_10=  m.id as NoMonth, 
SQL2_11=  (select ta.comments from {/*OWNER*/}TypeAbsence ta where ta.id=ra.idTypeAbsence) as Comments, 1 as ORD
SQL2_12= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_13= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' and d.category='ENUMERATION' and d.ID>='01' and d.ID<='31' and DateAdd('d', d.ID-1, DateAdd('m', m.ID-1, '{/*D1*/}')) <= DateAdd('d',-1,DateAdd('m',m.ID+0,'{/*D1*/}')) 
SQL2_14=  and ra.DateStart<='{/*YEAR*/}-'+m.ID+'-'+d.ID and '{/*YEAR*/}-'+m.ID+'-'+d.ID<=ra.DateEnd
SQL2_15= group by ra.idTypeAbsence, ra.comments, m.id

SQL2_16= UNION ALL SELECT
SQL2_17=  'Total absence' as Title,
SQL2_18=  sum(IIF(ra.timeStart>'12:00' or ra.timeEnd<'14:00',0.5,1)) as V,
SQL2_19=  m.id as NoMonth, 
SQL2_20=  'Total absence' as Comments, 2 as ORD
SQL2_21= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_22= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' and d.category='ENUMERATION' and d.ID>='01' and d.ID<='31' and DateAdd('d', d.ID-1, DateAdd('m', m.ID-1, '{/*D1*/}')) <= DateAdd('d',-1,DateAdd('m',m.ID+0,'{/*D1*/}')) 
SQL2_23=  and ra.DateStart<='{/*YEAR*/}-'+m.ID+'-'+d.ID and '{/*YEAR*/}-'+m.ID+'-'+d.ID<=ra.DateEnd
SQL2_24= group by m.id

SQL2_25= UNION ALL SELECT
SQL2_26=   'Total travaillé' as Title,
SQL2_27=   count(1) as V,
SQL2_28=   m.id as NoMonth, 
SQL2_29=  'JT' as Comments, 3 as ORD
SQL2_30= FROM {/*OWNER*/}Resource_Date rd, {/*OWNER*/}Alias m
SQL2_31= WHERE rd.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' 
SQL2_32=   and '{/*YEAR*/}-'+m.ID+'-01'<=rd.DateResource and rd.DateResource<='{/*YEAR*/}-'+m.ID+'-31' 
SQL2_33= GROUP BY m.id

SQL2_34= UNION ALL SELECT
SQL2_35=   'TOTAL' as Title,
SQL2_36=   count(1) as V,
SQL2_37=   m.id as NoMonth, 
SQL2_38=  'Total global' as Comments, 4 as ORD
SQL2_39= FROM {/*OWNER*/}Resource_Date rd, {/*OWNER*/}Alias m
SQL2_40= WHERE rd.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' 
SQL2_41=   and '{/*YEAR*/}-'+m.ID+'-01'<=rd.DateResource and rd.DateResource<='{/*YEAR*/}-'+m.ID+'-31' 
SQL2_42= GROUP BY m.id

SQL2_43= UNION ALL SELECT
SQL2_44=  'TOTAL' as Title,
SQL2_45=  sum(IIF(ra.timeStart>'12:00' or ra.timeEnd<'14:00',0.5,1)) as V,
SQL2_46=  m.id as NoMonth, 
SQL2_47=  'Total global' as Comments, 4 as ORD
SQL2_48= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_49= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' and d.category='ENUMERATION' and d.ID>='01' and d.ID<='31' and DateAdd('d', d.ID-1, DateAdd('m', m.ID-1, '{/*D1*/}')) <= DateAdd('d',-1,DateAdd('m',m.ID+0,'{/*D1*/}')) 
SQL2_50=  and ra.DateStart<='{/*YEAR*/}-'+m.ID+'-'+d.ID and '{/*YEAR*/}-'+m.ID+'-'+d.ID<=ra.DateEnd
SQL2_51= group by m.id

SQL2_52= UNION ALL SELECT
SQL2_53=  'Total absence' as Title,
SQL2_54=  trim(format(sum(IIF(ra.timeStart>'12:00' or ra.timeEnd<'14:00',0.5,1))*100.0/(sum(IIF(ra.timeStart>'12:00' or ra.timeEnd<'14:00',0.5,1))+(select count(1) from {/*OWNER*/}Resource_Date ra where ra.dateResource>='{/*YEAR*/}-'+m.ID+'-01' and ra.dateResource<='{/*YEAR*/}-'+m.ID+'-31' and ra.worktime>0)),'0.0') ) as V,

SQL2_55=  m.id as NoMonth, 
SQL2_56=  'Taux absence / jours ouvrables' as Comments, 5 as ORD
SQL2_57= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_58= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and m.ID>='01' and m.ID<='12' and d.category='ENUMERATION' and d.ID>='01' and d.ID<='31' and DateAdd('d', d.ID-1, DateAdd('m', m.ID-1, '{/*D1*/}')) <= DateAdd('d',-1,DateAdd('m',m.ID+0,'{/*D1*/}')) 
SQL2_59=  and ra.DateStart<='{/*YEAR*/}-'+m.ID+'-'+d.ID and '{/*YEAR*/}-'+m.ID+'-'+d.ID<=ra.DateEnd
SQL2_60= group by m.id

SQL2_61= ) dat group by Title,comments, ORD ORDER BY ORD,Title;


DATA3=LIST
NAME3=List


SQL3=SELECT distinct
SQL3_1=   numDate as DATE1, DateAdd('d', -1, DateAdd('m', 12, numDate)) as DATE2,
SQL3_2=   format(numDate,'dd/MM/yyyy') as STRDATE1, format(DateAdd('d', -1, DateAdd('m', 12, numDate)),'dd/MM/yyyy') as STRDATE2,
SQL3_3=   format(numDate,'yyyy-MM-dd') as D1,
SQL3_4=   format(DateAdd('d', -1, DateAdd('m', 12, numDate)),'yyyy-MM-dd') as D2,
SQL3_5=   IDR as RESOURCEID, mid('{/*PARAM4*/}',1,4) as YEAR
SQL3_6= from (SELECT DateSerial(mid('{/*PARAM4*/}',1,4), 01, 01) as numDate, 
SQL3_7=   DatePart('w', DateSerial(mid('{/*PARAM4*/}',1,4), 01, 01),2) as numDay,
SQL3_8=   r.IdResource as IDR
SQL3_9=  FROM {/*OWNER*/}Contract r
SQL3_10= WHERE r.IdResource in ({/*PARAM5*/}) 
SQL3_11=) dat 
SQL3_12= ORDER BY IDR


