SQL2_3=   CL.Id as CODECLIENT, 
SQL2_4=   CL.BankAccount as BANKACCOUNT, 
SQL2_5=   CL.Country as COUNTRY, 
SQL2_6=  IIF(CL.Country='France','Préparation de livraison  ','Delivery preparation   ') as TITLEDOC,
SQL2_7=  IIF(CL.Country='France','No : ','no : ') as TITLECODEOBJ,
SQL2_8=  D.Id as CODEOBJ,
SQL2_9=   'Date : ' as TITLEDATEOBJ,
SQL2_10=  IIF(CL.Country in ('France','FRANCE'), ( mid(D.DateDelivery,9,2)+'/'+mid(D.DateDelivery,6,2)+'/'+mid(D.DateDelivery,1,4)) , ( mid(D.DateDelivery,1,4)+'-'+mid(D.DateDelivery,6,2)+'-'+mid(D.DateDelivery,9,2)) ) as DATEOBJ,
SQL2_11=  IIF(CL.Country in ('France','FRANCE'),'Client No : ','Client No : ') as TITLEREFERENCEOBJ,
SQL2_12=  D.IdClient as REFERENCEOBJ,
SQL2_13=  ' ' as CODECLUB
SQL2_14= FROM {/*OWNER*/}DELIVERY D left join {/*OWNER*/}CLIENT CL on CL.Id=D.IdClient
SQL2_15= WHERE D.ID in ({/*PARAM4*/})



// Addres Delivery
// INSTR3

DATA3=ADDRESS_DELIV
NAME3=AddressDeliv

SQL3=SELECT DISTINCT
SQL3_1=   (IIF(CL.Country='France','Adresse de livraison', 'Shipping adress')) as TitleAdressDeliv, 
SQL3_2=   PT.NameClient as PtDeliv, 
SQL3_3=   PT.Address as AddresDeliv, 
SQL3_4=   PT.AddressSup as AddresSupDeliv, 
SQL3_5=   TRIM(PT.PostCode) + '   ' + PT.City as PostCodeCityDeliv, 
SQL3_6=   (IIF(CL.Country='France',' ',CL.Country)) as CountryDeliv,
SQL3_7=   D.ID as IdDelivery,
SQL3_8=   format(D.DateDelivery,'DD/MM/YYYY') as DateDeliv ,
SQL3_9=   D.IdPacking as Packing,
SQL3_10=  (select IdSender from PACKING P where P.Id=D.IdPacking) as Sender,
SQL3_11=  ((IIF(CL.Country='France','Suivi par : ','Followed by: '))+(IIF(D.FollowedBy is NULL,' ',D.FollowedBy)))  as FollowedBy
SQL3_12= FROM {/*OWNER*/}DELIVERY D , {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT
SQL3_13= WHERE CL.Id=D.IdClient
SQL3_14=  AND PT.IdClient=D.IdClient AND PT.IdPoint=D.IdPointDelivery
SQL3_15= AND D.ID='{/*CODEDELIVERY*/}'



// detail delivery 
// INSTR4, INSTR5

DATA4=INFO_DELIVERY
NAME4=InfoDelivery

SQL4=SELECT 
SQL4_1=   PACKING as C1, 
SQL4_2=   PALETTE as C2, 
SQL4_3=   PRODUCT as C3, 
SQL4_4=   DESIGNATION as C4,
SQL4_5=   Cmd,
SQL4_6=   QTY,
SQL4_7=   NW as C7, 
SQL4_8=   GW as C8,
SQL4_9=   L as C9, 
SQL4_10=  W as C10, 
SQL4_11=  H as C11, PalletDelivery as C12
SQL4_12= FROM (SELECT
SQL4_13=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdProduct<LD.IdProduct or (LD1.IdProduct=LD.IdProduct and LD1.IdOrder<LD.IdOrder))),' ',LD.IdPacking)) as PACKING, 
SQL4_14=   LD.IdDelivery as IdDelivery, 
SQL4_15=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdProduct<LD.IdProduct or (LD1.IdProduct=LD.IdProduct and LD1.IdOrder<LD.IdOrder))),' ',LD.NoPallet)) as PALETTE, 
SQL4_16=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND LD1.IdProduct=LD.IdProduct AND LD1.IdOrder<LD.IdOrder),' ',A.ID)) as PRODUCT, 
SQL4_17=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND LD1.IdProduct=LD.IdProduct AND LD1.IdOrder<LD.IdOrder),' ',A.Designation)) as DESIGNATION,
SQL4_18=   LD.IdOrder as Cmd,
SQL4_19=   format(LD.Quantity,'0') as QTY,
SQL4_20=   format(A.Weight*LD.Quantity, '0.0') as NW, 
SQL4_21=   (IIF(P.WeightGlobal is NULL and D.WeightPallet is NULL,'PN + 30', IIF(D.WeightPallet is NULL,('PN + '+format(D.WeightPallet,'0')),format(P.WeightGlobal,'0')) )) as GW,
SQL4_22=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdProduct<LD.IdProduct or (LD1.IdProduct=LD.IdProduct and LD1.IdOrder<LD.IdOrder))),' ',round(P.Length))) as L, 
SQL4_23=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdProduct<LD.IdProduct or (LD1.IdProduct=LD.IdProduct and LD1.IdOrder<LD.IdOrder))),' ',round(P.Width))) as W, 
SQL4_24=   (IIF(exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD1 where LD1.IdDelivery=LD.IdDelivery AND LD1.IdPacking=LD.IdPacking AND LD1.NoPallet=LD.NoPallet AND (LD1.IdProduct<LD.IdProduct or (LD1.IdProduct=LD.IdProduct and LD1.IdOrder<LD.IdOrder))),' ',round(P.Height))) as H,
SQL4_25=   LD.IdPacking as IDPACKING, 
SQL4_26=   LD.NoPallet as NoPALETTE, 
SQL4_27=   A.ID as IdPRODUCT, 
SQL4_28=  LD.NoPalletDelivery as PalletDelivery
SQL4_29= FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT LD on D.ID=LD.IdDelivery)
SQL4_30=   inner join {/*OWNER*/}PRODUCT A on A.ID=LD.IdProduct)
SQL4_31=   left join {/*OWNER*/}PALLET P on P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL4_32= WHERE A.TypeProduct='P'
SQL4_33=   AND LD.IdDelivery='{/*CODEDELIVERY*/}'
SQL4_34= ) t
SQL4_35= ORDER BY IdPACKING, NoPALETTE, IdProduct, Cmd



////////////// not used
DATA5=INFO_ORDERS
NAME5=INFOORDERS

SQL5=SELECT DISTINCT
SQL5_1=   LD.IdPacking as C1,
SQL5_2=   ' ' as C2,
SQL5_3=   ' ' as C3,
SQL5_4=   ' ' as C4,
SQL5_5=   LD.IdOrder as CMD5,
SQL5_6=   LD.Quantity as QTY6,
SQL5_7=   ' ' as C7,
SQL5_8=   ' ' as C8,
SQL5_9=   ' ' as C9,
SQL5_10=   ' ' as C10,
SQL5_11=   ' ' as C11
SQL5_12= FROM {/*OWNER*/}DELIVERY_PRODUCT LD
SQL5_13= WHERE LD.IdDelivery='{/*CODEDELIVERY*/}'
SQL5_14=   AND LD.IdPacking='{/*PACKING*/}' AND LD.NoPallet={/*PALETTE*/} AND LD.IdProduct='{/*PRODUCT*/}' 
SQL5_15=   AND LD.IdOrder>= (select min(LD1.IdOrder) from {/*OWNER*/}DELIVERY_PRODUCT LD1
SQL5_16=      WHERE LD1.IdDelivery='{/*CODEDELIVERY*/}'
SQL5_17=       AND LD1.IdPacking='{/*PACKING*/}' AND LD1.NoPallet={/*PALETTE*/} AND LD1.IdProduct='{/*PRODUCT*/}'
SQL5_18=    )
SQL5_19= ORDER BY LD.IdOrder



DATA6=LINE_TOTAL
NAME6=LINETOTAL

SQL6=SELECT DISTINCT 'TOTAL' as Col6, sum(QTY_C9) as Col9, round(sum(C10)) as Col10, round(sum(C11)) as Col11, count(1) as Col12_NbPallet
SQL6_1= FROM (SELECT LD.IdPacking, LD.NoPallet,
SQL6_2=   sum(LD.Quantity) as QTY_C9,
SQL6_3=   sum(A.Weight*LD.Quantity) as C10, 
SQL6_4=   sum(A.Weight*LD.Quantity)+ (IIF(P.WeightGlobal is NULL and D.WeightPallet is NULL,30, IIF(D.WeightPallet is not NULL,min(D.WeightPallet),min(P.WeightGlobal)-min(P.WeightNet)) )) as C11
SQL6_5=  FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT LD on D.ID=LD.IdDelivery)
SQL6_6=   inner join {/*OWNER*/}PRODUCT A on A.ID=LD.IdProduct) 
SQL6_7=   LEFT JOIN {/*OWNER*/}PALLET P on P.IdPacking=LD.IdPacking AND P.NoPallet=LD.NoPallet
SQL6_8=  WHERE A.TypeProduct='P' and LD.NoPalletDelivery is NULL
SQL6_9=   AND D.ID='{/*CODEDELIVERY*/}' 
SQL6_10= GROUP BY LD.IdPacking, LD.NoPallet, P.WeightGlobal, D.WeightPallet
SQL6_11= UNION ALL SELECT LD.IdDelivery, LD.NoPalletDelivery,
SQL6_12=   sum(LD.Quantity) as QTY_C9,
SQL6_13=   sum(A.Weight*LD.Quantity) as C10, 
SQL6_14=   sum(A.Weight*LD.Quantity)+ (IIF(P.WeightGlobal is NULL and D.WeightPallet is NULL,30, IIF(D.WeightPallet is not NULL,min(D.WeightPallet),min(P.WeightGlobal)-min(P.WeightNet)) )) as C11
SQL6_15= FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT LD on D.ID=LD.IdDelivery)
SQL6_16=   inner join {/*OWNER*/}PRODUCT A on A.ID=LD.IdProduct) 
SQL6_17=   LEFT JOIN {/*OWNER*/}PALLET P on P.IdPacking=LD.IdDelivery AND P.NoPallet=LD.NoPalletDelivery
SQL6_18= WHERE A.TypeProduct='P' and LD.NoPalletDelivery is not NULL
SQL6_19=   AND D.ID='{/*CODEDELIVERY*/}'
SQL6_20= GROUP BY LD.IdDelivery, LD.NoPalletDelivery, P.WeightGlobal, D.WeightPallet) t




