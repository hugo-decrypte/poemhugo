// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   IIF(AG.NAME is not NULL,AG.NAME,' ') as Nom,
SQL1_2=   IIF(AG.LABEL is not NULL,AG.LABEL,' ') as Label,
SQL1_3=   IIF(AG.ADDRESS is not NULL,AG.ADDRESS,' ') as Adr,
SQL1_4=   IIF(AG.ADDRESSSUP is not NULL,AG.ADDRESSSUP,' ') as Adr2,
SQL1_5=   IIF(AG.PostCode is not NULL,AG.PostCode,' ') as CodePost,
SQL1_6=   IIF(AG.City is not NULL,AG.City,' ') as City,
SQL1_7=   IIF(AG.Country is not NULL,AG.Country,'France') as Country,
SQL1_8=   IIF(AG.Phone is not NULL,AG.Phone,' ') as Phone,
SQL1_9=   IIF(AG.Fax is not NULL,AG.Fax,' ') as Fax,
SQL1_10=  IIF(AG.EMAIL is not NULL,AG.EMAIL,' ') as Mail,

SQL1_11=  IIF(AG.Capital is not NULL,AG.Capital,'Type Société : ________ au capital de ______ _') as TypeCompagny,
SQL1_12=  ('TVA Intracom : '+ IIF(AG.NumTVA is not NULL,AG.NumTVA,' ') ) as NoTVA,
SQL1_13=  IIF(AG.Siret is not NULL,AG.Siret,'SIRET :') as Siret,
SQL1_14=  IIF(AG.RCS is not NULL,AG.RCS,'RCS :') as RCS,
SQL1_15=  IIF(AG.APE is not NULL,AG.APE,'APE :') as APE,

SQL1_16=  ('SIRET : '+ IIF(AG.Siret is not NULL,trim(AG.Siret),' ') +' - RCS : '+ IIF(AG.RCS is not NULL,trim(AG.RCS),' ') +' - APE : '+ IIF(AG.APE is not NULL,AG.APE,' ') ) as InfoRegistre,
SQL1_17=  ('IBAN : '+ IIF(B.IBAN is NULL,' ',trim(B.IBAN)) +' - BIC : '+ IIF(B.BIC is NULL,' ',trim(B.BIC)) +'  '+ IIF(B.Name is NULL,' ',trim(B.Name)) ) as BankInfo,
SQL1_18=  IIF(CL.Country='France',('Imprimée le '+ format(Now(), 'DD/MM/YYYY,  hh:nn:ss')) ,('Printed '+ format(Now(), '%m %d, %Y,  %H:%i:%s')) ) as PrintDate,

SQL1_19=  IIF(CL.Country='France','Confirmation Commande','Confirmation Order') as TitleOrder,
SQL1_20=  IIF(CL.Country='France','Commande No : ','Order no : ') as IdOrder,
SQL1_21=  O.Id as IdOrder,
SQL1_22=  IIF(CL.Country='France','Date de Livraison : ','Delivery date : ') as TitleDeliveryDate,
SQL1_23=  format(O.DateDelivery,'DD/MM/YYYY') as DeliveryDate,
SQL1_24=  IIF(CL.Country='France','Référence : ','Reference : ') as TitleReference,
SQL1_25=  O.Reference as Reference
SQL1_26= FROM (({/*OWNER*/}CLIENTORDER O left join {/*OWNER*/}AGENCY AG on AG.ID=O.IdAgency)
SQL1_27=  left join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient)
SQL1_28=  left join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL1_29= WHERE  O.Id={/*PARAM4*/}
// compagny Registre info, BankInfo in FOOTER


DATA2=INFO_ADRESS
NAME2=InfoAdress

SQL2=SELECT 
SQL2_1=   IIF(CL.Country='France',('Date : '+ format(Now(),'DD') +' '+ MTD.NameFR +' '+ format(Now(),'YYYY')) 
SQL2_2=   ,('Date : '+ MTD.NameEN +' '+ format(Now(),'DD') +', '+ format(Now(),'YYYY')) ) as DateFactC1,
SQL2_3=   (IIF(CL.Country='France','Commande : ','Order no : ') +O.Id) as IdCommandC2,
SQL2_4=   IIF(CL.Country='France',('Date commande : '+format(O.DateOrder,'DD')+' '+MCM.NameFR+' '+format(O.DateOrder,'YYYY')) 
SQL2_5=    ,('Order date : '+MCM.NameEN+' '+format(O.DateOrder,'DD')+', '+format(O.DateOrder,'YYYY')) ) as DateCommandC3,
SQL2_6=   (IIF(CL.Country='France','Notre Référence : ','Our reference: ') + IIF(O.Reference is not NULL,O.Reference,' ') ) as ReferenceC4,
SQL2_7=   IIF(CL.Country='France','Destinataire','Recipient') as TitleAdressC5, 
SQL2_8=   CL.Name as NameCliC6, 
SQL2_9=   CL.Address as AddresCliC7, 
SQL2_10=  CL.AddressSup as AddresSupCliC8, 
SQL2_11=  (TRIM(CL.PostCode)+'   '+CL.City) as PostCodeCityC9, 
SQL2_12=  IIF(CL.Country='France',' ',CL.Country) as CountryC10
SQL2_13= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}MONTHLABEL MTD, {/*OWNER*/}MONTHLABEL MCM
SQL2_14= WHERE CL.Id=O.IdClient 
SQL2_15=   AND MTD.NoMonth=format(Now(), 'MM')
SQL2_16=   AND MCM.NoMonth=format(addDate(O.DateDelivery,30), 'MM')
SQL2_17=   AND O.Id in ({/*PARAM4*/})

/////////////////////////
DATA3=INFO_TITLE
NAME3=InfoTitre


SQL3=SELECT DISTINCT
SQL3_1=   'Référence' as C1, 'Désignation' as C2, 'Date de' as C3, 'livraison' as C4, 'prévue' as C5, 
SQL3_2=   'Quantité' as C6, 'Prix d''achat' as C7, 'unitaire en' as C8, 'EUR' as C9,
SQL3_3=   '%' as C10, 'Remise' as C11, 'Montant net' as C12, 'H.T. en' as C13, 'EUR' as C14, Comments as C15
SQL3_4= FROM {/*OWNER*/}CLIENTORDER O
SQL3_5= WHERE O.Id={/*PARAM4*/}


DATA4=INFO_ORDERS
NAME4=INFOORDERS

SQL4=SELECT 
SQL4_1=   LC.IdProduct as C1,
SQL4_2=   A.Designation as "DesigC2",
SQL4_3=   IIF(LC.DateDelivery is not NULL and LC.DateDelivery>0,format(LC.DateDelivery,'DD/MM/YYYY'),' ') as "DateLivC3",
SQL4_4=   LC.Quantity as "QTYC4",
SQL4_5=   format(LC.PriceUnit,'0.0000') as C5,
SQL4_6=   IIF(LC.Discount is not NULL and LC.Discount>0,(format(LC.Discount,'0.0')+'%') ,' ') as C6,
SQL4_7=   IIF(LC.Discount is not NULL and LC.Discount>0,format(LC.Quantity*LC.PriceUnit*(LC.Discount)/100.0, '0.00'),' ') as C7,
SQL4_8=   format(LC.Quantity*LC.PriceUnit*(100.0-LC.Discount)/100.0, '0.00') as C8
SQL4_9=  FROM {/*OWNER*/}ORDER_PRODUCT LC, {/*OWNER*/}PRODUCT A
SQL4_10= WHERE LC.IdOrder={/*PARAM4*/}
SQL4_11=   AND LC.IdProduct=A.ID 
SQL4_12= ORDER BY LC.DateDelivery, LC.IdProduct





DATA5=LINE_TOTAL
NAME5=LINETOTAL

SQL5=SELECT 
SQL5_1=   'TOTAL' as C1,
SQL5_2=   ' ' as "DesigC2",
SQL5_3=   ' ' as "DateLivC3",
SQL5_4=   ' ' as "QTYC4",
SQL5_5=   ' ' as C5,
SQL5_6=   ' ' as C6,
SQL5_7=   format(sum(LC.Quantity*LC.PriceUnit*(LC.Discount)/100.0),'0.00')  as C7,
SQL5_8=   format(sum(LC.Quantity*LC.PriceUnit*(100-LC.Discount)/100.0),'0.00') as C8,
SQL5_9=   LC.IdOrder as C9 
SQL5_10= FROM {/*OWNER*/}ORDER_PRODUCT LC
SQL5_11= WHERE LC.IdOrder={/*PARAM4*/}
SQL5_12= GROUP BY LC.IdOrder



