SQL1=SELECT 
SQL1_1=   IIF(AG.NAME is not NULL,AG.NAME,' ') as Nom,
SQL1_2=   IIF(AG.LABEL is not NULL,AG.LABEL,' ') as Label,
SQL1_3=   IIF(AG.ADDRESS is not NULL,AG.ADDRESS,' ') as Adr,
SQL1_4=   IIF(AG.ADDRESSSUP is not NULL,AG.ADDRESSSUP,' ') as Adr2,
SQL1_5=   IIF(AG.PostCode is not NULL,AG.PostCode,' ') as CodePost,
SQL1_6=   IIF(AG.City is not NULL,AG.City,' ') as City,
SQL1_7=   IIF(AG.Country is not NULL,AG.Country,'France') as Country,
SQL1_8=   IIF(AG.Phone is not NULL,AG.Phone,' ') as Phone,
SQL1_9=   IIF(AG.Fax is not NULL,AG.Fax,' ') as Fax,
SQL1_10=  IIF(AG.EMAIL is not NULL,AG.EMAIL,' ') as Mail,

SQL1_11=  IIF(AG.Capital is not NULL,AG.Capital,'Type Société : ________ au capital de ______ _') as TypeCompagny,
SQL1_12=  ('TVA Intracom : '+ IIF(AG.codeTax is not NULL,AG.codeTax,' ') ) as NoTVA,
SQL1_13=  IIF(AG.establishment is not NULL,AG.establishment,'SIRET :') as Siret,
SQL1_14=  IIF(AG.RCS is not NULL,AG.RCS,'RCS :') as RCS,
SQL1_15=  IIF(AG.APE is not NULL,AG.APE,'APE :') as APE,

SQL1_16=  ('SIRET : '+ IIF(AG.establishment is not NULL,trim(AG.establishment),' ') +' - RCS : '+ IIF(AG.RCS is not NULL,trim(AG.RCS),' ') +' - APE : '+ IIF(AG.APE is not NULL,AG.APE,' ') ) as InfoRegistre,
SQL1_17=  (select ('IBAN : '+ IIF(B.IBAN is NULL,' ',trim(B.IBAN)) +' - BIC : '+ IIF(B.BIC is NULL,' ',trim(B.BIC)) +'  '+ IIF(B.Name is NULL,' ',trim(B.Name)) ) from {/*OWNER*/}BANKACCOUNT B where B.ID='{/*BANKACCOUNT*/}') as BankInfo,
SQL1_18=  IIF('{/*COUNTRY*/}' in ('France','FRANCE'),('Imprimée le '+ format(Now(), 'DD/MM/YYYY, hh:nn:ss')) ,('Printed '+ format(Now(), 'YYYY-MM-DD, hh:nn:ss')) ) as PrintDate,

SQL1_19=  '{/*TITLEDOC*/}' as TitleDoc,
SQL1_20=  '{/*TITLECODEOBJ*/}' as TitleObj,
SQL1_21=  '{/*CODEOBJ*/}' as CodeObj,
SQL1_22=  '{/*TITLEDATEOBJ*/}' as TitleDateObj,
SQL1_23=  '{/*DATEOBJ*/}' as DateObj,
SQL1_24=  '{/*TITLEREFERENCEOBJ*/}' as TitleRefObj,
SQL1_25=  '{/*REFERENCEOBJ*/}' as RefObj
SQL1_26= FROM {/*OWNER*/}AGENCY AG
SQL1_27= WHERE  AG.Id='{/*CODEAGENCY*/}'

// compagny Registre info, BankInfo in FOOTER


// compagny Registre info in FOOTER



DATA2=OBJ_DATA
NAME2=OBJ_DATA


SQL2=SELECT 
SQL2_1=   PK.Id as CODEPACKING, PL.NoPallet as NOPALLET,
SQL2_2=   PK.IdAgency as CODEAGENCY, 
SQL2_3=   PK.NbPallet as Nb, 
SQL2_4=   ' ' as BANKACCOUNT, 
SQL2_5=   PK.Country as COUNTRY, 
SQL2_6=  IIF(PK.Country='France','Palette en Stock  ','Pallet in stock  ')  as TITLEDOC,
SQL2_7=  IIF(PK.Country='France','Entrée No : ','Checkin no : ') as TITLECODEOBJ,
SQL2_8=  PK.Id as CODEOBJ,
SQL2_9=   'Date : ' as TITLEDATEOBJ,
SQL2_10=  IIF(PK.Country in ('France','FRANCE'), ( mid(PK.DateDelivery,9,2)+'/'+mid(PK.DateDelivery,6,2)+'/'+mid(PK.DateDelivery,1,4)) , ( mid(PK.DateDelivery,1,4)+'-'+mid(PK.DateDelivery,6,2)+'-'+mid(PK.DateDelivery,9,2)) ) as DATEOBJ,
SQL2_11=  IIF(PK.Country in ('France','FRANCE'),'Réception : ','Received By : ') as TITLEREFERENCEOBJ,
SQL2_12=  PK.ReceivedBy as REFERENCEOBJ,
SQL2_13=  ' ' as CODECLUB
SQL2_14= FROM {/*OWNER*/}PACKING PK inner join {/*OWNER*/}PALLET PL  on PK.Id=PL.IdPacking
SQL2_15= WHERE PK.ID in ({/*PARAM4*/})

DATA3=INFO_DELIVERY
NAME3=InfoDelivery

SQL3=SELECT 
SQL3_1=   NoLot, DateExpiration, PRODUCT, 
SQL3_2=   DescriArticle,
SQL3_3=   Cmd,
SQL3_4=   format(QTY,'0'),
SQL3_5=   format(NW,'0.0')
SQL3_6= FROM (SELECT
SQL3_7=   P.ID as PRODUCT, 
SQL3_8=   P.Designation as DescriArticle,
SQL3_9=   ' ' as Cmd,
SQL3_10=   sum(LP.Quantity) as QTY,
SQL3_11=   IIF(LP.NoLot is not NULL and LP.NoLot>' ',LP.NoLot, IIF(LP.DateCreate is not NULL and LP.DateCreate >'0',format(LP.DateCreate,'YYYY-MM-DD'),' ') ) as NoLot,
SQL3_12=   IIF(LP.DateExpiration is not NULL and LP.DateExpiration>0, format(LP.DateExpiration,'YYYY-MM-DD'),' ') as DateExpiration,
SQL3_13=   P.Weight*sum(LP.Quantity) as NW 
SQL3_14= FROM (({/*OWNER*/}PACKING PK
SQL3_15=  inner join {/*OWNER*/}PALLET PL on PK.Id=PL.IdPacking)
SQL3_16=  inner join {/*OWNER*/}PALLET_PRODUCT LP on LP.IdPacking=PL.IdPacking and LP.NoPallet=PL.NoPallet)
SQL3_17=  inner join {/*OWNER*/}PRODUCT P on P.ID=LP.IdProduct
SQL3_18= WHERE P.TypeProduct<>'F' 
SQL3_19=   AND PK.Id='{/*CODEPACKING*/}'
SQL3_20=   and PL.NoPallet={/*NOPALLET*/}
SQL3_21= Group BY P.ID, P.Designation, P.Weight, LP.IdProduct,LP.NoLot, LP.DateCreate, LP.DateExpiration
SQL3_22= ORDER BY LP.IdProduct) t



//////////////
DATA4=INFO_ORDERS
NAME4=INFOORDERS

SQL4=SELECT DISTINCT
SQL4_1=   LD.IdPacking as C1,
SQL4_2=   ' ' as C2,
SQL4_3=   ' ' as C3,
SQL4_4=   ' ' as C4,
SQL4_5=   LD.IdOrder as CMD5,
SQL4_6=   LD.Quantity as QTY6,
SQL4_7=   ' ' as C7,
SQL4_8=   ' ' as C8,
SQL4_9=   ' ' as C9,
SQL4_10=   ' ' as C10,
SQL4_11=   ' ' as C11
SQL4_12= FROM {/*OWNER*/}PALLET_PRODUCT LP
SQL4_13= WHERE LP.IdPacking='{/*PACKING*/}'
SQL4_14=   AND LP.NoPallet={/*PALETTE*/} AND LP.IdProduct='{/*PRODUCT*/}'



DATA5=LINE_TOTAL
NAME5=LINETOTAL

SQL5=SELECT DISTINCT 'TOTAL' as Col6, sum(QTY_C9) as Col9, round(sum(C10)) as Col10, round(sum(C11)) as Col11
SQL5_1=   FROM (SELECT PL.IdPacking, PL.NoPallet,
SQL5_2=   sum(LP.Quantity) as QTY_C9,
SQL5_3=   sum(P.Weight*LP.Quantity) as C10, 
SQL5_4=   sum(P.Weight*LP.Quantity)+ IIF(PL.WeightPallet is NULL,30,PL.WeightPallet) as C11
SQL5_5= FROM (({/*OWNER*/}PALLET PL inner join {/*OWNER*/}PALLET_PRODUCT LP on PL.IdPacking=LP.IdPacking and PL.NoPallet=LP.NoPallet)
SQL5_6=   inner join {/*OWNER*/}PRODUCT P on P.ID=LP.IdProduct) 
SQL5_7= WHERE P.TypeProduct<>'F' 
SQL5_8=   AND PL.IdPacking='{/*CODEPACKING*/}' and PL.NoPallet={/*NOPALLET*/}
SQL5_9= GROUP BY PL.IdPacking, PL.NoPallet, PL.WeightPallet) t




DATA6=ADDRESS_DELIV
NAME6=AddressDeliv

SQL6=SELECT DISTINCT
SQL6_1=   IIF(PK.Country='France','Adresse départ','Shipping adress') as TitleAdressDeliv, 
SQL6_2=   PK.IdSender as PtDeliv, 
SQL6_3=   PK.ReceivedBy as AddresDeliv, 
SQL6_4=   PK.ShipmentPort as AddresSupDeliv, 
SQL6_5=   PK.ShipNo as PostCodeCityDeliv, 
SQL6_6=   IIF(PK.Country='France',' ',PK.Country) as CountryDeliv,
SQL6_7=   PK.Id as IdDelivery,
SQL6_8=   ('{/*NOPALLET*/} ('+(select format(count(1),'0') from {/*OWNER*/}PALLET PL0 where PL0.IdPacking=PK.Id and PL0.NoPallet<={/*NOPALLET*/} )+' / ' + (select format(count(1), '0') from {/*OWNER*/}PALLET PL0 where PL0.IdPacking=PK.Id) + ')') as NoP,
SQL6_9=   format(PL.DatePreparation,'DD/MM/YYYY') as DateModif ,
SQL6_10=  (format(PL.Length,'0')+' x '+format(PL.Width,'0')+' x '+format(PL.Height,'0')+' cm')  as Dimension,
SQL6_11=  (format(PL.WeightNet,'0')+' KG') as WN, (format(IIF(PL.WeightGlobal is NULL or PL.WeightGlobal<PL.WeightNet,PL.WeightNet+30,PL.WeightGlobal),'0')+' KG')  as WG,
SQL6_12=  format(PK.DateDelivery,'DD/MM/YYYY') as DateDeliv 
SQL6_13= FROM {/*OWNER*/}PACKING PK , {/*OWNER*/}PALLET PL
SQL6_14= WHERE PK.Id=PL.IdPacking 
SQL6_15=  AND PK.Id='{/*CODEPACKING*/}'
SQL6_16=  AND PL.NoPallet={/*NOPALLET*/}



