// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   IIF(AG.NAME is not NULL,AG.NAME,' ') as Nom,
SQL1_2=   IIF(AG.LABEL is not NULL,AG.LABEL,' ') as Label,
SQL1_3=   IIF(AG.ADDRESS is not NULL,AG.ADDRESS,' ') as Adr,
SQL1_4=   IIF(AG.ADDRESSSUP is not NULL,AG.ADDRESSSUP,' ') as Adr2,
SQL1_5=   IIF(AG.PostCode is not NULL,AG.PostCode,' ') as CodePost,
SQL1_6=   IIF(AG.City is not NULL,AG.City,' ') as City,
SQL1_7=   IIF(AG.Country is not NULL,AG.Country,'France') as Country,
SQL1_8=   IIF(AG.Phone is not NULL,AG.Phone,' ') as Phone,
SQL1_9=   IIF(AG.Fax is not NULL,AG.Fax,' ') as Fax,
SQL1_10=  IIF(AG.EMAIL is not NULL,AG.EMAIL,' ') as Mail,

SQL1_11=  IIF(AG.Capital is not NULL,AG.Capital,'Type Société : ________ au capital de ______ _') as TypeCompagny,
SQL1_12=  ('TVA Intracom : '+ IIF(AG.codeTax is not NULL,AG.codeTax,' ') ) as NoTVA,
SQL1_13=  IIF(AG.establishment is not NULL,AG.establishment,'SIRET :') as Siret,
SQL1_14=  IIF(AG.RCS is not NULL,AG.RCS,'RCS :') as RCS,
SQL1_15=  IIF(AG.APE is not NULL,AG.APE,'APE :') as APE,

SQL1_16=  ('SIRET : '+ IIF(AG.establishment is not NULL,trim(AG.establishment),' ') +' - RCS : '+ IIF(AG.RCS is not NULL,trim(AG.RCS),' ') +' - APE : '+ IIF(AG.APE is not NULL,AG.APE,' ') ) as InfoRegistre,
SQL1_17=  (select ('IBAN : '+ IIF(B.IBAN is NULL,' ',trim(B.IBAN)) +' - BIC : '+ IIF(B.BIC is NULL,' ',trim(B.BIC)) +'  '+ IIF(B.Name is NULL,' ',trim(B.Name)) ) from {/*OWNER*/}BANKACCOUNT B where B.ID='{/*BANKACCOUNT*/}') as BankInfo,
SQL1_18=  IIF('{/*COUNTRY*/}' in ('France','FRANCE'),('Imprimée le '+ format(Now(), 'DD/MM/YYYY, hh:nn:ss')) ,('Printed '+ format(Now(), 'YYYY-MM-DD, hh:nn:ss')) ) as PrintDate,

SQL1_19=  '{/*TITLEDOC*/}' as TitleDoc,
SQL1_20=  '{/*TITLECODEOBJ*/}' as TitleObj,
SQL1_21=  '{/*CODEOBJ*/}' as CodeObj,
SQL1_22=  '{/*TITLEDATEOBJ*/}' as TitleDateObj,
SQL1_23=  '{/*DATEOBJ*/}' as DateObj,
SQL1_24=  '{/*TITLEREFERENCEOBJ*/}' as TitleRefObj,
SQL1_25=  '{/*REFERENCEOBJ*/}' as RefObj
SQL1_26= FROM {/*OWNER*/}AGENCY AG
SQL1_27= WHERE  AG.Id='{/*CODEAGENCY*/}'

// compagny Registre info, BankInfo in FOOTER



DATA1=INFO_ADRESS
NAME1=InfoAdress

SQL1=SELECT 
SQL1_1=   IIF (SR.Country='France' , 'Date : ' + mid(str(Now()),1,2) +' '+ MTD.NameFR +' '+ mid(str(Now()),7,4) ,
SQL1_2=    'Date : ' + MTD.NameEN +' '+ mid(str(Now()),1,2) +', '+  mid(str(Now()),7,4) ) as DateFactC1,
SQL1_3=   IIF (SR.Country='France' , 'Commande : '+ S.Id , 'Order no : '+ S.Id) as IdOrderC2,
SQL1_4=   IIF (SR.Country='France' , 'Date commande : ' + mid(str(S.DateSupply),8,2) +' '+ MCM.NameFR +' '+ mid(str(S.DateSupply),2,4) ,
SQL1_5=    'Order date : '  + MCM.NameEN +' '+ mid(str(S.DateSupply),8,2) + ', '+ mid(str(S.DateSupply),2,4)) as DateCommandC3,
SQL1_6=   IIF (SR.Country='France' , 'Notre R f rence : ' , 'Our reference: ') + iif (S.IdOrder is not NULL and S.IdOrder>' ', iif (S.Reference is not NULL and S.Reference>' ', trim(S.IdOrder)+', '+S.Reference, S.IdOrder), iif (S.Reference is not NULL and S.Reference>' ', S.Reference, ' ')) as ReferenceC4,
SQL1_7=   IIF (SR.Country='France' , 'Destinataire' ,  'Recipient') as TitleAdressC5, 
SQL1_8=   SR.Name as NameCliC6, 
SQL1_9=   SR.Address as AddresCliC7, 
SQL1_10=  SR.AddressSup as AddresSupCliC8, 
SQL1_11=  IIF(SR.PostCode is NULL, '', TRIM(SR.PostCode) + '   ') + iif(SR.City is NULL, ' ', SR.City) as PostCodeCityC9, 
SQL1_12=  IIF (SR.Country='France' , ' ' , SR.Country) as CountryC10,
SQL1_13=  IIF (SR.Country='France' , 'Commande' , 'Purchase Order') as TitleC11,
SQL1_14=  S.Comments as CmtC12
SQL1_15= FROM {/*OWNER*/}SUPPLY S, {/*OWNER*/}MONTHLABEL MCM, {/*OWNER*/}SUPPLIER SR, {/*OWNER*/}MONTHLABEL MTD 
SQL1_16= WHERE S.IdSupplier=SR.Id
SQL1_17=   AND MTD.NoMonth=int(mid(str(Now()),4,2)) and MCM.NoMonth=int(S.DateSupply/100)-int(S.DateSupply/10000)*100
SQL1_18=   AND S.Id={/*PARAM3*/}




//////////////
// 2021.06.08 chercher dans LineCommandDate les lignes par date
DATA2=INFO_ORDERS
NAME2=INFOORDERS

SQL2=SELECT 
SQL2_1=   LS.IdProduct as C1,
SQL2_2=   iif (A.Drawing is NULL, ' ', A.Drawing) as DrawingC1,
SQL2_3=   A.Designation as DesigC2,
SQL2_4=   A.DesignationTech as DesiTechC2,
SQL2_5=   LS.Quantity as QTYC3,
SQL2_6=   Format(LS.PriceUnit,'0.0000') as PriceC4,
SQL2_7=   Format(LS.Quantity*LS.PriceUnit, '0.00') as AmountC5,
SQL2_8=   IIF (LS.DateDelivery is not NULL and LS.DateDelivery>'0', mid(str(LS.DateDelivery),2,4) +'.'+ mid(str(LS.DateDelivery),6,2) +'.'+ mid(str(LS.DateDelivery),8,2), ' ') as DateLivC6,
SQL2_9=   LS.Comments as CmtsC7,
SQL2_10=  LS.Comments1 as Cmts1C7
SQL2_11= FROM {/*OWNER*/}Supply_Product LS, {/*OWNER*/}PRODUCT A
SQL2_12= WHERE LS.IdProduct=A.ID
SQL2_13=   and LS.IdSupply={/*PARAM3*/}
SQL2_14= ORDER BY LS.IdProduct




DATA3=LINE_TOTAL
NAME3=LINETOTAL

SQL3=SELECT 
SQL3_1=   'TOTAL' as C1,
SQL3_2=   ' ' as DesigC2,
SQL3_3=   ' ' as DateLivC3,
SQL3_4=   ' ' as QTYC4,
SQL3_5=   Format(sum(int(LS.Quantity*LS.PriceUnit*100+0.5)/100),'0.00') as C5,
SQL3_6=   ' ' as C6,
SQL3_7=   'Weight :'+ Format(sum(LS.Quantity*A.Weight),'0.0') as C7,
SQL3_8=   LS.IdSupply as C8
SQL3_9=  FROM {/*OWNER*/}Supply_Product LS, {/*OWNER*/}PRODUCT A
SQL3_10= WHERE LS.IdProduct=A.ID and LS.IdSupply={/*PARAM3*/}
SQL3_11= GROUP BY LS.IdSupply



/////////////////////////
DATA4=INFO_TITLE
NAME4=InfoTitre


SQL4=SELECT DISTINCT
SQL4_1=   IIF (SR.Country is NULL or SR.Country='France' , 'Référence' , 'Reference') as C1, 
SQL4_2=   IIF (SR.Country is NULL or SR.Country='France' , 'Désignation','Designation') as C2, 
SQL4_3=   IIF (SR.Country is NULL or SR.Country='France' , 'Quantit ', 'Quantity') as C3, 
SQL4_4=   IIF (SR.Country is NULL or SR.Country='France' , 'Prix d''achat', 'Unit') as C4, 
SQL4_5=   IIF (SR.Country is NULL or SR.Country='France' , 'unitaire', 'Price') as C5,
SQL4_6=   S.Currency as C6, 
SQL4_7=   IIF (SR.Country is NULL or SR.Country='France' , 'Montant net', 'Net Amount') as C7, 
SQL4_8=   IIF (SR.Country is NULL or SR.Country='France' , 'H.T', 'Excluding Tax') as C8, 
SQL4_9=   IIF (SR.Country is NULL or SR.Country='France' , 'Date de', 'Planned') as C9, 
SQL4_10=  IIF (SR.Country is NULL or SR.Country='France' , 'livraison', 'Delivery') as C10, 
SQL4_11=  IIF (SR.Country is NULL or SR.Country='France' , 'prévue', 'Date') as C11, 
SQL4_12=  IIF (SR.Country is NULL or SR.Country='France' , 'Commentaire', 'Comments') as C12
SQL4_13= FROM {/*OWNER*/}SUPPLY S left join {/*OWNER*/}SUPPLIER SR on S.IdSupplier=SR.Id
SQL4_14= WHERE S.Id={/*PARAM3*/}



/////////////////////////
DATA5=INFO_DESTIN
NAME5=InfoDestination

SQL5=SELECT 
SQL5_1=   S.CustomsInfo as C_Comment,
SQL5_2=   '0' as NoL
SQL5_3= FROM {/*OWNER*/}SUPPLY S
SQL5_4= WHERE S.Id={/*PARAM3*/} AND S.CustomsInfo is not NULL and S.CustomsInfo>' '

SQL5_5= UNION ALL SELECT 
SQL5_6=   IIF (SR.Country='France' , 'R alisation par ', 'Realized by ') + S.ProductCondition as C_Comment,
SQL5_7=   '1' as NoL
SQL5_8= FROM {/*OWNER*/}SUPPLY S left join {/*OWNER*/}SUPPLIER SR on S.IdSupplier=SR.Id
SQL5_9= WHERE S.Id={/*PARAM3*/} AND S.ProductCondition is not NULL and S.ProductCondition>' '

SQL5_10=UNION ALL SELECT 
SQL5_11=   IIF (SR.Country='France' , 'Conditionnement : ', 'Packaging : ') + S.Packaging as C_Comment,
SQL5_12=   '2' as NoL
SQL5_13=FROM {/*OWNER*/}SUPPLY S left join {/*OWNER*/}SUPPLIER SR on S.IdSupplier=SR.Id
SQL5_14=WHERE S.Id={/*PARAM3*/} AND S.Packaging is not NULL and S.Packaging>' '

SQL5_15=UNION ALL SELECT 
SQL5_16=   IIF (SR.Country='France' , 'R gles de transport : ', 'Transport rules : ') + S.Incoterm as C_Comment,
SQL5_17=   '3' as NoL
SQL5_18=FROM {/*OWNER*/}SUPPLY S left join {/*OWNER*/}SUPPLIER SR on S.IdSupplier=SR.Id
SQL5_19=WHERE S.Id={/*PARAM3*/} AND S.Incoterm is not NULL and S.Incoterm>' '

SQL5_20=UNION ALL SELECT 
SQL5_21=   IIF (SR.Country='France' , 'Mode de r glement : ', 'Method of payment : ') + S.PayCondition as C_Comment,
SQL5_22=   '4' as NoL
SQL5_23=FROM {/*OWNER*/}SUPPLY S left join {/*OWNER*/}SUPPLIER SR on S.IdSupplier=SR.Id
SQL5_24=WHERE S.Id={/*PARAM3*/} AND S.PayCondition is not NULL and S.PayCondition>' '

SQL5_25=ORDER BY NoL




