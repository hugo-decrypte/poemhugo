SQL2_88=  iif(WeekDay(DateSerial(mid('{/*D1*/}',1,4), mid('{/*D1*/}',6,2), mid('{/*D1*/}',9,2))+d.ID-1,2)<6, 'Absence non déclarée',' ') as C14_Comments, format(DateSerial(mid('{/*D1*/}',1,4), mid('{/*D1*/}',6,2), mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD') as NumDate
