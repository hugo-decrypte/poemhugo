SQL2_5=   iif(rd.DrivingTime is NULL, ' ', format(rd.DrivingTime/60.0,'0.00')) as C4,
SQL2_6=   iif(rd.RouteTime is NULL, ' ', format(rd.RouteTime/60.0,'0.00')) as C5,
