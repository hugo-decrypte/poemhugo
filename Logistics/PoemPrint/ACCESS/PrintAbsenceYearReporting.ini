SQL3_7=   DatePart('w', DateSerial(mid('{/*PARAM4*/}',1,4), mid('{/*PARAM4*/}',5,2), 31)) as numDay,
SQL3_8=   r.Id as IDR
SQL3_9=  FROM {/*OWNER*/}Resource r
SQL3_10= WHERE r.Id in ({/*PARAM5*/}) 
SQL3_11=) dat 


