DATA1=INFO_PERIOD
NAME1=InfoPeriod

SQL1=SELECT distinct
SQL1_1=   '{/*STRDATE1*/}' as dateFirst,
SQL1_2=   '{/*STRDATE2*/}' as dateLast,
SQL1_3=   Now() as PrintTime, 
SQL1_4=   trim(ct.LastName) + '  ' + ct.FirstName as ResourceName
SQL1_5= FROM {/*OWNER*/}Contract ct
SQL1_6= WHERE ct.IdResource='{/*RESOURCEID*/}'


DATA2=INFO_DATECMD
NAME2=InfoDateCmd


SQL2=SELECT Title, 
SQL2_1=   sum(iif(NoMonth=1, V, 0)), sum(iif(NoMonth=2, V, 0)), sum(iif(NoMonth=3, V, 0)), 
SQL2_2=   sum(iif(NoMonth=4, V, 0)), sum(iif(NoMonth=5, V, 0)), sum(iif(NoMonth=6, V, 0)), 
SQL2_3=   sum(iif(NoMonth=7, V, 0)), sum(iif(NoMonth=8, V, 0)), sum(iif(NoMonth=9, V, 0)), 
SQL2_4=   sum(iif(NoMonth=10,V, 0)), sum(iif(NoMonth=11,V, 0)), sum(iif(NoMonth=12,V, 0)),
SQL2_5=   iif(Title='Taux absence', format(sum(V)/12,'0.0'), format(sum(V),'0.0')), Comments, ORD
SQL2_6= from (

SQL2_7= SELECT
SQL2_8=  ra.idTypeAbsence as Title,
SQL2_9=  sum(iif(ra.timeStart>'12:00' or ra.timeEnd<'14:00', 0.5,1)) as V,
SQL2_10=  int(m.ID) as NoMonth, 
SQL2_11=  (select ta.comments from {/*OWNER*/}TypeAbsence ta where ta.id=ra.idTypeAbsence) as Comments, 1 as ORD
SQL2_12= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_13= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 and d.category='ENUMERATION' and int(d.ID)>=1 and int(d.ID)<=31 and DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1 <= DateAdd('M',1,DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2)))-1
SQL2_14=  and ra.DateStart<=format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD') and format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD')<=ra.DateEnd
SQL2_15= group by ra.idTypeAbsence, ra.comments, int(m.ID)

SQL2_16= UNION ALL SELECT
SQL2_17=  'Total absence' as Title,
SQL2_18=  sum(iif(ra.timeStart>'12:00' or ra.timeEnd<'14:00', 0.5,1)) as V,
SQL2_19=  int(m.ID) as NoMonth, 
SQL2_20=  'Total absence' as Comments, 2 as ORD
SQL2_21= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_22= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 and d.category='ENUMERATION' and int(d.ID)>=1 and int(d.ID)<=31 and DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1 <= DateAdd('M',1,DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2)))-1
SQL2_23=  and ra.DateStart<=format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD') and format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD')<=ra.DateEnd
SQL2_24= group by int(m.ID)

SQL2_25= UNION ALL SELECT
SQL2_26=   'Jour travaillé' as Title,
SQL2_27=   count(1) as V,
SQL2_28=   int(m.id) as NoMonth, 
SQL2_29=  'JT' as Comments, 3 as ORD
SQL2_30= FROM {/*OWNER*/}Resource_Date rd, {/*OWNER*/}Alias m
SQL2_31= WHERE rd.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 
SQL2_32=   and mid('{/*D1*/}',1,5)+format(m.ID,'00')+'-01'<=rd.DateResource and rd.DateResource<=mid('{/*D1*/}',1,5)+format(m.ID,'00')+'-31' 
SQL2_33= GROUP BY m.id

SQL2_34= UNION ALL SELECT
SQL2_35=   'Total' as Title,
SQL2_36=   count(1) as V,
SQL2_37=   int(m.id) as NoMonth, 
SQL2_38=  'Total global' as Comments, 4 as ORD
SQL2_39= FROM {/*OWNER*/}Resource_Date rd, {/*OWNER*/}Alias m
SQL2_40= WHERE rd.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 
SQL2_41=   and mid('{/*D1*/}',1,5)+format(m.ID,'00')+'-01'<=rd.DateResource and rd.DateResource<=mid('{/*D1*/}',1,5)+format(m.ID,'00')+'-31' 
SQL2_42= GROUP BY m.id

SQL2_43= UNION ALL SELECT
SQL2_44=  'Total' as Title,
SQL2_45=  sum(iif(ra.timeStart>'12:00' or ra.timeEnd<'14:00', 0.5,1)) as V,
SQL2_46=  int(m.ID) as NoMonth, 
SQL2_47=  'Total global' as Comments, 4 as ORD
SQL2_48= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_49= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 and d.category='ENUMERATION' and int(d.ID)>=1 and int(d.ID)<=31 and DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1 <= DateAdd('M',1,DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2)))-1
SQL2_50=  and ra.DateStart<=format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD') and format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD')<=ra.DateEnd
SQL2_51= group by int(m.ID)

SQL2_52= UNION ALL SELECT
SQL2_53=  'Taux absence' as Title,
SQL2_54=  int(sum(iif(ra.timeStart>'12:00' or ra.timeEnd<'14:00', 0.5,1))*1000.0/(sum(iif(ra.timeStart>'12:00' or ra.timeEnd<'14:00', 0.5,1))+(select count(1) from {/*OWNER*/}Resource_Date ra where int(mid(ra.dateResource,6,2))=int(m.ID) and ra.worktime>0)))/10 as V,
SQL2_55=  int(m.ID) as NoMonth, 
SQL2_56=  'Taux absence / jours ouvrables' as Comments, 5 as ORD
SQL2_57= FROM {/*OWNER*/}Resource_Absence ra, {/*OWNER*/}Alias m, {/*OWNER*/}Alias d
SQL2_58= WHERE ra.IdResource in (select r.Id from {/*OWNER*/}Resource r where r.IdCategoryResource in ('Worker','OUVRIER')) and m.category='ENUMERATION' and int(m.ID)>=1 and int(m.ID)<=12 and d.category='ENUMERATION' and int(d.ID)>=1 and int(d.ID)<=31 and DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1 <= DateAdd('M',1,DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2)))-1
SQL2_59=  and ra.DateStart<=format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD') and format(DateSerial(mid('{/*D1*/}',1,4), m.ID, mid('{/*D1*/}',9,2))+d.ID-1,'YYYY-MM-DD')<=ra.DateEnd
SQL2_60= group by int(m.ID)

SQL2_61= ) group by Title,comments, ORD ORDER BY ORD,Title;



DATA3=LIST
NAME3=List

