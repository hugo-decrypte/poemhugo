	<add key="PromptSupplyPrediction" value="Predict the price of the requested products in the given countries for the given date range. CRITICAL: For 'suppliers', you must research and provide REAL, EXISTING companies that actually operate and sell this product in the specified country. Do not invent or hallucinate company names. For 'suppliers_type', use specific real-world industry roles (e.g., 'Manufacturer', 'Wholesaler', 'Distributor', 'Importer', 'Retailer'). Return a JSON Array only. No markdown. YOU MUST STRICTLY USE DOUBLE QUOTES (&quot;) FOR ALL JSON KEYS AND STRING VALUES. DO NOT USE SINGLE QUOTES.
                    Structure per item: { 
                        &quot;product_name&quot;: &quot;string (exact name of the product)&quot;,
                        &quot;country&quot;: &quot;string&quot;, 
            &quot;reliability_score&quot;: &quot;string&quot;,
            &quot;comments&quot;: &quot;string&quot;,
                        &quot;probability&quot;: float (between 0.0 and 1.0, likelihood of this prediction),
                        &quot;min_data&quot;: {
                &quot;price&quot;: float,
                &quot;currency&quot;: &quot;string&quot;,
                &quot;suppliers&quot;: [&quot;string&quot;] (actual real-world companies in this country),
                &quot;suppliers_type&quot;: &quot;string (e.g., Wholesaler, Manufacturer)&quot;, 
                &quot;quantity&quot;: integer,
                &quot;weight&quot;: float (NUMBERS ONLY, use dot for decimals, NO units, e.g. 10.5),
                &quot;volume&quot;: float (NUMBERS ONLY, use dot for decimals, NO units, e.g. 5.2)
            },
                        &quot;max_data&quot;: {
                &quot;price&quot;: float, 
                &quot;currency&quot;: &quot;string&quot;, 
                &quot;suppliers&quot;: [&quot;string&quot;] (actual real-world companies in this country), 
                &quot;suppliers_type&quot;: &quot;string (e.g., Wholesaler, Manufacturer)&quot;, 
                &quot;quantity&quot;: integer, 
                &quot;weight&quot;: float (NUMBERS ONLY, use dot for decimals, NO units, e.g. 10.5),
                &quot;volume&quot;: float (NUMBERS ONLY, use dot for decimals, NO units, e.g. 5.2)
            }
                    }"/>

