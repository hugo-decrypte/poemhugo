DATACOUNT=6

DATA1=INFO_FACTURE
NAME1=InfoFacture

SQL1=SELECT DISTINCT
SQL1_1=   IIF (CL.Country='France' , 'N° Avoir : '+ I.Id , 'Invoice no : '+ I.Id) as IdFacture,
SQL1_2=   IIF (CL.Country='France' , 'Date : ' + mid(str(I.DateInvoice),8,2) +' '+ MI.NameFR +' '+ mid(str(I.DateInvoice),2,4) ,
SQL1_3=    'Date : ' + MI.NameEN +' '+ mid(str(I.DateInvoice),8,2) +', '+  mid(str(I.DateInvoice),2,4) ) as DateFact,
SQL1_4=   IIF (CL.Country='France' , 'Date échéance : ' + mid(str(I.DatePayment),8,2) +' '+ MP.NameFR +' '+ mid(str(I.DatePayment),2,4) ,
SQL1_5=    'Payment Due : '  + MP.NameEN +' '+ mid(str(I.DatePayment),8,2) + ', '+ mid(str(I.DatePayment),2,4)) as DateMaxPayment,
SQL1_6=   IIF (CL.Country='France' , 'Adresse de livraison' ,  'Shipping adress') as TitleAdressDeliv, 
SQL1_7=   IIF(I.IdPointDeliv is not NULL and I.IdPointDeliv>' ', (select PT.NameClient FROM {/*OWNER*/}PointDelivery PT WHERE PT.IdClient=I.IdClient AND PT.IdPoint=I.IdPointDeliv),' ') as PtDeliv, 
SQL1_8=   IIF(I.IdPointDeliv is not NULL and I.IdPointDeliv>' ', (select PT.Address FROM {/*OWNER*/}PointDelivery PT WHERE PT.IdClient=I.IdClient AND PT.IdPoint=I.IdPointDeliv),' ') as AddresDeliv, 
SQL1_9=   IIF(I.IdPointDeliv is not NULL and I.IdPointDeliv>' ', (select PT.AddressSup FROM {/*OWNER*/}PointDelivery PT WHERE PT.IdClient=I.IdClient AND PT.IdPoint=I.IdPointDeliv),' ') as AddresSupDeliv, 
SQL1_10=  IIF(I.IdPointDeliv is not NULL and I.IdPointDeliv>' ', (select TRIM(PT.PostCode) + '   ' + PT.City FROM {/*OWNER*/}PointDelivery PT WHERE PT.IdClient=I.IdClient AND PT.IdPoint=I.IdPointDeliv),' ') as PostCodeCityDeliv, 
SQL1_11=   IIF (CL.Country='France' , ' ', CL.Country) as CountryDeliv,

SQL1_12=   IIF (CL.Country='France' , 'Adresse de facturation' , 'Billing adress') as TitleAdressFact, 
SQL1_13=   CL.Name as NameFact, 
SQL1_14=   IIF (CL.Country='France' , 'Service comptabilité ' , 'Accountant department') as Compta,
SQL1_15=   CL.Address as AddresFact, 
SQL1_16=   CL.AddressSup as AddresSupFact, 
SQL1_17=   TRIM(CL.PostCode) + '   ' + CL.City as PostCodeCityFact, 
SQL1_18=   IIF (CL.Country='France' , ' ' , CL.Country) as Country,
SQL1_19=   IIF (CL.Country='France' , 'N° TVA client : '+CL.TVA_No , 'Customer VAT no.: '+CL.TVA_No) as TVANo,

SQL1_20=   IIF (CL.Country='France' , 'Référence : '+I.Reference , 'Our reference: '+I.Reference) as ReferenceDeliv
SQL1_21= FROM {/*OWNER*/}Invoice I , {/*OWNER*/}Client CL, {/*OWNER*/}MonthLabel MI, {/*OWNER*/}MonthLabel MP
SQL1_22= WHERE CL.Id=I.IdClient 
SQL1_23=   AND MI.NoMonth=int(I.DateInvoice/100)-int(I.DateInvoice/10000)*100
SQL1_24=   AND MP.NoMonth=int(I.DatePayment/100)-int(I.DatePayment/10000)*100
SQL1_25=  AND I.Id={/*PARAM4*/}

//////////////
DATA2=LINE_FACT_COLHEAD
NAME2=LINEFACTCOLHEAD

SQL2=SELECT DISTINCT
SQL2_1=   IIF (CL.Country='France' , 'DESIGNATION' ,  'ITEM NO      DESCRIPTION') as Cmd,
SQL2_2=   IIF (CL.Country='France' , 'QUANTITE' ,  'QUANTITY') as Qty,
SQL2_3=   IIF (CL.Country='France' , 'PRIX HT' ,  'PRICE') as Price,
SQL2_4=   IIF (CL.Country='France' , 'MONTANT HT' ,  'AMOUNT') as Cost
SQL2_5=  FROM {/*OWNER*/}Invoice I, {/*OWNER*/}Client CL
SQL2_6=  WHERE CL.Id=I.IdClient
SQL2_7=   AND I.Id={/*PARAM4*/} 


DATA3=LINE_CMD
NAME3=LINECOMMAND

// 2024.12.20 LineInvoice => Invoice_Item
// 2024.12.20 Command => ClientOrder
// 2024.12.20 IdCommand => IdOrder
// 2024.12.20 ARTICLE => PRODUCT
// 2024.12.20 IdArticle => IdProduct
SQL3=SELECT DISTINCT
SQL3_1=   IIF (CL.Country='France' , 
SQL3_2=    ' Commande '+trim(CL.Name)  + ' : ' + CM.Id ,
SQL3_3=    ' Purchase Order : ' + CM.Id ) as Cmd,
SQL3_4=    LI.IdInvoice as INVID, LI.IdOrder as CMDID 
SQL3_5=  FROM {/*OWNER*/}Invoice_Item LI, {/*OWNER*/}ClientOrder CM, {/*OWNER*/}Client CL
SQL3_6=  WHERE CM.Id=LI.IdOrder 
SQL3_7=   AND CL.Id=CM.IdClient
SQL3_8=   AND LI.IdInvoice={/*PARAM4*/} 
SQL3_9= ORDER BY LI.IdOrder
SQL3_10=UNION ALL SELECT DISTINCT
SQL3_11=   IIF (CL.Country='France' , 
SQL3_12=    ' Divers :' ,
SQL3_13=    ' Diverse : ' ) as Cmd,
SQL3_14=    LI.IdInvoice as INVID, 'XXX' as CMDID 
SQL3_15=  FROM {/*OWNER*/}Invoice_Item LI, {/*OWNER*/}Invoice I, {/*OWNER*/}Client CL
SQL3_16=  WHERE I.Id=LI.IdInvoice
SQL3_17=   AND CL.Id=I.IdClient
SQL3_18=   AND LI.IdInvoice={/*PARAM4*/} 
SQL3_19=  AND (LI.IdOrder is NULL or LI.IdOrder<=' ')


DATA4=LIVRAISONINFO
NAME4=LIVRAISONINFO

SQL4=SELECT DISTINCT
SQL4_1=   '   ' + A.ID + '  ' + trim(A.Designation) as Product,
SQL4_2=   str(sum(LI.Quantity))+'  ' as "QTY",
SQL4_3=   IIF (LI.PriceUnit<0, '-', ' ') + str(int(abs(LI.PriceUnit)+0.005))+','+right(str(int((abs(LI.PriceUnit)+1)*100+0.5)),2) +' € ' as PriceUnit,
SQL4_4=   IIF (LI.PriceUnit<0, '-', ' ') + str(int(abs(LI.PriceUnit)*sum(LI.Quantity)+0.005))+','+right(str(int((abs(LI.PriceUnit)*sum(LI.Quantity)+1)*100+0.5)),2) +' € ' as PriceTotal, LI.IdProduct
SQL4_5=  FROM {/*OWNER*/}Invoice_Item LI, {/*OWNER*/}Product A
SQL4_6=  WHERE A.ID=LI.IdProduct
SQL4_7=   AND LI.IdInvoice={/*PARAM4*/} 
SQL4_8=   AND (LI.IdOrder='{/*CMDID*/}' or ((LI.IdOrder is NULL or LI.IdOrder<=' ' ) and '{/*CMDID*/}'='XXX'))
SQL4_9=  GROUP BY LI.IdProduct, A.ID, A.Designation, A.PriceUnit, LI.PriceUnit
SQL4_10= ORDER BY LI.IdProduct


DATA5=LIVRAISONTOTAL
NAME5=LIVRAISONTOTAL

SQL5=SELECT DISTINCT
SQL5_1=   str(sum(LI.Quantity))+'  ' as "QTY",
SQL5_2=   str(int(sum(LI.PriceUnit *LI.Quantity)))+','+right(str(int(sum(LI.PriceUnit*LI.Quantity)*100)),2) +' € ' as PriceHT,
SQL5_3=   str(int(I.VAT)) +' % ' as TVA,
SQL5_4=   str(int(sum(LI.PriceUnit *LI.Quantity)*I.VAT/100))+','+right(str(int(sum(LI.PriceUnit*LI.Quantity)*I.VAT)),2) +' € ' as PriceTVA,
SQL5_5=   str(int(sum(LI.PriceUnit *LI.Quantity)*(100+I.VAT)/100))+','+right(str(int(sum(LI.PriceUnit*LI.Quantity)*(100+I.VAT))),2) +' € ' as PriceTotal,
SQL5_6=   IIF (CL.Country='France' , 'TOTAL H.T.', 'TOTAL H.T.') as C6,
SQL5_7=   IIF (CL.Country='France' , 'TAUX T.V.A.', 'TAUX V.A.T.') as C7,
SQL5_8=   IIF (CL.Country='France' , 'TOTAL T.V.A.', 'TOTAL V.A.T.') as C8,
SQL5_9=   IIF (CL.Country='France' , 'PRIX A PAYER', 'TOTAL PRICE') as C9
SQL5_10= FROM {/*OWNER*/}Invoice_Item LI, {/*OWNER*/}Invoice I, {/*OWNER*/}CLIENT CL
SQL5_11= WHERE LI.IdInvoice=I.Id AND CL.Id=I.IdClient
SQL5_12=    AND LI.IdInvoice={/*PARAM4*/} 
SQL5_13=  GROUP BY I.VAT , CL.Country

DATA6=REGLE
NAME6=REGLE

//INSTR11=Text(10 260 2100 300, " Règlement de facture à 30 jours date de facture, fin du mois", FONT4, LEFT|VCENTER, COLOR1)
SQL6=SELECT DISTINCT
SQL6_1=   IIF (CL.Country='France' , ' Règlement de facture à 30 jours date de facture, fin du mois', 'Terms of sale: 30 days, date of invoice') as C1,
SQL6_2=   IIF (CL.Country='France' , ' ', 'Exonération de T.V.A. Article 262 TER-l du CGI') as C2,
SQL6_3=   IIF (CL.Country='France' , 'Règlement de facture : ', 'Terms of sale: ') as C3,
SQL6_4=   I.Comments as C4
SQL6_5= FROM {/*OWNER*/}Invoice I, {/*OWNER*/}CLIENT CL
SQL6_6= WHERE CL.Id=I.IdClient
SQL6_7=    AND I.Id={/*PARAM4*/} 

