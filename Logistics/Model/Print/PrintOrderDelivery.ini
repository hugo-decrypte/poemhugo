// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS


SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,

SQL1_11=  concat('N° TVA Intracommunautaire : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_12=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'Type Société : ________ au capital de ______ €' END) as TypeCompagny,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE 'SIRET :' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE 'RCS :' END) as RCS,
SQL1_15=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE 'APE :' END) as APE,

SQL1_16=  concat('SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END), ' - RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END), ' - APE : ', (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) ) as InfoRegistre,
SQL1_17=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END) , ' - BIC : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END), '  ', (CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END)) as BankInfo,
SQL1_18=  (CASE WHEN CL.Country='France' THEN concat('Imprimée le ', date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) ELSE concat('Printed ', date_format(Now(), '%m %d, %Y,  %H:%i:%s')) END) as PrintDate,

SQL1_19=  (CASE WHEN CL.Country='France' THEN 'Commande N° : ' ELSE 'Order no : ' END) as TitleOrder,
SQL1_20=  O.Id as IdOrder,
SQL1_21=  (CASE WHEN CL.Country='France' THEN 'Date de Livraison : ' ELSE 'Delivery date : ' END) as TitleDeliveryDate,
SQL1_22=  date_format(O.DateDelivery,'%d/%m/%Y') as DeliveryDate,
SQL1_23=  (CASE WHEN CL.Country='France' THEN 'Référence : ' ELSE 'Reference : ' END) as TitleReference,
SQL1_24=  O.Reference as Reference
SQL1_25= FROM (({/*OWNER*/}CLIENTORDER O left join {/*OWNER*/}AGENCY AG on AG.ID=O.IdAgency)
SQL1_26=  left join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient)
SQL1_27=  left join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL1_28= WHERE  O.Id='{/*CODEORDER*/}'

// BankInfo in FOOTER


//////////////
DATA2=SEL_OBJ
NAME2=Objet

SQL2=SELECT 
SQL2_1=   O.Id as CODEORDER, O.IdClub as CODECLUB
SQL2_2=  FROM {/*OWNER*/}CLIENTORDER O 
SQL2_3= WHERE ID in ({/*PARAM4*/})


// ADDRESS DELIVERY
DATA3=ADDRESS_DELIV
NAME3=AddressDeliv

SQL3=SELECT DISTINCT
SQL3_1=   (CASE WHEN CL.Country='France' THEN 'Adresse de livraison' ELSE 'Shipping adress' END) as TitleAdressDeliv, 
SQL3_2=   PT.NameClient as PtDeliv, 
SQL3_3=   PT.Address as AddresDeliv, 
SQL3_4=   PT.AddressSup as AddresSupDeliv, 
SQL3_5=   concat(TRIM(PT.PostCode) , '   ' , PT.City) as PostCodeCityDeliv, 
SQL3_6=   (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as CountryDeliv,
SQL3_7=   O.Id as IdDelivery,
SQL3_8=   date_format(O.DateDelivery,'%d/%m/%Y') as DateDelivery ,
SQL3_9=   'STOCK' as Packing,
SQL3_10=  'STOCK' as Sender,
SQL3_11=  'STOCK' as ShipNo
SQL3_12= FROM {/*OWNER*/}CLIENTORDER O , {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT
SQL3_13= WHERE CL.Id=O.IdClient 
SQL3_14=  AND PT.IdClient=O.IdClient AND PT.IdPoint=O.IdPointDelivery
SQL3_15= AND O.Id='{/*CODEORDER*/}'



//////////////
DATA4=INFO_ORDERS
NAME4=INFOORDERS

SQL4=SELECT DISTINCT
SQL4_1=   'STOCK' as C1,
SQL4_2=   ' ' as C2,
SQL4_3=   ' ' as C3,
SQL4_4=   ' ' as C4,
SQL4_5=   OP.IdOrder as "CMD5",
SQL4_6=   OP.Quantity as "QTY6",
SQL4_7=   ' ' as C7,
SQL4_8=   ' ' as C8,
SQL4_9=   ' ' as C9,
SQL4_10=   ' ' as C10,
SQL4_11=   ' ' as C11
SQL4_12= FROM {/*OWNER*/}ORDER_PRODUCT OP
SQL4_13= WHERE OP.IdOrder='{/*CODEORDER*/}'
SQL4_14=   AND OP.NoPallet={/*PALETTE*/} AND OP.IdProduct='{/*PRODUCT*/}' 
SQL4_15=   AND OP.IdOrder>= (select min(OP1.IdOrder) from {/*OWNER*/}ORDER_PRODUCT OP1
SQL4_16=      WHERE OP1.IdOrder='{/*CODEORDER*/}' 
SQL4_17=       AND OP1.NoPallet={/*PALETTE*/} AND OP1.IdProduct='{/*PRODUCT*/}'
SQL4_18=    )
SQL4_19= ORDER BY OP.IdOrder

// OP.IdOrder={/*PARAM3*/} 
// OP1.IdOrder={/*PARAM3*/}

// DETAIL DELIVERY
DATA5=INFO_DELIVERY
NAME5=InfoDelivery

SQL5=SELECT 
SQL5_1=   (CASE WHEN SamePal+CmdSup=0 THEN PACKING ELSE ' ' END) as C1, 
SQL5_2=   (CASE WHEN SamePal+CmdSup=0 THEN PALETTE ELSE ' ' END) as C2, 
SQL5_3=   (CASE WHEN CmdSup=0 THEN PRODUCT ELSE ' ' END) as C3, 
SQL5_4=   (CASE WHEN CmdSup=0 THEN DescriArticle ELSE ' ' END) as C4,
SQL5_5=   Cmd,
SQL5_6=   QTY,
SQL5_7=   NW as C7, 
SQL5_8=  (CASE WHEN SamePal+CmdSup=0 THEN GW ELSE ' ' END) as C8,
SQL5_9=  (CASE WHEN SamePal+CmdSup=0 THEN L ELSE ' ' END) as C9, 
SQL5_10=  (CASE WHEN SamePal+CmdSup=0 THEN W ELSE ' ' END) as C10, 
SQL5_11=  (CASE WHEN SamePal+CmdSup=0 THEN H ELSE ' ' END) as C11, V as C12, QtyPackage as C13, NbPackage as C14
SQL5_12= FROM (SELECT
SQL5_13=   'STOCK' as PACKING, 
SQL5_14=   OP.IdOrder as IdDelivery, 
SQL5_15=   (CASE WHEN OP.NoPallet is NULL THEN 0 ELSE OP.NoPallet END) as PALETTE, 
SQL5_16=   PRD.ID as PARENT, PRD.ID as PRODUCT,
SQL5_17=   PRD.Designation as DescriArticle,
SQL5_18=   OP.IdOrder as Cmd,
SQL5_19=   format(OP.Quantity,0) as QTY,
SQL5_20=   format(PRD.QuantityPackaging,0) as QtyPackage,
SQL5_21=   format((CASE WHEN PRD.QuantityPackaging is not NULL and PRD.QuantityPackaging>0 THEN OP.Quantity/PRD.QuantityPackaging ELSE 1 END),0) as NbPackage,
SQL5_22=   format(PRD.Weight*OP.Quantity,2) as NW, 
SQL5_23=   (CASE WHEN P.WeightGlobal is not NULL and P.WeightGlobal>0 THEN format(P.WeightGlobal,1) WHEN O.WeightPallet is NULL THEN 'PN + 30' ELSE concat('PN + ', format(O.WeightPallet,1)) END) as GW,
SQL5_24=   round(P.Length) as L, 
SQL5_25=   round(P.Width) as W, 
SQL5_26=   round(P.Height) as H,
SQL5_27=   format(PRD.Volume*OP.Quantity, 2) as V, 
SQL5_28=   0 as CmdSup,
SQL5_29=  (CASE WHEN exists (select 1 from {/*OWNER*/}ORDER_PRODUCT OP1 
SQL5_30=        where OP1.IdOrder=OP.IdOrder AND OP1.NoPallet=OP.NoPallet AND OP1.IdProduct<OP.IdProduct)
SQL5_31=    THEN 1 ELSE 0 END)  as SamePal
SQL5_32= FROM (({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}ORDER_PRODUCT OP on O.Id=OP.IdOrder)
SQL5_33=   inner join {/*OWNER*/}PRODUCT PRD on PRD.ID=OP.IdProduct)
SQL5_34=   left join {/*OWNER*/}PALLET P on P.IdPacking=concat('C',OP.IdOrder) and P.NoPallet=OP.NoPallet
SQL5_35= WHERE PRD.TypeProduct<>'F'
SQL5_36=   AND OP.IdOrder='{/*CODEORDER*/}'
SQL5_37= UNION ALL 

SQL5_38= SELECT
SQL5_39=   'STOCK' as PACKING, 
SQL5_40=   OP.IdOrder as IdDelivery, 
SQL5_41=   (CASE WHEN OP.NoPallet is NULL THEN 0 ELSE OP.NoPallet END) as PALETTE, 
SQL5_42=   OP.IdProduct as PARENT, concat(' -> ',PRD.ID) as PRODUCT, 
SQL5_43=   PRD.Designation as DescriArticle,
SQL5_44=   OP.IdOrder as Cmd,
SQL5_45=   format(OP.Quantity,0) as QTY,
SQL5_46=   format(PRD.QuantityPackaging,0) as QtyPackage,
SQL5_47=   format((CASE WHEN PRD.QuantityPackaging is not NULL and PRD.QuantityPackaging>0 THEN OP.Quantity/PRD.QuantityPackaging ELSE 1 END),0) as NbPackage,
SQL5_48=   format(PRD.Weight*OP.Quantity,2) as NW, 
SQL5_49=   (CASE WHEN P.WeightGlobal is not NULL and P.WeightGlobal>0 THEN format(P.WeightGlobal,1) WHEN O.WeightPallet is NULL THEN 'PN + 30' ELSE concat('PN + ', format(O.WeightPallet,1)) END) as GW,
SQL5_50=   round(P.Length) as L, 
SQL5_51=   round(P.Width) as W, 
SQL5_52=   round(P.Height) as H,
SQL5_53=   format(PRD.Volume*OP.Quantity,2) as V, 
SQL5_54=   0 as CmdSup,
SQL5_55=  (CASE WHEN exists (select 1 from {/*OWNER*/}ORDER_PRODUCT OP1 
SQL5_56=        where OP1.IdOrder=OP.IdOrder AND OP1.NoPallet=OP.NoPallet AND OP1.IdProduct<OP.IdProduct) 
SQL5_57=    THEN 1 ELSE 0 END)  as SamePal
SQL5_58= FROM ((({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}ORDER_PRODUCT OP on O.Id=OP.IdOrder)
SQL5_59=   inner join {/*OWNER*/}PRODUCT_COMPONENT PC on PC.IdProduct=OP.IdProduct)
SQL5_60=   inner join {/*OWNER*/}PRODUCT PRD on PRD.ID=PC.IdSubProduct)
SQL5_61=   left join {/*OWNER*/}PALLET P on P.IdPacking='C'+OP.IdOrder and P.NoPallet=OP.NoPallet
SQL5_62= WHERE PRD.TypeProduct<>'F'
SQL5_63=   AND OP.IdOrder='{/*CODEORDER*/}'
SQL5_64= ) t

SQL5_65= ORDER BY IdDelivery, PARENT, PRODUCT


// TOTAL DELIVERY
DATA6=LINE_TOTAL
NAME6=LINETOTAL

SQL6=SELECT DISTINCT
SQL6_1=   'TOTAL' as Col1, 
SQL6_2=   sum(QTY_C9) as Col2,
SQL6_3=   format(sum(C10),2) as Col3,
SQL6_4=   format(sum(C11),2) as Col4,
SQL6_5=   format(sum(C12),2) as Col5,
SQL6_6=   format(sum(C13),0) as Col6,
SQL6_7=   format(sum(C14),0) as Col7
SQL6_8=  FROM (SELECT 'STOCK', OP.NoPallet,
SQL6_9=   sum(OP.Quantity) as "QTY_C9",
SQL6_10=  sum(PRD.Weight*OP.Quantity) as C10, 
SQL6_11=  sum(PRD.Volume*OP.Quantity) as C11,
SQL6_12=  sum(PRD.Weight*OP.Quantity)+ (CASE WHEN O.WeightPallet is NULL THEN 30 ELSE min(O.WeightPallet) END) as C12,
SQL6_13=  sum(PRD.QuantityPackaging) as C13,
SQL6_14=  sum((CASE WHEN PRD.QuantityPackaging is not NULL and PRD.QuantityPackaging>0 THEN OP.Quantity/PRD.QuantityPackaging ELSE 1 END)) as C14
SQL6_15= FROM (({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}ORDER_PRODUCT OP on O.Id=OP.IdOrder)
SQL6_16=  inner join {/*OWNER*/}PRODUCT PRD on PRD.ID=OP.IdProduct) 
SQL6_17=  LEFT JOIN {/*OWNER*/}PALLET P on P.NoPallet=OP.NoPallet
SQL6_18=WHERE PRD.TypeProduct<>'F'
SQL6_19=   AND O.Id='{/*CODEORDER*/}'
SQL6_20=GROUP BY OP.NoPallet, P.WeightGlobal, O.WeightPallet) t


