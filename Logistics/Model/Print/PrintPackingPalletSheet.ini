DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,
SQL1_11=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'S.A.R.L au capital de ____ €' END) as Capital,
SQL1_12=  concat(' RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END) , ' - SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END)) as InfoRegistre,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE ' ' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE ' ' END) as RCS,
SQL1_15=  concat('N° TVA Intracommunautaire/ V.A.T. No : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_16=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) as APE,
SQL1_17=  concat('Imprimée le ' , date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) as PrintDate_C16 
SQL1_18= FROM {/*OWNER*/}USER u left join {/*OWNER*/}AGENCY AG on AG.ID=u.IdAgency
SQL1_19= WHERE u.Id='{/*PARAM5*/}'


DATA2=OBJ_DATA
NAME2=OBJ_DATA

SQL2=SELECT DISTINCT
SQL2_1=   PL.IdPacking as CODEPACKING, 
SQL2_2=   PL.NoPallet as NOPALLET,
SQL2_3=   PK.NbPallet as Nb
SQL2_4= FROM {/*OWNER*/}PACKING PK, {/*OWNER*/}PALLET PL
SQL2_5= WHERE PK.Id=PL.IdPacking and PL.NoPallet is not NULL
SQL2_6=    AND IdPacking in ({/*PARAM4*/})
SQL2_7= order by PL.NoPallet



DATA3=INFO_DELIVERY
NAME3=InfoDelivery

SQL3=SELECT 
SQL3_1=   NoLot, DateExpiration, PRODUCT, 
SQL3_2=   DescriArticle,
SQL3_3=   Cmd,
SQL3_4=   format(QTY,0),
SQL3_5=   format(NW,1)
SQL3_6= FROM (SELECT
SQL3_7=   P.ID as PRODUCT, 
SQL3_8=   P.Designation as DescriArticle,
SQL3_9=   ' ' as Cmd,
SQL3_10=   sum(LP.Quantity) as QTY,
SQL3_11=   (CASE WHEN LP.NoLot is not NULL and LP.NoLot>' ' THEN LP.NoLot WHEN LP.DateCreate is not NULL and LP.DateCreate >0 THEN date_format(LP.DateCreate,'%Y-%m-%d') ELSE ' ' END) as NoLot,
SQL3_12=   (CASE WHEN LP.DateExpiration is not NULL and LP.DateExpiration>0 THEN date_format(LP.DateExpiration,'%Y-%m-%d') ELSE ' ' END) as DateExpiration,
SQL3_13=   P.Weight*sum(LP.Quantity) as NW 
SQL3_14= FROM (({/*OWNER*/}PACKING PK
SQL3_15=  inner join {/*OWNER*/}PALLET PL on PK.Id=PL.IdPacking)
SQL3_16=  inner join {/*OWNER*/}PALLET_PRODUCT LP on LP.IdPacking=PL.IdPacking and LP.NoPallet=PL.NoPallet)
SQL3_17=  inner join {/*OWNER*/}PRODUCT P on P.ID=LP.IdProduct
SQL3_18= WHERE P.TypeProduct<>'F' 
SQL3_19=   AND PK.Id='{/*CODEPACKING*/}'
SQL3_20=   and PL.NoPallet={/*NOPALLET*/} 
SQL3_21= Group BY P.ID, P.Designation, P.Weight, LP.IdProduct,LP.NoLot, LP.DateCreate, LP.DateExpiration
SQL3_22= ORDER BY LP.IdProduct) t


//////////////
DATA4=INFO_ORDERS
NAME4=INFOORDERS

SQL4=SELECT DISTINCT
SQL4_1=   LD.IdPacking as C1,
SQL4_2=   ' ' as C2,
SQL4_3=   ' ' as C3,
SQL4_4=   ' ' as C4,
SQL4_5=   LD.IdOrder as "CMD5",
SQL4_6=   LD.Quantity as "QTY6",
SQL4_7=   ' ' as C7,
SQL4_8=   ' ' as C8,
SQL4_9=   ' ' as C9,
SQL4_10=   ' ' as C10,
SQL4_11=   ' ' as C11
SQL4_12= FROM {/*OWNER*/}PALLET_PRODUCT LP
SQL4_13= WHERE LP.IdPacking='{/*PACKING*/}'
SQL4_14=   AND LP.NoPallet={/*PALETTE*/} AND LP.IdProduct='{/*PRODUCT*/}' 


DATA5=LINE_TOTAL
NAME5=LINETOTAL

SQL5=SELECT DISTINCT 'TOTAL' as Col6, sum(QTY_C9) as Col9, round(sum(C10)) as Col10, round(sum(C11)) as Col11
SQL5_1=   FROM (SELECT PL.IdPacking, PL.NoPallet,
SQL5_2=   sum(LP.Quantity) as "QTY_C9",
SQL5_3=   sum(P.Weight*LP.Quantity) as C10, 
SQL5_4=   sum(P.Weight*LP.Quantity)+ (CASE WHEN PL.WeightPallet is NULL THEN 30 ELSE PL.WeightPallet END) as C11
SQL5_5= FROM (({/*OWNER*/}PALLET PL inner join {/*OWNER*/}PALLET_PRODUCT LP on PL.IdPacking=LP.IdPacking and PL.NoPallet=LP.NoPallet)
SQL5_6=   inner join {/*OWNER*/}PRODUCT P on P.ID=LP.IdProduct) 
SQL5_7= WHERE P.TypeProduct<>'F' 
SQL5_8=   AND PL.IdPacking='{/*CODEPACKING*/}' and PL.NoPallet={/*NOPALLET*/}
SQL5_9= GROUP BY PL.IdPacking, PL.NoPallet, PL.WeightGlobal,PL.WeightNet) t


DATA6=ADDRESS_DELIV
NAME6=AddressDeliv

SQL6=SELECT DISTINCT
SQL6_1=   (CASE WHEN PK.Country='France' THEN 'Adresse de livraison' ELSE 'Shipping adress' END) as TitleAdressDeliv, 
SQL6_2=   PK.IdSender as PtDeliv, 
SQL6_3=   PK.ReceivedBy as AddresDeliv, 
SQL6_4=   PK.ShipmentPort as AddresSupDeliv, 
SQL6_5=   PK.ShipNo as PostCodeCityDeliv, 
SQL6_6=   (CASE WHEN PK.Country='France' THEN 'FRANCE ' ELSE PK.Country END) as CountryDeliv,
SQL6_7=   PK.Id as IdDelivery,
SQL6_8=   concat('{/*NOPALLET*/}', ' (', (select count(1) from {/*OWNER*/}PALLET PL0 where PL0.IdPacking=PK.Id and PL0.NoPallet<={/*NOPALLET*/} ) , ' / ' , (select format(count(1), 0) from {/*OWNER*/}PALLET PL0 where PL0.IdPacking=PK.Id) , ')') as NoP,
SQL6_9=   date_format(PL.DatePreparation,'%d/%m/%Y') as DateModif ,
SQL6_10=  concat(format(PL.Length,0),' x ',format(PL.Width,0),' x ',format(PL.Height,0),' cm')  as Dimension,
SQL6_11=  concat(format(PL.WeightNet,0),' KG') as WN, concat(format((CASE WHEN PL.WeightGlobal is NULL or PL.WeightGlobal<PL.WeightNet THEN PL.WeightNet+30 ELSE PL.WeightGlobal END),0),' KG')  as WG,
SQL6_12=  date_format(PK.DateDelivery,'%d/%m/%Y') as DateDeliv 
SQL6_13= FROM {/*OWNER*/}PACKING PK , {/*OWNER*/}PALLET PL
SQL6_14= WHERE PK.Id=PL.IdPacking 
SQL6_15=  AND PK.Id='{/*CODEPACKING*/}'
SQL6_16=  AND PL.NoPallet={/*NOPALLET*/}





