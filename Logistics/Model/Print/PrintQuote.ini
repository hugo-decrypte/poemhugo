DATA1=MY_ADRESS
NAME1=MYADRESS


SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,

SQL1_11=  concat('TVA Intracom : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_12=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'Type Société : ________ au capital de ______ €' END) as TypeCompagny,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE 'SIRET :' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE 'RCS :' END) as RCS,
SQL1_15=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE 'APE :' END) as APE,
SQL1_16=  concat('SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END),
SQL1_17=  ' - RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END),
SQL1_18=  ' - APE : ', (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) ) as InfoRegistre,
SQL1_19=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END) , ' - BIC : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END), '  ', (CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END)) as BankInfo,
SQL1_20=  (CASE WHEN CL.Country='France' THEN concat('Imprimée le ', date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) ELSE concat('Printed ', date_format(Now(), '%m %d, %Y,  %H:%i:%s')) END) as PrintDate,

SQL1_21=  concat((CASE WHEN CL.Country='France' THEN 'Devis N° : ' ELSE 'Quote no : ' END) , Q.Id ) as IdQuote
SQL1_22= FROM (({/*OWNER*/}QUOTE Q left join {/*OWNER*/}AGENCY AG on AG.ID=Q.IdAgency)
SQL1_23=  left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient)
SQL1_24=  left join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL1_25= WHERE  Q.Id={/*PARAM4*/}

// BankInfo in FOOTER


// client info used in INSTR3

DATA2=INFO_QUOTE
NAME2=InfoDevis

SQL2=SELECT DISTINCT
SQL2_1=   concat((CASE WHEN CL.Country='France' THEN 'N° Devis : ' ELSE 'Quote no : ' END) , Q.Id) as IdFacture,
SQL2_2=   (CASE WHEN CL.Country='France' THEN concat('Date Devis : ' , date_format(Q.DateQuote,'%d '), MI.NameFR , ' ' , date_format(Q.DateQuote, '%Y') )
SQL2_3=     ELSE concat('Date quote : ' , MI.NameEN ,' ', date_format(Q.DateQuote,'%d, %Y')) END) as DateFact,
SQL2_4=   (CASE WHEN CL.Country='France' THEN concat('Devis valable jusqu''au : ' , date_format(Q.DateValid, '%d ') , MP.NameFR ,' ', date_format(Q.DateValid, '%Y'))
SQL2_5=     ELSE concat('Quote valid until : '  , MP.NameEN ,' ', date_format(Q.DateValid, '%d, %Y')) END) as DateMaxPayment,
SQL2_6=   (CASE WHEN CL.Country='France' THEN 'Adresse de livraison' ELSE 'Shipping adress' END) as TitleAdressDeliv, 
SQL2_7=   PT.NameClient as PtDeliv, 

SQL2_8=   PT.Address as AddresDeliv, 
SQL2_9=   PT.AddressSup as AddresSupDeliv, 
SQL2_10=  concat(TRIM(PT.PostCode) , '   ' , PT.City) as PostCodeCityDeliv, 
SQL2_11=  (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as CountryDeliv,

SQL2_12=   (CASE WHEN CL.Country='France' THEN 'Adresse de facturation' ELSE 'Billing adress' END) as TitleAdressFact, 
SQL2_13=   CL.Name as NameFact, 

SQL2_14=   (CASE WHEN CL.Country='France' THEN 'Service comptabilité ' ELSE 'Accountant department' END) as Compta,
SQL2_15=   CL.Address as AddresFact, 
SQL2_16=   CL.AddressSup as AddresSupFact, 
SQL2_17=   concat(TRIM(CL.PostCode) , '   ' , CL.City) as PostCodeCityFact, 
SQL2_18=   (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as Country,

SQL2_19=  concat((CASE WHEN CL.Country='France' THEN 'Référence : ' ELSE 'Our reference: ' END) , Q.Reference) as ReferenceDeliv,
SQL2_20=  concat((CASE WHEN CL.Country='France' THEN 'N° TVA : '   ELSE 'Customer VAT no.: ' END) , (CASE WHEN CL.codeVAT is NULL THEN ' ' ELSE CL.codeVAT END)) as TVANo,

SQL2_21=  (CASE WHEN CL.Country='France' THEN ' Règlement de facture à 30 jours date de facture, fin du mois' ELSE 'Terms of sale: 30 days, date of invoice' END) as REGL_C19,
SQL2_22=  (CASE WHEN CL.Country='France' THEN ' ' ELSE 'Exonération de T.V.A. Article 262 TER-l du CGI' END) as REGL_C20,
SQL2_23=  (CASE WHEN CL.Country='France' THEN 'Règlement de facture : ' ELSE 'Terms of sale: ' END) as REGL_C21,
SQL2_24=  Q.Comments as REGL_C22,
SQL2_25=  concat((CASE WHEN CL.Country='France' THEN  'Suivi par : ' ELSE 'Followed by: ' END) , (CASE WHEN Q.FollowedBy is NULL THEN ' ' ELSE Q.FollowedBy END)) as FollowedBy,

SQL2_26=  (CASE WHEN CL.Country='France' THEN 'Devis' ELSE 'Quote' END) as TITLE

SQL2_27=FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT, {/*OWNER*/}MONTHLABEL MI, {/*OWNER*/}MONTHLABEL MP
SQL2_28=WHERE CL.Id=Q.IdClient 
SQL2_29=  AND PT.IdClient=Q.IdClient AND PT.IdPoint=Q.IdPointDelivery
SQL2_30=  AND MI.NoMonth=round(Q.DateQuote/100)-round(Q.DateQuote/10000)*100
SQL2_31=  AND MP.NoMonth=round(Q.DateValid/100)-round(Q.DateValid/10000)*100
SQL2_32=  AND Q.Id={/*PARAM4*/}


//////////////
DATA3=LINE_FACT_COLHEAD
NAME3=LINEFACTCOLHEAD

SQL3=SELECT DISTINCT
SQL3_1=   (CASE WHEN CL.Country='France' THEN 'Désignation' ELSE 'Description' END) as Design,
SQL3_2=   (CASE WHEN CL.Country='France' THEN 'Quantité' ELSE 'Quantity' END) as Qty,
SQL3_3=   (CASE WHEN CL.Country='France' THEN 'Prix' ELSE 'Price' END) as Price,
SQL3_4=   (CASE WHEN CL.Country='France' THEN 'Remise' ELSE 'Discount' END) as Remise,
SQL3_5=   (CASE WHEN CL.Country='France' THEN 'Montant HT' ELSE 'Amount' END) as Amount,
SQL3_6=   (CASE WHEN CL.Country='France' THEN 'TVA' ELSE 'VAT' END) as TVA
SQL3_7= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL3_8= WHERE CL.Id=Q.IdClient
SQL3_9=  AND Q.Id={/*PARAM4*/} 


DATA4=LINEQUOTE
NAME4=LineQuote

SQL4=SELECT 
SQL4_1=   P.Designation as Design,
SQL4_2=   format(LQ.Quantity, 0) as "QTY",
SQL4_3=   concat(Format(LQ.PriceUnit,2) , ' ' , (CASE WHEN Q.Currency is NULL or Q.Currency<=' ' THEN '€' ELSE trim(Q.Currency) END)) as PriceUnit,
SQL4_4=   (CASE WHEN LQ.Discount<>0 THEN concat(format(LQ.Discount,1),'% ') ELSE ' ' END) as Dis,
SQL4_5=   concat((CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN format(LQ.PriceUnit*(LQ.Quantity*(100.0-LQ.Discount)/100.0),2) ELSE format(LQ.PriceUnit*(LQ.Quantity),2) END) , ' € ') as PriceTotal,
SQL4_6=   LQ.IdVAT,
SQL4_7=   P.ID as Product, P.TypeProduct, P.Family
SQL4_8=FROM {/*OWNER*/}QUOTE_ITEM LQ, {/*OWNER*/}QUOTE Q, {/*OWNER*/}PRODUCT P
SQL4_9=WHERE P.ID=LQ.IdProduct AND LQ.IdQuote=Q.Id and LQ.IdQuote={/*PARAM4*/} 
SQL4_10=ORDER BY P.TypeProduct desc, P.Family, P.Designation, P.Id


// line total 
DATA5=TOTALQUOTE
NAME5=TotalQuote

SQL5=SELECT 
SQL5_1=   'TOTAL' as Design,
SQL5_2=   format(sum(LQ.Quantity), 0) as "QTY",
SQL5_3=   ' ' as PriceUnit,
SQL5_4=   ' ' as Discount,
SQL5_5=   concat(format(sum( (LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END)))/100.0), 2) , ' € ') as PriceTotal,
SQL5_6=   ' ' as IdVAT
SQL5_7=FROM {/*OWNER*/}QUOTE_ITEM LQ, {/*OWNER*/}QUOTE Q, {/*OWNER*/}PRODUCT P
SQL5_8=WHERE P.ID=LQ.IdProduct AND LQ.IdQuote=Q.Id and LQ.IdQuote={/*PARAM4*/} 


// table total 
DATA6=TOTAL
NAME6=TOTAL

SQL6=SELECT DISTINCT
SQL6_1=   'EURO(€)' as "QTY",
SQL6_2=   concat(format(Q.AmountHT*(CASE WHEN Q.Discount is NULL THEN 100 ELSE (100-Q.Discount) END)/100.0, 2) , ' € ') as PriceHT,
SQL6_3=   concat((CASE WHEN tabTVA.MinTVA=tabTVA.MaxTVA THEN format(tabTVA.MaxTVA,2) ELSE 'xx' END), ' %') as TVA,
SQL6_4=   concat(format(tabTVA.TotalTVA*(100.0-(CASE WHEN Q.Discount is not NULL and Q.Discount<>0 THEN Q.Discount ELSE 0.00 END))/100.0, 2) , ' € ') as PriceTVA,
SQL6_5=   concat(format((tabTVA.TotalTVA+Q.AmountHT)*(100.0-(CASE WHEN Q.Discount is not NULL and Q.Discount<>0 THEN Q.Discount ELSE 0.00 END))/100.0, 2), ' € ') as PriceTotal,
SQL6_6=   (CASE WHEN CL.Country='France' THEN 'TOTAL HT'    ELSE 'TOTAL H.T.' END) as C6, 
SQL6_7=   (CASE WHEN CL.Country='France' THEN 'TAUX T.V.A.' ELSE 'TAUX V.A.T.' END) as C7,
SQL6_8=   (CASE WHEN CL.Country='France' THEN 'TOTAL TVA'   ELSE 'TOTAL V.A.T.' END) as C8,
SQL6_9=   (CASE WHEN CL.Country='France' THEN 'TOTAL TTC'   ELSE 'TOTAL PRICE' END) as C9, 
SQL6_10=  (CASE WHEN CL.Country='France' THEN 'NET A PAYER' ELSE 'NET TO PAY' END) as C10

SQL6_11= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL,
SQL6_12=   (SELECT DISTINCT 
SQL6_13=      LQ.IdQuote as IdLD, min(T.VAT) as MinTVA, max(T.VAT) as MaxTVA,
SQL6_14=      sum(LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END))/100.0*T.VAT/100.0) as TotalTVA 
SQL6_15=    FROM {/*OWNER*/}QUOTE_ITEM LQ, {/*OWNER*/}VAT T 
SQL6_16=    WHERE T.Id=LQ.IdVAT AND LQ.IdQuote={/*PARAM4*/} 
SQL6_17=    Group by LQ.IdQuote ) tabTVA
SQL6_18= WHERE CL.Id=Q.IdClient and tabTVA.IdLD=Q.Id AND Q.Id={/*PARAM4*/} 


//////
//  calcul des TVA par code et la totale
DATA7=TVA
NAME7=TVA

SQL7=SELECT TITLE, QTY, Price, AmountTVA, LAB from
SQL7_1=(SELECT DISTINCT T.Id as "TITLE",
SQL7_2=  format(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END)),0))/100.0, 2) as "QTY", 
SQL7_3=  format(T.VAT, '.00')+ '% ' as "Price",
SQL7_4=  format(round(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END)),0)/100.0)*T.VAT, 0)/100.0, 2) as AmountTVA, 1 as LAB
SQL7_5= FROM {/*OWNER*/}QUOTE Q,{/*OWNER*/}QUOTE_ITEM LQ, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL7_6= WHERE Q.Id=LQ.IdQuote and T.Id=LQ.IdVAT and CL.Id=Q.IdClient and CL.Country in ('France','FRANCE')
SQL7_7=    AND LQ.IdQuote={/*PARAM4*/}
SQL7_8= Group BY T.Id,T.VAT) t

SQL7_9=UNION ALL (SELECT DISTINCT (CASE WHEN CL.Country in ('France','FRANCE') THEN  'Total' ELSE CL.Country END) as "TITLE",
SQL7_10=  format(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END)), 0))/100.0, 2) as "QTY", 
SQL7_11=  (CASE WHEN CL.Country in ('France','FRANCE') THEN ' ' ELSE CL.Country END) as "Price",
SQL7_12=  format(round(sum(round(LQ.PriceUnit*LQ.Quantity*(100.0-(CASE WHEN LQ.Discount is not NULL and LQ.Discount<>0 THEN LQ.Discount ELSE 0.00 END)), 0)/100.0*T.VAT),0)/100.0, 2) as AmountTVA, count(1) as LAB
SQL7_13= FROM {/*OWNER*/}QUOTE Q,{/*OWNER*/}QUOTE_ITEM LQ, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL7_14= WHERE Q.Id=LQ.IdQuote and T.Id=LQ.IdVAT and CL.Id=Q.IdClient and CL.Country in ('France','FRANCE') and LQ.IdQuote={/*PARAM4*/}
SQL7_15=    AND (select count(1) from (select distinct LQ0.IdVAT from {/*OWNER*/}QUOTE_ITEM LQ0 where LQ0.IdQuote={/*PARAM4*/}) num)>1
SQL7_16= GROUP BY CL.Country)


//////////////
DATA8=LINE_CUSTOMINFO
NAME8=LINECUSTOMINFO

SQL8=SELECT 
SQL8_1=   Q.CustomsInfo as C_Comment,
SQL8_2=   '0' as NoL
SQL8_3= FROM {/*OWNER*/}QUOTE Q
SQL8_4= WHERE Q.Id={/*PARAM4*/} and Q.CustomsInfo is not NULL and Q.CustomsInfo>' '

SQL8_5= UNION ALL SELECT 
SQL8_6=   concat((CASE WHEN CL.Country='France' THEN 'Réalisation par ' ELSE 'Realized by ' END) , Q.ProductCondition) as C_Comment,
SQL8_7=   '1' as NoL
SQL8_8= FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL8_9= WHERE Q.Id={/*PARAM4*/} and Q.ProductCondition is not NULL and Q.ProductCondition>' '

SQL8_10=UNION ALL SELECT 
SQL8_11=   concat((CASE WHEN CL.Country='France' THEN 'Conditionnement : ' ELSE 'Packaging : ' END) , Q.Packaging) as C_Comment,
SQL8_12=   '2' as NoL
SQL8_13=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL8_14=WHERE Q.Id={/*PARAM4*/} and Q.PayCondition is not NULL and Q.PayCondition>' '

SQL8_15=UNION ALL SELECT 
SQL8_16=   concat((CASE WHEN CL.Country='France' THEN 'Règles de transport : ' ELSE 'Transport rules : ' END) , Q.Incoterm) as C_Comment,
SQL8_17=   '3' as NoL
SQL8_18=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL8_19=WHERE Q.Id={/*PARAM4*/} and Q.Incoterm is not NULL and Q.Incoterm>' '

SQL8_20=UNION ALL SELECT 
SQL8_21=   concat((CASE WHEN CL.Country='France' THEN 'Mode de règlement : ' ELSE 'Method of payment : ' END) , Q.PayCondition) as C_Comment,
SQL8_22=   '4' as NoL
SQL8_23=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL8_24=WHERE Q.Id={/*PARAM4*/} and Q.PayCondition is not NULL and Q.PayCondition>' '

SQL8_25=UNION ALL SELECT 
SQL8_26=   Q.Comments as C_Comment,
SQL8_27=   '5' as NoL
SQL8_28=FROM {/*OWNER*/}QUOTE Q left join {/*OWNER*/}CLIENT CL on CL.Id=Q.IdClient
SQL8_29=WHERE Q.Id={/*PARAM4*/} and Q.Comments is not NULL and Q.Comments>' '

SQL8_30=UNION (SELECT DISTINCT
SQL8_31=  'Exonération de T.V.A. Article 262 TER-l du CGI' as C_Comment,
SQL8_32=  ' ' as NoL 
SQL8_33= FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL8_34= WHERE CL.Id=Q.IdClient and CL.Country not in ('France','FRANCE')
SQL8_35=    AND Q.Id={/*PARAM4*/} )

SQL8_36=ORDER BY NoL



//////////////
DATA9=SIGNING
NAME9=Singing

SQL9=SELECT 
SQL9_1=  (CASE WHEN CL.Country='France' THEN  'Bon pour commande' ELSE 'Accepted for Order' END) as Acceptation,
SQL9_2=  (CASE WHEN CL.Country='France' THEN  'Date : ' ELSE 'Date :' END) as SigningDate,
SQL9_3=  (CASE WHEN CL.Country='France' THEN  'Signature ' ELSE 'Signing' END) as Signing,
SQL9_4=  ' ' as B1,
SQL9_5=  ' ' as B2,
SQL9_6=  '' as B3,
SQL9_7=  ' ' as B4,
SQL9_8=  ' ' as B5,
SQL9_9=  ' ' as B6,
SQL9_10= '' as B7
SQL9_11=FROM {/*OWNER*/}QUOTE Q, {/*OWNER*/}CLIENT CL
SQL9_12=WHERE CL.Id=Q.IdClient 
SQL9_13=  AND Q.Id={/*PARAM4*/}


