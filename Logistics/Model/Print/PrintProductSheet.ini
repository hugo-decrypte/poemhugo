DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,
SQL1_11=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'S.A.R.L au capital de ____ €' END) as Capital,
SQL1_12=  concat(' RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END) , ' - SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END)) as InfoRegistre,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE ' ' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE ' ' END) as RCS,
SQL1_15=  concat('N° TVA Intracommunautaire/ V.A.T. No : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_16=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) as APE,
SQL1_17=  concat('Imprimée le ' , date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) as PrintDate_C16 
SQL1_18= FROM {/*OWNER*/}USER u left join {/*OWNER*/}AGENCY AG on AG.ID=u.IdAgency
SQL1_19= WHERE u.Id='{/*PARAM5*/}'


DATA2=INFO_PRODUCT
NAME2=InfoProduct

SQL2=SELECT 
SQL2_1=   P.ID as PRODUCT, 
SQL2_2=   P.Designation as DescriProduct,
SQL2_3=   P.DesignationTech,
SQL2_4=   (CASE WHEN P.Length is not NULL and P.Length>0 THEN format(P.Length,0) ELSE  NULL END),
SQL2_5=   (CASE WHEN P.Width  is not NULL and P.Width>0 THEN  format(P.Width,0)  ELSE  NULL END),
SQL2_6=   (CASE WHEN P.Height is not NULL and P.Height>0 THEN format(P.Height,0) ELSE  NULL END),
SQL2_7=   (CASE WHEN P.Depth  is not NULL and P.Depth>0 THEN  format(P.Depth,0)  ELSE  NULL END),
SQL2_8=   (CASE WHEN P.Volume is not NULL and P.Volume>0 THEN format(P.Volume,0) ELSE  NULL END),
SQL2_9=   (CASE WHEN P.Weight is not NULL and P.Weight>0 THEN format(P.Weight,0) ELSE  NULL END),
SQL2_10=  (select sum(PC.Quantity) FROM {/*OWNER*/}PRODUCT_COMPONENT PC WHERE P.ID=PC.IdProduct) as QTY
SQL2_11= FROM {/*OWNER*/}PRODUCT P 
SQL2_12= WHERE P.ID in ({/*PARAM4*/})


//////////////
DATA3=INFO_SUBPRODUCT
NAME3=INFOSUBPRODUCT

SQL3=SELECT DISTINCT
SQL3_1=   P.ID as PRODUCT, 
SQL3_2=   P.Designation as DescriProduct,
SQL3_3=   P.DesignationTech,
SQL3_4=   (CASE WHEN P.Length is not NULL and P.Length>0 THEN format(P.Length,0) ELSE  NULL END),
SQL3_5=   (CASE WHEN PC.LengthByPiece is not NULL and PC.LengthByPiece>0 THEN format(PC.LengthByPiece,0) ELSE  NULL END),
SQL3_6=   (CASE WHEN P.Width  is not NULL and P.Width>0 THEN  format(P.Width,0) ELSE   NULL END),
SQL3_7=   (CASE WHEN PC.WidthByPiece is not NULL and PC.WidthByPiece>0 THEN format(PC.WidthByPiece,0) ELSE  NULL END),
SQL3_8=   (CASE WHEN P.Height is not NULL and P.Height>0 THEN format(P.Height,0) ELSE  NULL END),
SQL3_9=   (CASE WHEN PC.HeightByPiece is not NULL and PC.HeightByPiece>0 THEN format(PC.HeightByPiece,0) ELSE  NULL END),
SQL3_10=  (CASE WHEN P.Depth  is not NULL and P.Depth>0 THEN  format(P.Depth,0) ELSE   NULL END),
SQL3_11=  (CASE WHEN PC.DepthByPiece is not NULL and PC.DepthByPiece>0 THEN format(PC.DepthByPiece,0) ELSE  NULL END),
SQL3_12=  (CASE WHEN P.Volume is not NULL and P.Volume>0 THEN format(P.Volume,0) ELSE  NULL END),
SQL3_13=  (CASE WHEN PC.VolumeByPiece is not NULL and PC.VolumeByPiece>0 THEN format(PC.VolumeByPiece,0) ELSE  NULL END),
SQL3_14=  (CASE WHEN P.Weight is not NULL and P.Weight>0 THEN format(P.Weight,0) ELSE  NULL END),
SQL3_15=  PC.Quantity
SQL3_16= FROM {/*OWNER*/}PRODUCT P inner join {/*OWNER*/}PRODUCT_COMPONENT PC on P.ID=PC.IdSubProduct
SQL3_17= WHERE PC.IdProduct={/*PARAM4*/}
SQL3_18= ORDER BY P.Id


DATA4=LINE_TOTAL
NAME4=LINETOTAL

SQL4=SELECT DISTINCT 
SQL4_1=   'TOTAL' as PRODUCT, 
SQL4_2=   ' ' as DescriProduct,
SQL4_3=   ' ' as DesignationTech,
SQL4_4=   format(sum((CASE WHEN P.Length is not NULL THEN P.Length ELSE 0 END)),0), format(sum((CASE WHEN PC.LengthByPiece is not NULL THEN PC.LengthByPiece ELSE 0 END)),0),
SQL4_5=   format(sum((CASE WHEN P.Width is not NULL THEN  P.Width  ELSE 0 END)),0), format(sum((CASE WHEN PC.WidthByPiece is not NULL  THEN PC.WidthByPiece  ELSE 0 END)),0),
SQL4_6=   format(sum((CASE WHEN P.Height is not NULL THEN P.Height ELSE 0 END)),0), format(sum((CASE WHEN PC.HeightByPiece is not NULL THEN PC.HeightByPiece ELSE 0 END)),0),
SQL4_7=   format(sum((CASE WHEN P.Depth is not NULL THEN  P.Depth  ELSE 0 END)),0), format(sum((CASE WHEN PC.DepthByPiece is not NULL  THEN PC.DepthByPiece  ELSE 0 END)),0),
SQL4_8=   format(sum((CASE WHEN P.Volume is not NULL THEN P.Volume ELSE 0 END)),0), format(sum((CASE WHEN PC.VolumeByPiece is not NULL THEN PC.VolumeByPiece ELSE 0 END)),0),
SQL4_9=   format(sum((CASE WHEN P.Weight is not NULL THEN P.Weight ELSE 0 END)),0), format(sum((CASE WHEN PC.Quantity is not NULL      THEN PC.Quantity      ELSE 0 END)),0),
SQL4_10=  PC.IdProduct
SQL4_11= FROM {/*OWNER*/}PRODUCT P 
SQL4_12=   inner join {/*OWNER*/}PRODUCT_COMPONENT PC on P.ID=PC.IdSubProduct
SQL4_13= WHERE PC.IdProduct={/*PARAM4*/}
SQL4_14= GROUP BY PC.IdProduct


