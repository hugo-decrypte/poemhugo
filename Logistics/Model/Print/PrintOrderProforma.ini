DATA10=LINE_BANQUEINFO
NAME10=LINEBANQUEINFO

SQL10=SELECT 
SQL10_1=   B.CommentsBefore as Info,
SQL10_2=   1 as ORD
SQL10_3= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_4= WHERE O.Id='{/*CODEORDER*/}' and CommentsBefore is not NULL and CommentsBefore>' '

SQL10_5= UNION ALL SELECT 
SQL10_6=   concat((CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END), ' ', (CASE WHEN B.Address is NULL THEN ' ' ELSE trim(B.Address) END), ' Tel. ', (CASE WHEN B.Phone is NULL THEN ' ' ELSE trim(B.Phone) END)) as Info,
SQL10_7=   2 as ORD
SQL10_8= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_9= WHERE O.Id='{/*CODEORDER*/}'
SQL10_10=  and ((B.Name is not NULL and B.Name>' ') 
SQL10_11=    or (B.Address is not NULL and B.Address>' ') 
SQL10_12=    or (B.Phone is not NULL and B.Phone>' ') )

SQL10_13= UNION ALL SELECT 
SQL10_14=  concat('RIB : ', (CASE WHEN B.RIB is NULL THEN ' ' ELSE trim(B.RIB) END), ' Domiciliation : ', (CASE WHEN B.Domiciliation is NULL THEN ' ' ELSE trim(B.Domiciliation) END)) as Info,
SQL10_15=   3 as ORD
SQL10_16= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_17= WHERE O.Id='{/*CODEORDER*/}'
SQL10_18=  and ((B.RIB is not NULL and B.RIB>' ') 
SQL10_19=    or (B.Domiciliation is not NULL and B.Domiciliation>' ') )

SQL10_20= UNION ALL SELECT 
SQL10_21=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END), '   SWIFT CODE (BIC) : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END)) as Info,
SQL10_22=   4 as ORD
SQL10_23= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_24= WHERE O.Id='{/*CODEORDER*/}'
SQL10_25=  and ((B.IBAN is not NULL and B.IBAN>' ') or (B.BIC is NULL is not NULL and B.BIC>' ') )

SQL10_26= UNION ALL SELECT 
SQL10_27=  B.CommentsAfter1 as Info,
SQL10_28=   5 as ORD
SQL10_29= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_30= WHERE O.Id='{/*CODEORDER*/}'
SQL10_31=  and (B.CommentsAfter1 is not NULL and B.CommentsAfter1>' ') 

SQL10_32= UNION ALL SELECT 
SQL10_33=  B.CommentsAfter2 as Info,
SQL10_34=   6 as ORD
SQL10_35= FROM ({/*OWNER*/}CLIENTORDER O inner join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_36= WHERE O.Id='{/*CODEORDER*/}'
SQL10_37=  and (B.CommentsAfter2 is not NULL and B.CommentsAfter2>' ') 


