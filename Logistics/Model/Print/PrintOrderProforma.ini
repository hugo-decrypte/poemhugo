DATA12=TVA
NAME12=TVA

SQL12=SELECT TITLE, QTY, Price, AmountTVA from
SQL12_1=(SELECT DISTINCT T.Id as "TITLE",
SQL12_2=   format(sum(round(OP.PriceUnit*OP.Quantity*(100.0-(CASE WHEN OP.Discount is not NULL and OP.Discount<>0 THEN OP.Discount ELSE 0 END))/100.0, 2)), 2) as "QTY", 
SQL12_3=   format(T.VAT, 2)+ '% ' as "Price",
SQL12_4=   format(sum(round(OP.PriceUnit*OP.Quantity*(100.0-(CASE WHEN OP.Discount is not NULL and OP.Discount<>0 THEN OP.Discount ELSE 0 END))/100.0, 2))*T.VAT/100.0, 2) as AmountTVA
SQL12_5= FROM {/*OWNER*/}CLIENTORDER O,{/*OWNER*/}ORDER_PRODUCT OP, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL12_6= WHERE O.Id=OP.IdOrder and T.Id=OP.IdVAT and CL.Id=O.IdClient and CL.Country in ('France','FRANCE')
SQL12_7=    AND OP.IdOrder='{/*CODEORDER*/}'
SQL12_8= Group BY T.Id,T.VAT) tabTVA

SQL12_9=UNION ALL (SELECT DISTINCT 'Total' as "TITLE",
SQL12_10=  format(sum(round(OP.PriceUnit*OP.Quantity*(100.0-(CASE WHEN OP.Discount is not NULL and OP.Discount<>0 THEN OP.Discount ELSE 0 END))/100.0, 2)), 2) as "QTY", 
SQL12_11=  ' ' as "Price",
SQL12_12=  format(sum(round(OP.PriceUnit*OP.Quantity*(100.0-(CASE WHEN OP.Discount is not NULL and OP.Discount<>0 THEN OP.Discount ELSE 0 END))/100.0, 2))*T.VAT/100.0, 2) as AmountTVA
SQL12_13= FROM {/*OWNER*/}CLIENTORDER O,{/*OWNER*/}ORDER_PRODUCT OP, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL12_14= WHERE O.Id=OP.IdOrder and T.Id=OP.IdVAT and CL.Id=O.IdClient and CL.Country in ('France','FRANCE')
SQL12_15=  and (OP.IdVAT is not NULL and OP.IdVAT>' ')
SQL12_16=  AND OP.IdOrder ='{/*CODEORDER*/}' GROUP BY CL.Country )

SQL12_17=UNION ALL (SELECT DISTINCT
SQL12_18= 'Exonéré' as "TITLE",
SQL12_19=  ' ' as "QTY", 
SQL12_20=  ' ' as "Price",
SQL12_21=  ' ' as AmountTVA
SQL12_22= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL12_23= WHERE CL.Id=O.IdClient and CL.Country not in ('France','FRANCE')
SQL12_24=    AND O.Id ='{/*CODEORDER*/}')




