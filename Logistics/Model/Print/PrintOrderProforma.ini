//////////////
// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,

SQL1_11=  concat('TVA Intracom : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_12=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'Type Société : ________ au capital de ______ €' END) as TypeCompagny,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE 'SIRET :' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE 'RCS :' END) as RCS,
SQL1_15=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE 'APE :' END) as APE,
SQL1_16=  concat('SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END),
SQL1_17=  ' - RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END),
SQL1_18=  ' - APE : ', (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) ) as InfoRegistre,
SQL1_19=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END) , ' - BIC : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END), '  ', (CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END)) as BankInfo,
SQL1_20=  (CASE WHEN CL.Country='France' THEN concat('Imprimée le ', date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) ELSE concat('Printed ', date_format(Now(), '%m %d, %Y,  %H:%i:%s')) END) as PrintDate,

SQL1_21=  concat((CASE WHEN CL.Country='France' THEN 'N° Proforma : ' ELSE 'Proforma no : ' END) , (CASE WHEN O.IdProforma is NULL THEN ' ' ELSE O.IdProforma END) ) as IdProforma,
SQL1_22=  concat((CASE WHEN CL.Country='France' THEN 'Commande N° : ' ELSE 'Order no : ' END), O.id) as IdOrder
SQL1_23= FROM (({/*OWNER*/}CLIENTORDER O left join {/*OWNER*/}AGENCY AG on AG.ID=O.IdAgency)
SQL1_24=  left join {/*OWNER*/}CLIENT CL on CL.Id=O.IdClient)
SQL1_25=  left join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL1_26= WHERE  O.Id='{/*CODEORDER*/}'


// BankInfo in FOOTER

// client info used in INSTR3
DATA2=INFO_FACTURE
NAME2=InfoFacture

SQL2=SELECT DISTINCT
SQL2_1=   concat((CASE WHEN CL.Country='France' THEN 'N° Proforma : ' ELSE 'Proforma no : ' END) , (CASE WHEN O.IdProforma is NULL THEN ' ' ELSE O.IdProforma END)) as IdFacture,
SQL2_2=   (CASE WHEN CL.Country='France' THEN concat('Date facture : ' , date_format(O.DateDelivery,'%d '), MI.NameFR , ' ' , date_format(O.DateDelivery, '%Y') )
SQL2_3=     ELSE concat('Date invoice : ' , MI.NameEN ,' ', date_format(O.DateDelivery,'%d, %Y')) END) as DateFact,
SQL2_4=   (CASE WHEN CL.Country='France' THEN concat('Date échéance : ' , date_format(addDate(O.DateDelivery,30), '%d ') , MP.NameFR ,' ', date_format(addDate(O.DateDelivery,30), '%Y'))
SQL2_5=     ELSE concat('Payment Due : '  , MP.NameEN ,' ', date_format(addDate(O.DateDelivery,30), '%d, %Y')) END) as DateMaxPayment,
SQL2_6=   (CASE WHEN CL.Country='France' THEN 'Adresse de livraison' ELSE 'Shipping adress' END) as TitleAdressDeliv, 
SQL2_7=   PT.NameClient as PtDeliv, 

SQL2_8=   PT.Address as AddresDeliv, 
SQL2_9=   PT.AddressSup as AddresSupDeliv, 
SQL2_10=  concat(TRIM(PT.PostCode) , '   ' , PT.City) as PostCodeCityDeliv, 
SQL2_11=  (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as CountryDeliv,

SQL2_12=   (CASE WHEN CL.Country='France' THEN 'Adresse de facturation' ELSE 'Billing adress' END) as TitleAdressFact, 
SQL2_13=   CL.Name as NameFact, 

SQL2_14=   (CASE WHEN CL.Country='France' THEN 'Service comptabilité ' ELSE 'Accountant department' END) as Compta,
SQL2_15=   CL.Address as AddresFact, 
SQL2_16=   CL.AddressSup as AddresSupFact, 
SQL2_17=   concat(TRIM(CL.PostCode) , '   ' , CL.City) as PostCodeCityFact, 
SQL2_18=   (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as Country,

SQL2_19=   concat('N° Client : ' , O.IdClient) as ClientNo_C17,
SQL2_20=   concat('SIRET : ' , (CASE WHEN CL.SIRET is NULL THEN ' ' ELSE CL.SIRET END)) as SIRET,
SQL2_21=   concat((CASE WHEN CL.Country='France' THEN  'N° TVA : '   ELSE 'Customer VAT no.: ' END) , (CASE WHEN CL.codeVAT is NULL THEN ' ' ELSE CL.codeVAT END)) as TVANo,
SQL2_22=   concat((CASE WHEN CL.Country='France' THEN  'Commande : ' ELSE 'Order No : ' END) , O.Id) as OrderNo,
SQL2_23=   concat((CASE WHEN CL.Country='France' THEN  'Suivi par : ' ELSE 'Followed by: ' END) , (CASE WHEN O.FollowedBy is NULL THEN ' ' ELSE O.FollowedBy END)) as FollowedBy,
SQL2_24=   concat((CASE WHEN CL.Country='France' THEN  'Réf : ' ELSE 'Our reference: ' END) , (CASE WHEN O.Reference is NULL THEN ' ' ELSE O.Reference END)) as Reference,
SQL2_25=   concat('Incoterm : ' , (CASE WHEN O.Incoterm is NULL THEN ' ' ELSE O.Incoterm END)) as Incoterm

SQL2_26= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT, {/*OWNER*/}MONTHLABEL MI, {/*OWNER*/}MONTHLABEL MP
SQL2_27= WHERE CL.Id=O.IdClient 
SQL2_28=  AND PT.IdClient=O.IdClient AND PT.IdPoint=O.IdPointDelivery
SQL2_29=   AND MI.NoMonth=date_format(O.DateDelivery,'%m')
SQL2_30=   AND MP.NoMonth=date_format(addDate(O.DateDelivery,30), '%m')
SQL2_31=  AND O.Id='{/*CODEORDER*/}'


//////////////
// detail invoice table header used in INSTR4

DATA3=LINE_FACT_COLHEAD
NAME3=LINEFACTCOLHEAD

SQL3=SELECT DISTINCT
SQL3_1=   (CASE WHEN CL.Country='France' THEN  'N°' ELSE  'no' END) as Num,
SQL3_2=   (CASE WHEN CL.Country='France' THEN  'N° Commande' ELSE  'Order no' END) as Package,
SQL3_3=   (CASE WHEN CL.Country='France' THEN  'Réference' ELSE  'Reference' END) as QtyP,
SQL3_4=   (CASE WHEN CL.Country='France' THEN  'Désignation' ELSE 'DESCRIPTION' END) as Cmd,
SQL3_5=   (CASE WHEN CL.Country='France' THEN  'Quantité' ELSE  'Quantity' END) as Qty,
SQL3_6=   (CASE WHEN CL.Country='France' THEN  'Unité' ELSE  'Unit' END) as Unit,
SQL3_7=   concat((CASE WHEN CL.Country='France' THEN  'PV HT' ELSE  'Price' END),'(',(CASE WHEN O.Currency is NULL THEN '€' ELSE O.Currency END),')') as Price,
SQL3_8=   concat((CASE WHEN CL.Country='France' THEN  'Montant HT' ELSE 'Amount' END),'(',(CASE WHEN O.Currency is NULL THEN '€' ELSE O.Currency END),')') as Amount
SQL3_9=  FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL3_10= WHERE CL.Id=O.IdClient
SQL3_11=   AND O.Id='{/*CODEORDER*/}'

// detail order table no used 

DATA4=LINE_ORDER
NAME4=LINE_ORDER

SQL4=SELECT DISTINCT
SQL4_1=   concat('Client : ', trim(CL.Name), (CASE WHEN CL.Country='France' THEN ' Commande ' ELSE ' Purchase Order : ' END) , O.Id) as Cmd,
SQL4_2=   format(sum(OP.Quantity/P.QuantityPackaging),1) as "Package",
SQL4_3=   concat(format(sum(OP.PriceUnit*OP.Quantity*(100.0-(CASE WHEN OP.Discount is not NULL and OP.Discount<>0 THEN OP.Discount ELSE 0 END))/100.0),2) ,(CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceTotal,
SQL4_4=    ' ' as DELIVID, O.Id as ORDERID
SQL4_5=  FROM {/*OWNER*/}ORDER_PRODUCT OP, {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}PRODUCT P
SQL4_6=  WHERE O.Id=OP.IdOrder 
SQL4_7=   AND CL.Id=O.IdClient
SQL4_8=   AND OP.IdProduct=P.Id
SQL4_9=   AND OP.IdOrder ='{/*CODEORDER*/}'
SQL4_10= Group By CL.Country, CL.Name, O.Id, OP.IdOrder, O.Currency


// detail order info table used in INSTR5

DATA5=ORDER_DETAIL
NAME5=OrderDetailInfo

SQL5=SELECT 
SQL5_1=   ' ' as Num,
SQL5_2=   O.Id as IdOrder,
SQL5_3=   P.Reference,
SQL5_4=   P.Designation as Product,
SQL5_5=   format(sum(OP.Quantity),0) as "QTY",
SQL5_6=   P.Unity as Unit,
SQL5_7=   format(OP.PriceUnit, 2) as PriceUnit,
SQL5_8=   concat(format(OP.PriceUnit*sum(OP.Quantity),2) , (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceTotal
SQL5_9=  FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}ORDER_PRODUCT OP, {/*OWNER*/}PRODUCT P
SQL5_10= WHERE O.ID=OP.IdOrder and P.ID=OP.IdProduct AND OP.IdOrder='{/*CODEORDER*/}' 
SQL5_11= GROUP BY O.Id, P.Reference, P.Unity, P.Designation, P.PriceUnit, OP.PriceUnit, O.Currency
SQL5_12= ORDER BY P.Designation


DATA6=INVOICETOTAL
NAME6=INVOICETOTAL
// used in INSTR7
// 2021.02.22 iif discount<0 , Frais service DAP

SQL6=SELECT DISTINCT
SQL6_1=   '1' as "ORD", 'TOTAL' as "TITLE",
SQL6_2=   (select format(sum(OP.Quantity/P.QuantityPackaging),1) from {/*OWNER*/}ORDER_PRODUCT OP inner join {/*OWNER*/}PRODUCT P on P.ID=OP.IdProduct where OP.IdOrder=O.Id) as "Package",
SQL6_3=   O.Quantity as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_4=   concat(format(O.AmountHT, 2) , (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceHT
SQL6_5=  FROM {/*OWNER*/}CLIENTORDER O
SQL6_6=  WHERE O.Id='{/*CODEORDER*/}'
SQL6_7=UNION SELECT DISTINCT
SQL6_8=   '2' as "ORD",
SQL6_9=   (CASE WHEN O.LabelDiscount is not NULL and O.LabelDiscount>' ' THEN O.LabelDiscount WHEN O.Discount>0 THEN 'Frais Service DAP' WHEN CL.Country='France' THEN 'REMISE' ELSE 'DISCOUNT' END) as "TITLE", ' '  as "Package",
SQL6_10=  format(O.AmountHT, 2) as "QTY", ' ' as "Price", concat(format(O.Discount,1), ' % ') as "Discount",
SQL6_11=  concat(format(O.AmountHT*(-O.Discount)/100.0,2) , (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as DiscountHT
SQL6_12= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL6_13= WHERE CL.Id=O.IdClient AND O.Discount is not NULL AND O.Discount<>0 
SQL6_14=    AND O.Id='{/*CODEORDER*/}'
SQL6_15=UNION SELECT DISTINCT
SQL6_16=  '3' as "ORD",
SQL6_17=  'TOTAL H.T.' as "TITLE", ' '  as "Package",
SQL6_18=  ' ' as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_19=  concat(format(O.AmountHT*(100-O.Discount)/100.0, 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as TotalHT
SQL6_20= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL6_21= WHERE CL.Id=O.IdClient AND O.Discount is not NULL AND O.Discount<>0
SQL6_22=    AND O.Id='{/*CODEORDER*/}'

SQL6_23=UNION SELECT DISTINCT
SQL6_24=  '4' as "ORD",
SQL6_25=  'Remise Globalisée' as "TITLE", ' '  as "Package",
SQL6_26=  ' ' as "QTY", ' ' as "Price", concat(format((select sum(OP.PriceUnit*OP.Quantity*OP.Discount) from {/*OWNER*/}ORDER_PRODUCT OP where OP.IdOrder=O.Id and OP.Discount is not NULL)/(select sum(OP.PriceUnit*OP.Quantity) from {/*OWNER*/}ORDER_PRODUCT OP where OP.IdOrder=O.Id), 2), '% ') as "Discount",
SQL6_27=  concat(format((select sum(OP.PriceUnit*OP.Quantity*OP.Discount) from {/*OWNER*/}ORDER_PRODUCT OP where OP.IdOrder=O.Id and OP.Discount is not NULL)/100.0, 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as TotalHT
SQL6_28= FROM {/*OWNER*/}CLIENTORDER O
SQL6_29= Where exists (select 1 from {/*OWNER*/}ORDER_PRODUCT OP where OP.IdOrder=O.Id and OP.Discount is not NULL and OP.Discount>0)
SQL6_30=    AND O.Id ='{/*CODEORDER*/}'

SQL6_31=UNION SELECT DISTINCT
SQL6_32=  '5' as "ORD",
SQL6_33=  'Paiement Anticipé' as "TITLE", ' '  as "Package",
SQL6_34=  ' ' as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_35=  concat(format(-O.AdvancePayment,2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as TotalHT
SQL6_36= FROM {/*OWNER*/}CLIENTORDER O
SQL6_37= Where O.AdvancePayment is not NULL and O.AdvancePayment>0
SQL6_38=    AND O.Id ='{/*CODEORDER*/}'
SQL6_39= ORDER BY ORD


// table tatol in INSTR9
DATA7=TOTAL
NAME7=TOTAL

SQL7=SELECT DISTINCT
SQL7_1=   'EURO(€)' as "QTY",
SQL7_2=   concat(format(O.AmountHT*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceHT,
SQL7_3=   concat((CASE WHEN tabTVA.MinTVA=tabTVA.MaxTVA THEN format(tabTVA.MaxTVA,2) ELSE 'xx' END), ' %') as TVA,
SQL7_4=   concat(format(tabTVA.TotalTVA*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceTVA,
SQL7_5=   concat(format(round(tabTVA.TotalTVA*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2)+round(O.AmountHT*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2), 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as PriceTotal,
SQL7_6=   (CASE WHEN CL.Country='France' THEN  'TOTAL H.T.' ELSE 'TOTAL H.T.' END) as C6,
SQL7_7=   (CASE WHEN CL.Country='France' THEN  'TAUX T.V.A.' ELSE 'TAUX V.A.T.' END) as C7,
SQL7_8=   (CASE WHEN CL.Country='France' THEN  'TOTAL T.V.A.' ELSE 'TOTAL V.A.T.' END) as C8,
SQL7_9=   (CASE WHEN CL.Country='France' THEN  'TOTAL TTC' ELSE 'TOTAL PRICE' END) as C9, 
SQL7_10=  (CASE WHEN CL.Country='France' THEN  'NET A PAYER' ELSE 'NET TO PAY' END) as C10, 

SQL7_11=  concat((CASE WHEN CL.Country='France' THEN  'Paiement Anticipé : ' ELSE 'Advance Payment : ' END), (CASE WHEN O.AdvancePayment is not NULL and O.AdvancePayment>0 THEN format(O.AdvancePayment,2) WHEN CL.Country='France' THEN 'pas d''escompte' ELSE 'without discount' END) ) as Prepay_C11,
SQL7_12=  (select B.PenaltyLatePayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as Pelnal_C12,
SQL7_13=  (CASE WHEN CL.Country='France' THEN concat('Echéance : le ', date_format(addDate(O.DateDelivery,30), '%d/%m/%Y')) ELSE concat('Payment Due : ' , date_format(addDate(O.DateDelivery,30), '%Y-%m-%d') ) END) as DateMaxPayment,
SQL7_14=  (select B.CommentsPayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as REGL,
SQL7_15=  (CASE WHEN CL.Country='France' THEN concat('Date Facture : le ' , date_format(O.DateDelivery, '%d/%m/%Y')) ELSE concat('Date Invoice : ' , date_format(O.DateDelivery,'%Y-%m-%d') ) END) as DateFact,
SQL7_16=  (CASE WHEN CL.Country='France' THEN  ' ' ELSE 'Exonération de T.V.A. Article 262 TER-l du CGI' END) as ExoTVA,
SQL7_17=  concat(format(round(tabTVA.TotalTVA*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2)+round(O.AmountHT*(CASE WHEN O.Discount is NULL THEN 100.0 ELSE (100.0-O.Discount) END)/100.0, 2)+round((CASE WHEN O.AdvancePayment is not NULL and O.AdvancePayment>0 THEN -O.AdvancePayment ELSE 0 END),2), 2), (CASE WHEN O.Currency is not NULL and O.Currency>' ' THEN O.Currency ELSE ' €' END)) as NetToPay

SQL7_18= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL,
SQL7_19=   (SELECT DISTINCT 
SQL7_20=      OP.IdOrder as IdLO, min(T.VAT) as MinTVA, max(T.VAT) as MaxTVA,
SQL7_21=      sum(round(round(OP.PriceUnit*OP.Quantity*(CASE WHEN OP.Discount is NULL THEN 100.0 ELSE (100.0-OP.Discount) END)/100.0, 2)*T.VAT/100.0, 2)) as TotalTVA 
SQL7_22=    FROM {/*OWNER*/}ORDER_PRODUCT OP, {/*OWNER*/}VAT T 
SQL7_23=    WHERE T.Id=OP.IdVAT AND OP.IdOrder='{/*CODEORDER*/}'
SQL7_24=    Group by OP.IdOrder ) tabTVA
SQL7_25= WHERE CL.Id=O.IdClient and tabTVA.IdLO=O.Id AND O.Id='{/*CODEORDER*/}'


DATA8=REGLE
NAME8=REGLE

//INSTR11=Text(10 260 2100 300, " Règlement de facture   30 jours date de facture, fin du mois", FONT4, LEFT|VCENTER, COLOR1)
