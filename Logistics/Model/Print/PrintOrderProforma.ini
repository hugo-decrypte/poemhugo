DATA9=LINE_CUSTOMINFO
NAME9=LINECUSTOMINFO

SQL9=SELECT 
SQL9_1=   concat(trim(P.Designation) , ' : ' , OP.Comments) as C_Comments,
SQL9_2=   OP.IdProduct as Art, OP.IdOrder as Cmd, (select count(1) from {/*OWNER*/}ORDER_PRODUCT LO1 where LO1.IdOrder=OP.IdOrder and LO1.IdProduct<=OP.IdProduct) as NoL
SQL9_3=  FROM {/*OWNER*/}ORDER_PRODUCT OP inner join {/*OWNER*/}PRODUCT P on OP.IdProduct=P.ID
SQL9_4=  WHERE 
SQL9_5=   OP.IdOrder='{/*CODEORDER*/}'
SQL9_6=   AND OP.Comments is not NULL and OP.Comments>' '
SQL9_7=UNION ALL SELECT 
SQL9_8=   O.CustomsInfo as C_Comments,
SQL9_9=   ' ' as Art, ' ' as Cmd, 0 as NoL
SQL9_10=FROM {/*OWNER*/}CLIENTORDER O
SQL9_11= WHERE O.Id='{/*CODEORDER*/}' and O.CustomsInfo is not NULL and O.CustomsInfo>' '
SQL9_12= ORDER BY Art, Cmd, NoL

