SQL8_1=   (CASE WHEN CL.Country='France' THEN  ' Règlement de facture à 30 jours date de facture, fin du mois' ELSE 'Terms of sale: 30 days, date of invoice' END) as C1,
SQL8_2=   (CASE WHEN CL.Country='France' THEN  ' ' ELSE 'Exonération de T.V.A. Article 262 TER-l du CGI' END) as C2,
SQL8_3=   (CASE WHEN CL.Country='France' THEN  'Règlement de facture : ' ELSE 'Terms of sale: ' END) as C3,
SQL8_4=   O.Comments as C4, O.CustomsInfo as C5
SQL8_5= FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL
SQL8_6= WHERE CL.Id=O.IdClient
SQL8_7=    AND O.Id='{/*CODEORDER*/}'

