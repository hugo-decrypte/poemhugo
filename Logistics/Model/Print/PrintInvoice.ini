// agency info used in HEADER and FOOTER
DATA1=MY_ADRESS
NAME1=MYADRESS

SQL1=SELECT 
SQL1_1=   (CASE WHEN AG.NAME is not NULL THEN AG.NAME ELSE ' ' END) as Nom,
SQL1_2=   (CASE WHEN AG.LABEL is not NULL THEN AG.LABEL ELSE ' ' END) as Label,
SQL1_3=   (CASE WHEN AG.ADDRESS is not NULL THEN AG.ADDRESS ELSE ' ' END) as Adr,
SQL1_4=   (CASE WHEN AG.ADDRESSSUP is not NULL THEN AG.ADDRESSSUP ELSE ' ' END) as Adr2,
SQL1_5=   (CASE WHEN AG.PostCode is not NULL THEN AG.PostCode ELSE ' ' END) as CodePost,
SQL1_6=   (CASE WHEN AG.City is not NULL THEN AG.City ELSE ' ' END) as City,
SQL1_7=   (CASE WHEN AG.Country is not NULL THEN AG.Country ELSE 'France' END) as Country,
SQL1_8=   (CASE WHEN AG.Phone is not NULL THEN AG.Phone ELSE ' ' END) as Phone,
SQL1_9=   (CASE WHEN AG.Fax is not NULL THEN AG.Fax ELSE ' ' END) as Fax,
SQL1_10=  (CASE WHEN AG.EMAIL is not NULL THEN AG.EMAIL ELSE ' ' END) as Mail,

SQL1_11=  concat('N° TVA Intracommunautaire : ', (CASE WHEN AG.NumTVA is not NULL THEN AG.NumTVA ELSE ' ' END)) as NoTVA,
SQL1_12=  (CASE WHEN AG.Capital is not NULL THEN AG.Capital ELSE 'Type Société : ________ au capital de ______ €' END) as TypeCompagny,
SQL1_13=  (CASE WHEN AG.Siret is not NULL THEN AG.Siret ELSE 'SIRET :' END) as Siret,
SQL1_14=  (CASE WHEN AG.RCS is not NULL THEN AG.RCS ELSE 'RCS :' END) as RCS,
SQL1_15=  (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE 'APE :' END) as APE,
SQL1_16=  concat('SIRET : ', (CASE WHEN AG.Siret is not NULL THEN trim(AG.Siret) ELSE ' ' END),
SQL1_17=  ' - RCS : ', (CASE WHEN AG.RCS is not NULL THEN trim(AG.RCS) ELSE ' ' END),
SQL1_18=  ' - APE : ', (CASE WHEN AG.APE is not NULL THEN AG.APE ELSE ' ' END) ) as InfoRegistre,

SQL1_19=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END) , ' - BIC : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END), '  ', (CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END)) as BankInfo,
SQL1_20=  (CASE WHEN CL.Country='France' THEN concat('Imprimée le ', date_format(Now(), '%d/%m/%Y, à %H:%i:%s')) ELSE concat('Printed ', date_format(Now(), '%m %d, %Y,  %H:%i:%s')) END) as PrintDate,
SQL1_21=  concat((CASE WHEN CL.Country='France' THEN 'Facture N° : ' ELSE 'Invoice no : ' END) , (CASE WHEN D.IdInvoice is NULL THEN ' ' ELSE D.IdInvoice END) ) as IdFacture
SQL1_22= FROM (({/*OWNER*/}DELIVERY D left join {/*OWNER*/}AGENCY AG on AG.ID=D.IdAgency)
SQL1_23=  left join {/*OWNER*/}CLIENT CL on CL.Id=D.IdClient)
SQL1_24=  left join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL1_25= WHERE  D.Id='{/*CODEDELIVERY*/}'


DATA2=INFO_FACTURE
NAME2=InfoFacture

SQL2=SELECT DISTINCT
SQL2_1=   concat((CASE WHEN CL.Country='France' THEN 'N° Facture : ' ELSE 'Invoice no : ' END) , (CASE WHEN D.IdInvoice is NULL THEN ' ' ELSE D.IdInvoice END)) as IdFacture,
SQL2_2=   (CASE WHEN CL.Country='France' THEN concat('Date facture : ' , date_format(D.DateInvoice,'%d '), MI.NameFR , ' ' , date_format(D.DateInvoice, '%Y') )
SQL2_3=     ELSE concat('Date invoice : ' , MI.NameEN ,' ', date_format(D.DateInvoice,'%d, %Y')) END) as DateFact,
SQL2_4=   (CASE WHEN CL.Country='France' THEN concat('Date échéance : ' , date_format(D.DatePayment, '%d ') , MP.NameFR ,' ', date_format(D.DatePayment, '%Y'))
SQL2_5=     ELSE concat('Payment Due : '  , MP.NameEN ,' ', date_format(D.DatePayment, '%d, %Y')) END) as DateMaxPayment,
SQL2_6=   (CASE WHEN CL.Country='France' THEN 'Adresse de livraison' ELSE 'Shipping adress' END) as TitleAdressDeliv, 
SQL2_7=   PT.NameClient as PtDeliv, 

SQL2_8=   PT.Address as AddresDeliv, 
SQL2_9=   PT.AddressSup as AddresSupDeliv, 
SQL2_10=  concat(TRIM(PT.PostCode) , '   ' , PT.City) as PostCodeCityDeliv, 
SQL2_11=  (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as CountryDeliv,

SQL2_12=  (CASE WHEN CL.Country='France' THEN 'Adresse de facturation' ELSE 'Billing adress' END) as TitleAdressFact, 
SQL2_13=   CL.Name as NameFact, 

SQL2_14=   (CASE WHEN CL.Country='France' THEN 'Service comptabilité ' ELSE 'Accountant department' END) as Compta,
SQL2_15=   CL.Address as AddresFact, 
SQL2_16=   CL.AddressSup as AddresSupFact, 
SQL2_17=   concat(TRIM(CL.PostCode) , '   ' , CL.City) as PostCodeCityFact, 
SQL2_18=   (CASE WHEN CL.Country='France' THEN ' ' ELSE CL.Country END) as Country,

SQL2_19=   concat('N° Client : ' , D.IdClient) as ClientNo_C17,
SQL2_20=   concat('SIRET : ' , (CASE WHEN CL.SIRET is NULL THEN ' ' ELSE CL.SIRET END)) as SIRET,
SQL2_21=   concat((CASE WHEN CL.Country='France' THEN  'N° TVA : '   ELSE 'Customer VAT no.: ' END) , (CASE WHEN CL.codeVAT is NULL THEN ' ' ELSE CL.codeVAT END)) as TVANo,
SQL2_22=   concat((CASE WHEN CL.Country='France' THEN  'Commande : ' ELSE 'Order No : ' END) , D.Id) as OrderNo,
SQL2_23=   concat((CASE WHEN CL.Country='France' THEN  'Suivi par : ' ELSE 'Followed by: ' END) , (CASE WHEN D.FollowedBy is NULL THEN ' ' ELSE D.FollowedBy END)) as FollowedBy,
SQL2_24=   concat((CASE WHEN CL.Country='France' THEN  'Réf : ' ELSE 'Our reference: ' END) , (CASE WHEN D.RefInvoice is NULL THEN ' ' ELSE D.RefInvoice END)) as Reference,
SQL2_25=   concat('Incoterm : ' , (CASE WHEN D.Incoterm is NULL THEN ' ' ELSE D.Incoterm END)) as Incoterm

SQL2_26= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL, {/*OWNER*/}POINTDELIVERY PT, {/*OWNER*/}MONTHLABEL MI, {/*OWNER*/}MONTHLABEL MP
SQL2_27= WHERE CL.Id=D.IdClient
SQL2_28=  AND PT.IdClient=D.IdClient AND PT.IdPoint=D.IdPointDelivery
SQL2_29=  AND MI.NoMonth=date_format(D.DateDelivery,'%m')
SQL2_30=  AND MP.NoMonth=(CASE WHEN D.DatePayment is not NULL and D.DatePayment>0 THEN date_format(D.DatePayment,'%m')
SQL2_31=  	ELSE date_format(addDate(D.DateDelivery,30), '%m') END)
SQL2_32=  AND D.Id='{/*CODEDELIVERY*/}'


////////////// INSTR4
DATA3=LINE_FACT_COLHEAD
NAME3=LINEFACTCOLHEAD

SQL3=SELECT DISTINCT
SQL3_1=   (CASE WHEN CL.Country='France' THEN  'N°' ELSE  'no' END) as Num,
SQL3_2=   (CASE WHEN CL.Country='France' THEN  'Commande' ELSE  'Order no' END) as Cmd,
SQL3_3=   (CASE WHEN CL.Country='France' THEN  'Réference' ELSE  'Reference' END) as Ref,
SQL3_4=   (CASE WHEN CL.Country='France' THEN  'Désignation' ELSE 'DESCRIPTION' END) as Desig,
SQL3_5=   (CASE WHEN CL.Country='France' THEN  'Quantité' ELSE  'Quantity' END) as Qty,
SQL3_6=   (CASE WHEN CL.Country='France' THEN  'Unité' ELSE  'Unit' END) as Unit,
SQL3_7=   concat((CASE WHEN CL.Country='France' THEN  'PV HT' ELSE  'Price' END),'(',(CASE WHEN D.Currency is NULL THEN '€' ELSE D.Currency END),')') as Price,
SQL3_8=   concat((CASE WHEN CL.Country='France' THEN  'Montant HT' ELSE 'Amount' END),'(',(CASE WHEN D.Currency is NULL THEN '€' ELSE D.Currency END),')') as Amount,
SQL3_9=   (CASE WHEN CL.Country='France' THEN  'TVA' ELSE 'VAT' END) as TVA,
SQL3_10=  (CASE WHEN CL.Country='France' THEN  'Remise' ELSE 'Discount' END) as Discount
SQL3_11= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL3_12= WHERE CL.Id=D.IdClient AND D.Id='{/*CODEDELIVERY*/}'


DATA4=LINE_CMD
NAME4=LINECOMMAND

SQL4=SELECT 
SQL4_1=   concat('Client : ', trim(CL.Name), (CASE WHEN CL.Country='France' THEN ' Commande ' ELSE ' Purchase Order : ' END) , O.Id) as Cmd,
SQL4_2=   format(tabLD.TotalQty,0) as "Quantity",
SQL4_3=   concat(format(tabLD.TotalHT,2) ,(CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE ' €' END)) as PriceTotal,
SQL4_4=   tabLD.IdD as DELIVID, tabLD.IdO as CMDID, CL.IdClub as CLUBID
SQL4_5=  FROM {/*OWNER*/}CLIENTORDER O, {/*OWNER*/}CLIENT CL, {/*OWNER*/}DELIVERY D,
SQL4_6=   (SELECT DISTINCT 
SQL4_7=      DP.IdDelivery as IdD, DP.IdOrder as IdO, 
SQL4_8=      sum(DP.Quantity) as TotalQty, sum(DP.Quantity/Prd.QuantityPackaging) as TotalPackage, 
SQL4_9=      sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0, 2)) as TotalHT
SQL4_10=   FROM {/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}PRODUCT Prd
SQL4_11=   WHERE Prd.ID=DP.IdProduct AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL4_12=   Group by DP.IdDelivery,DP.IdOrder ) tabLD
SQL4_13=  WHERE O.Id=tabLD.IdO
SQL4_14=   AND CL.Id=O.IdClient
SQL4_15=   AND D.Id='{/*CODEDELIVERY*/}'


DATA5=LIVRAISONINFO
NAME5=LIVRAISONINFO


SQL5=SELECT 
SQL5_1=   ' ' as Num,
SQL5_2=   DP.IdOrder as Cmd,
SQL5_3=   Prd.Id as IdProd,
SQL5_4=   Prd.Designation as Prd,
SQL5_5=   DP.Quantity as Qty, 
SQL5_6=   Prd.Unity as UNIT,
SQL5_7=   concat(format(DP.PriceUnit, 2), ' ', (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END)) as PriceUnit,
SQL5_8=   concat((CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN format(DP.PriceUnit*sum(DP.Quantity*(100.0-DP.Discount)/100.0),2) ELSE format(DP.PriceUnit*sum(DP.Quantity),2) END) , ' ' , (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END)) as PriceTotal,
SQL5_9=   (CASE WHEN DP.Discount<>0 THEN concat(format(DP.Discount,1), '% ') ELSE ' ' END) as Discount,
SQL5_10=  (CASE WHEN LP.NoLot is not NULL and LP.NoLot>' ' THEN LP.NoLot ELSE date_format(LP.DateCreate,'%Y-%m-%d') END) as NoLot,
SQL5_11=  (CASE WHEN LP.DateExpiration is not NULL and LP.DateExpiration>0 THEN date_format(LP.DateExpiration,'%Y-%m-%d') ELSE ' ' END) as DateExpiration,
SQL5_12=  DP.IdVAT, DP.IdProduct, Prd.Family
SQL5_13=FROM (({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT DP on D.ID=DP.IdDelivery)
SQL5_14=  inner join {/*OWNER*/}PRODUCT Prd on Prd.ID=DP.IdProduct)
SQL5_15=  left join {/*OWNER*/}PALLET_PRODUCT LP on LP.IdPacking=DP.IdPacking and LP.NoPallet=DP.NoPallet and LP.IdProduct=DP.IdProduct
SQL5_16=WHERE DP.IdDelivery='{/*DELIVID*/}' AND DP.IdOrder='{/*CMDID*/}'
SQL5_17=GROUP BY D.Currency, DP.IdProduct, Prd.ID, Prd.Family, Prd.Designation, Prd.PriceUnit, Prd.QuantityPackaging, DP.IdVAT, DP.PriceUnit, DP.Discount, LP.NoLot, LP.DateCreate, LP.DateExpiration
SQL5_18=ORDER BY Prd.FAmily, Prd.Designation
 

DATA6=LIVRAISONTOTAL
NAME6=LIVRAISONTOTAL

// 2021.02.22 iif discount<0 , Frais service DAP

SQL6=SELECT DISTINCT
SQL6_1=   '1' as "ORD",
SQL6_2=   'TOTAL' as "TITLE",
SQL6_3=   concat(format(sum(DP.QuantityReal),0),' ') as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_4=   concat(format(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is NULL or DP.Discount=0 THEN 0.0 ELSE DP.Discount END))/100.0, 2)), 2), ' ', (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END)) as PriceHT
SQL6_5=  FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}DELIVERY_PRODUCT DP on DP.IdDelivery=D.Id
SQL6_6=  WHERE D.Id='{/*CODEDELIVERY*/}' group by D.Currency
SQL6_7=UNION SELECT DISTINCT
SQL6_8=   '2' as "ORD",
SQL6_9=   (CASE WHEN D.LabelDiscount is not NULL and D.LabelDiscount>' ' THEN D.LabelDiscount WHEN D.Discount>0 THEN 'Frais Service DAP' WHEN CL.Country='France' THEN 'REMISE' ELSE 'DISCOUNT' END) as "TITLE",
SQL6_10=  format(D.AmountHT, 2) as "QTY", ' ' as "Price", concat(format(D.Discount,1), ' % ') as "Discount",
SQL6_11=  concat(format(D.AmountHT*(-D.Discount)/100.0,2) , ' ', (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END)) as DiscountHT
SQL6_12= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL6_13= WHERE CL.Id=D.IdClient AND D.Discount is not NULL AND D.Discount<>0 
SQL6_14=    AND D.Id='{/*CODEDELIVERY*/}'
SQL6_15=UNION SELECT DISTINCT
SQL6_16=  '3' as "ORD",
SQL6_17=  'TOTAL H.T.' as "TITLE",
SQL6_18=  ' ' as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_19=  concat(format(D.AmountHT*(100.0-D.Discount)/100.0,2) , ' ', (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END))
SQL6_20= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL6_21= WHERE CL.Id=D.IdClient AND D.Discount is not NULL AND D.Discount<>0
SQL6_22=    AND D.Id='{/*CODEDELIVERY*/}'
SQL6_23=UNION SELECT DISTINCT
SQL6_24=  '4' as "ORD",
SQL6_25=  'Remise Globalisée' as "TITLE",
SQL6_26=  ' ' as "QTY", ' ' as "Price", concat(format((select sum(DP.PriceUnit*DP.Quantity*DP.Discount) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id and DP.Discount is not NULL)/(select sum(DP.PriceUnit*DP.Quantity) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id), 2), '% ') as "Discount",
SQL6_27=  concat(format((select sum(DP.PriceUnit*DP.Quantity*DP.Discount) from {/*OWNER*/}DELIVERY_PRODUCT DP where DP.IdDelivery=D.Id and DP.Discount is not NULL)/100.0, 2) , ' ' , (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END) ) as TotalHT
SQL6_28= FROM {/*OWNER*/}DELIVERY D
SQL6_29= WHERE exists (select 1 from {/*OWNER*/}DELIVERY_PRODUCT LD0 where LD0.IdDelivery=D.Id and LD0.Discount is not NULL and LD0.Discount>0)
SQL6_30=  AND D.Id='{/*CODEDELIVERY*/}'

SQL6_31=UNION SELECT DISTINCT
SQL6_32=  '5' as "ORD",
SQL6_33=  'Paiement Anticipé' as "TITLE", 
SQL6_34=  ' ' as "QTY", ' ' as "Price", ' ' as "Discount",
SQL6_35=  concat(format(-D.AdvancePayment,2), ' ', (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE '€' END)) as TotalHT
SQL6_36= FROM {/*OWNER*/}DELIVERY D
SQL6_37= Where D.AdvancePayment is not NULL and D.AdvancePayment>0
SQL6_38=  AND D.Id='{/*CODEDELIVERY*/}'
SQL6_39= ORDER BY ORD


DATA7=TOTAL
NAME7=TOTAL

SQL7=SELECT DISTINCT
SQL7_1=   (CASE WHEN CL.Country='France' THEN  'TOTAL H.T.' ELSE 'TOTAL H.T.' END) as C1,
SQL7_2=   (CASE WHEN CL.Country='France' THEN  'TOTAL T.V.A.' ELSE 'TOTAL V.A.T.' END) as C3,
SQL7_3=   (CASE WHEN CL.Country='France' THEN  'TOTAL TTC' ELSE 'TOTAL PRICE' END) as C4, 
SQL7_4=   (CASE WHEN CL.Country='France' THEN  'NET A PAYER' ELSE 'NET TO PAY' END) as C5, 
SQL7_5=   concat(format(D.AmountHT*(CASE WHEN D.Discount is NULL THEN 100.0 ELSE (100.0-D.Discount) END)/100.0, 2), (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE ' €' END)) as PriceHT,
SQL7_6=   concat(format(tabTVA.TotalTVA*(CASE WHEN D.Discount is NULL THEN 100.0 ELSE (100.0-D.Discount) END)/100.0, 2), (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE ' €' END)) as PriceTVA,
SQL7_7=   concat(format(round(tabTVA.TotalTVA*(CASE WHEN D.Discount is NULL THEN 100.0 ELSE (100.0-D.Discount) END)/100.0, 2)+round(D.AmountHT*(CASE WHEN D.Discount is NULL THEN 100.0 ELSE (100.0-D.Discount) END)/100.0, 2), 2), (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE ' €' END)) as PriceTotal,
SQL7_8=  concat(format(round((tabTVA.TotalTVA+D.AmountHT)*(CASE WHEN D.Discount is NULL THEN 100.0 ELSE (100.0-D.Discount) END)/100.0, 2) +(CASE WHEN D.AdvancePayment is not NULL and D.AdvancePayment>0 THEN -D.AdvancePayment ELSE 0 END), 2) , (CASE WHEN D.Currency is not NULL and D.Currency>' ' THEN D.Currency ELSE ' €' END)) as NetToPay,
SQL7_9=   (CASE WHEN CL.Country='France' THEN  'TAUX T.V.A.' ELSE 'TAUX V.A.T.' END) as C2,
SQL7_10=   concat((CASE WHEN tabTVA.MinTVA=tabTVA.MaxTVA THEN format(tabTVA.MaxTVA,2) ELSE 'xx' END), ' %') as TVA,

SQL7_11=  concat((CASE WHEN CL.Country='France' THEN  'Paiement Anticipé : ' ELSE 'Advance Payment : ' END), (CASE WHEN D.AdvancePayment is not NULL and D.AdvancePayment>0 THEN format(D.AdvancePayment,2) WHEN CL.Country='France' THEN 'pas d''escompte' ELSE 'without discount' END) ) as Prepay_C11,
SQL7_12=  (select B.PenaltyLatePayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as Pelnal_C12,
SQL7_13=  (select B.CommentsPayment from {/*OWNER*/}BANKACCOUNT B where B.Id=CL.BankAccount) as REGL,
SQL7_14=  (CASE WHEN CL.Country='France' THEN  ' ' ELSE 'Exonération de T.V.A. Article 262 TER-l du CGI' END) as ExoTVA,
SQL7_15=  (CASE WHEN CL.Country='France' THEN concat('Date Facture : le ' , date_format(D.DateInvoice, '%d/%m/%Y')) ELSE concat('Date Invoice : ' , date_format(D.DateInvoice,'%Y-%m-%d') ) END) as DateFact,
SQL7_16=  (CASE WHEN CL.Country='France' THEN concat('Echéance : le ', date_format(D.DatePayment, '%d/%m/%Y')) ELSE concat('Payment Due : ' , date_format(D.DatePayment, '%Y-%m-%d') ) END) as DateMaxPayment

SQL7_17= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL,
SQL7_18=   (SELECT DISTINCT 
SQL7_19=      DP.IdDelivery as IdLD, min(T.VAT) as MinTVA, max(T.VAT) as MaxTVA,
SQL7_20=      round(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0,2)*T.VAT)/100.0, 2) as TotalTVA 
SQL7_21=    FROM {/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}VAT T 
SQL7_22=    WHERE T.Id=DP.IdVAT AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL7_23=    Group by DP.IdDelivery ) tabTVA
SQL7_24= WHERE CL.Id=D.IdClient and tabTVA.IdLD=D.Id AND D.Id='{/*CODEDELIVERY*/}'



