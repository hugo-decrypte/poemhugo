//  calcul des TVA par code et la totale
DATA12=TVA
NAME12=TVA

SQL12=SELECT TITLE, QTY, Price, AmountTVA from
SQL12_1=(SELECT DISTINCT T.Id as "TITLE",
SQL12_2=   format(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0, 2)), 2) as "QTY", 
SQL12_3=   concat(format(T.VAT, 2), '% ') as "Price",
SQL12_4=   format(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0, 2))*T.VAT/100.0, 2) as AmountTVA
SQL12_5= FROM {/*OWNER*/}DELIVERY D,{/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL12_6= WHERE D.Id=DP.IdDelivery and T.Id=DP.IdVAT and CL.Id=D.IdClient and CL.Country in ('France','FRANCE')
SQL12_7=    AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL12_8= Group BY T.Id,T.VAT

SQL12_9=UNION ALL SELECT DISTINCT 'Total' as "TITLE",
SQL12_10=  format(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0, 2)), 2) as "QTY", 
SQL12_11=  ' ' as "Price",
SQL12_12=  format(sum(round(DP.PriceUnit*DP.Quantity*(100.0-(CASE WHEN DP.Discount is not NULL and DP.Discount<>0 THEN DP.Discount ELSE 0 END))/100.0, 2))*T.VAT/100.0, 2) as AmountTVA
SQL12_13= FROM {/*OWNER*/}DELIVERY D,{/*OWNER*/}DELIVERY_PRODUCT DP, {/*OWNER*/}VAT T, {/*OWNER*/}CLIENT CL
SQL12_14= WHERE D.Id=DP.IdDelivery and T.Id=DP.IdVAT and CL.Id=D.IdClient and CL.Country in ('France','FRANCE')
SQL12_15=    AND DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL12_16= GROUP BY CL.Country

SQL12_17=UNION ALL SELECT DISTINCT
SQL12_18= 'Exonéré' as "TITLE",
SQL12_19=  ' ' as "QTY", 
SQL12_20=  ' ' as "Price",
SQL12_21=  ' ' as AmountTVA
SQL12_22= FROM {/*OWNER*/}DELIVERY D, {/*OWNER*/}CLIENT CL
SQL12_23= WHERE CL.Id=D.IdClient and CL.Country not in ('France','FRANCE')
SQL12_24=    AND D.Id='{/*CODEDELIVERY*/}') t2



