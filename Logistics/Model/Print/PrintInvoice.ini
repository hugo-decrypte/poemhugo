DATA10=LINE_BANQUEINFO
NAME10=LINEBANQUEINFO

SQL10=SELECT 
SQL10_1=   concat(B.CommentsBefore , ' ' , D.IdInvoice) as Info,
SQL10_2=   1 as ORD
SQL10_3= FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}BANKACCOUNT B on B.Id=D.BankAccount
SQL10_4= WHERE D.Id='{/*CODEDELIVERY*/}' AND CommentsBefore is not NULL and CommentsBefore>' '

SQL10_5= UNION ALL SELECT 
SQL10_6=   concat((CASE WHEN B.Name is NULL THEN ' ' ELSE trim(B.Name) END), ' ', (CASE WHEN B.Address is NULL THEN ' ' ELSE trim(B.Address) END), ' Tel. ', (CASE WHEN B.Phone is NULL THEN ' ' ELSE trim(B.Phone) END)) as Info,
SQL10_7=   2 as ORD
SQL10_8= FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}BANKACCOUNT B on B.Id=D.BankAccount
SQL10_9= WHERE D.Id='{/*CODEDELIVERY*/}'
SQL10_10=  and ((B.Name is not NULL and B.Name>' ') 
SQL10_11=    or (B.Address is not NULL and B.Address>' ') 
SQL10_12=    or (B.Phone is not NULL and B.Phone>' ') )

SQL10_13= UNION ALL SELECT 
SQL10_14=  concat('RIB : ', (CASE WHEN B.RIB is NULL THEN ' ' ELSE trim(B.RIB) END), ' Domiciliation : ', (CASE WHEN B.Domiciliation is NULL THEN ' ' ELSE trim(B.Domiciliation) END)) as Info,
SQL10_15=   3 as ORD
SQL10_16= FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}BANKACCOUNT B on B.Id=D.BankAccount
SQL10_17= where D.Id='{/*CODEDELIVERY*/}'
SQL10_18=  and ((B.RIB is not NULL and B.RIB>' ') 
SQL10_19=    or (B.Domiciliation is not NULL and B.Domiciliation>' ') )

SQL10_20= UNION ALL SELECT 
SQL10_21=  concat('IBAN : ', (CASE WHEN B.IBAN is NULL THEN ' ' ELSE trim(B.IBAN) END), '   SWIFT CODE (BIC) : ', (CASE WHEN B.BIC is NULL THEN ' ' ELSE trim(B.BIC) END)) as Info,
SQL10_22=   4 as ORD
SQL10_23= FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}BANKACCOUNT B on B.Id=D.BankAccount
SQL10_24= WHERE D.Id='{/*CODEDELIVERY*/}'
SQL10_25=  and ((B.IBAN is not NULL and B.IBAN>' ') or (B.BIC is NULL is not NULL and B.BIC>' ') )

SQL10_26= UNION ALL SELECT 
SQL10_27=  B.CommentsAfter1 as Info,
SQL10_28=   5 as ORD
SQL10_29= FROM {/*OWNER*/}DELIVERY D inner join {/*OWNER*/}BANKACCOUNT B on B.Id=D.BankAccount
SQL10_30= WHERE D.Id='{/*CODEDELIVERY*/}'
SQL10_31=  and (B.CommentsAfter1 is not NULL and B.CommentsAfter1>' ') 

SQL10_32= UNION ALL SELECT 
SQL10_33=  B.CommentsAfter2 as Info,
SQL10_34=   6 as ORD
SQL10_35= FROM ({/*OWNER*/}DELIVERY D inner join {/*OWNER*/}CLIENT CL on CL.Id=D.IdClient) inner join {/*OWNER*/}BANKACCOUNT B on B.Id=CL.BankAccount
SQL10_36= WHERE D.Id='{/*CODEDELIVERY*/}'
SQL10_37=  and (B.CommentsAfter2 is not NULL and B.CommentsAfter2>' ') 

SQL10_38=UNION ALL SELECT 
SQL10_39=   D.CustomsInfo as Info,
SQL10_40=   10 as ORD
SQL10_41=FROM {/*OWNER*/}DELIVERY D
SQL10_42= WHERE D.Id='{/*CODEDELIVERY*/}' AND D.CustomsInfo is not NULL and D.CustomsInfo>' '

SQL10_43= UNION ALL SELECT 
SQL10_44=   concat(trim(P.Designation) , ' : ' , DP.Comments) as Info,
SQL10_45=   (select count(1)+10 from {/*OWNER*/}DELIVERY_PRODUCT DP1 where DP1.IdDelivery=DP.IdDelivery and DP1.IdProduct<=DP.IdProduct) as ORD
SQL10_46=  FROM {/*OWNER*/}DELIVERY_PRODUCT DP inner join {/*OWNER*/}PRODUCT P on DP.IdProduct=P.ID
SQL10_47=  WHERE 
SQL10_48=   DP.IdDelivery='{/*CODEDELIVERY*/}'
SQL10_49=   AND DP.Comments is not NULL and DP.Comments>' '

